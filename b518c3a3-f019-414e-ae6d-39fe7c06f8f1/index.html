<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;position:relative}
h1{font-size:18px;margin:0}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#3ecf8e;color:#08130d;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1a1d23;border:1px solid #2c313a;border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:#9aa3ad;margin-top:-4px;padding:0 6px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button:disabled{opacity:.5}
.muted{color:#9aa3ad;font-size:14px}
.err{color:#ff7b72;font-size:14px;padding:0 14px}
.typing{align-self:flex-start;color:#9aa3ad;font-size:14px;padding:0 6px}
#tasks{flex:1;overflow-y:auto;padding:8px 14px}
.card{background:#161a20;border:1px solid #2c313a;border-radius:12px;padding:12px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.segbar{display:flex;gap:2px;margin:4px 0}
.seg{flex:1;height:8px;border-radius:2px;background:#2c313a}
.seg.on{background:#3ecf8e}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.task-full{white-space:pre-wrap;background:#12151a;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;max-height:320px;overflow-y:auto;font-size:14px}
.streak-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid;cursor:pointer;user-select:none;transition:border-color .2s,background .2s,color .2s}
.streak-chip .flame{flex:0 0 auto}
.streak-pop{position:absolute;top:40px;left:14px;z-index:20;background:#1a1d23;border:1px solid #2c313a;border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:230px}
.streak-pop-title{font-size:12px;color:#9aa3ad;margin:0 0 2px;font-weight:600}
.streak-pop-sub{font-size:11px;color:#5c636e;margin:0 0 8px}
.streak-days{display:flex;gap:8px;justify-content:space-between}
.streak-day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#9aa3ad}
.streak-day .flame{opacity:.25}
.streak-day.active .flame{opacity:1}
.streak-day.today{color:#e6e6e6;font-weight:600}
.demo-banner{font-size:11px;color:#5c636e;text-align:center;padding:6px 0 0}
</style></head><body>
<div id="root"></div>
<script>
// ============================================================================
// Alleah - home view preview (daily-streak counter chip)
// Fully self-contained static demo. No network calls, no auth, no backend.
// All data below is synthetic/generic fixture data baked in for preview only.
// ============================================================================
(function () {
  var root = document.getElementById('root');

  // ---- synthetic fixtures -------------------------------------------------
  function isoDate(d) { return d.toISOString().slice(0, 10); }

  // Build a synthetic "last 30 active days" set: an unbroken 5-day streak
  // ending today, plus a couple of older scattered active days.
  var today = new Date(); today.setUTCHours(0, 0, 0, 0);
  function daysAgoIso(n) { var d = new Date(today); d.setUTCDate(d.getUTCDate() - n); return isoDate(d); }
  var ACTIVE_DAYS = new Set([
    daysAgoIso(0), daysAgoIso(1), daysAgoIso(2), daysAgoIso(3), daysAgoIso(4),
    daysAgoIso(9), daysAgoIso(10), daysAgoIso(15)
  ]);

  var DEMO_MESSAGES = [
    { role: 'assistant', content: "Hey! I remembered you're prepping the Q3 deck - want the notes from last time?" },
    { role: 'user', content: 'Yes please, and remind me who owns the budget slide.' },
    { role: 'assistant', content: "Priya owns the budget slide. Your notes: switch the chart to quarterly view, cut the roadmap slide in half.", folders: [{ n: 1, title: 'Q3 Planning' }] }
  ];

  var DEMO_TASKS = [
    { id: 't1', status: 'running', instruction: 'Summarize the last 10 meeting notes into a one-page brief and flag any open action items.', progress: 'reading note 7 of 10', steps_used: 11, spend_usd: 0.09, created_at: minsAgo(6), completed_at: null },
    { id: 't2', status: 'done', instruction: 'Draft a follow-up email to the design team about the icon set review.', steps_used: 6, spend_usd: 0.03, created_at: minsAgo(190), completed_at: minsAgo(180), result: "Draft sent to your outbox:\n\nSubject: Icon set review - a few notes\n\nHi team, quick follow up on Tuesday's review..." },
    { id: 't3', status: 'failed', instruction: 'Pull the latest analytics export and chart weekly active users.', steps_used: 3, spend_usd: 0.01, created_at: minsAgo(1400), completed_at: minsAgo(1395), error: 'Source export was not reachable from this workspace.' }
  ];

  function minsAgo(m) { return new Date(Date.now() - m * 60000).toISOString(); }

  // ---- streak logic (mirrors the real app; local-state only in this demo) --
  function computeStreakInfo(activeSet) {
    var last7 = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today); d.setUTCDate(d.getUTCDate() - i);
      var iso = isoDate(d);
      last7.push({
        date: iso,
        active: activeSet.has(iso),
        label: d.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 1),
        today: i === 0
      });
    }
    var streak = 0;
    var cursor = new Date(today);
    if (!activeSet.has(isoDate(cursor))) cursor.setUTCDate(cursor.getUTCDate() - 1);
    while (activeSet.has(isoDate(cursor))) { streak++; cursor.setUTCDate(cursor.getUTCDate() - 1); }
    return { streak: streak, last7: last7 };
  }

  // Flame colour + label scale with streak length. Ordered ascending by
  // `.min`; last matching tier wins. Kept identical to the promotable app.
  var STREAK_TIERS = [
    { min: 0, color: '#5c636e', label: 'No streak yet' },
    { min: 1, color: '#ffb15c', label: 'Just started' },
    { min: 3, color: '#ff9142', label: 'Building' },
    { min: 7, color: '#ff6a3d', label: 'On fire' },
    { min: 14, color: '#ff3b3b', label: 'Blazing' },
    { min: 30, color: '#c084fc', label: 'Unstoppable' },
    { min: 60, color: '#60a5fa', label: 'Legendary' }
  ];
  function streakTier(n) {
    var t = STREAK_TIERS[0];
    for (var i = 0; i < STREAK_TIERS.length; i++) if (n >= STREAK_TIERS[i].min) t = STREAK_TIERS[i];
    return t;
  }
  function hexToRgba(hex, a) {
    var m = hex.replace('#', '');
    var r = parseInt(m.substring(0, 2), 16), g = parseInt(m.substring(2, 4), 16), b = parseInt(m.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // ---- tiny DOM helpers ----------------------------------------------------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'style') node.setAttribute('style', attrs[k]);
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (k === 'html') node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function flameSvg(size, color, dim) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'flame');
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', dim ? '#5c636e' : color);
    if (dim) svg.style.opacity = '.35';
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M12 2c1 3-2 4.5-2 7.5a2 2 0 0 0 4 0c0-1-.5-1.5-.5-1.5 2 1 3.5 3.5 3.5 6a5.5 5.5 0 0 1-11 0C6 9.5 9.5 8 12 2z');
    svg.appendChild(path);
    return svg;
  }

  // ---- streak chip + popover ----------------------------------------------
  function StreakChip(info) {
    var wrap = el('div', { style: 'position:relative' }, []);
    var tier = streakTier(info.streak);
    var open = false;

    var chip = el('div', {
      class: 'streak-chip',
      style: 'border-color:' + tier.color + ';background:' + hexToRgba(tier.color, 0.14) + ';color:' + tier.color,
      title: 'Daily streak'
    }, [flameSvg(14, tier.color, false), el('span', {}, [String(info.streak)])]);

    var pop = null;
    function renderPop() {
      var days = el('div', { class: 'streak-days' }, info.last7.map(function (d) {
        return el('div', { class: 'streak-day' + (d.active ? ' active' : '') + (d.today ? ' today' : '') }, [
          flameSvg(16, tier.color, !d.active),
          el('span', {}, [d.label])
        ]);
      }));
      return el('div', { class: 'streak-pop' }, [
        el('p', { class: 'streak-pop-title' }, [info.streak > 0 ? (info.streak + '-day streak') : 'No active streak yet']),
        el('p', { class: 'streak-pop-sub' }, [tier.label + ' \u00b7 last 7 days']),
        days
      ]);
    }

    chip.addEventListener('click', function (e) {
      e.stopPropagation();
      open = !open;
      if (open) { pop = renderPop(); wrap.appendChild(pop); }
      else if (pop) { wrap.removeChild(pop); pop = null; }
    });
    document.addEventListener('mousedown', function (e) {
      if (open && !wrap.contains(e.target)) { open = false; if (pop) { wrap.removeChild(pop); pop = null; } }
    });

    wrap.appendChild(chip);
    return wrap;
  }

  // ---- header ---------------------------------------------------------------
  function Header(view, onToggleView) {
    var streakInfo = computeStreakInfo(ACTIVE_DAYS);
    var left = el('div', { style: 'display:flex;align-items:center;gap:10px' }, [
      el('h1', {}, ['Alleah']),
      StreakChip(streakInfo)
    ]);
    var right = el('div', { style: 'display:flex;gap:8px' }, [
      el('button', { class: 'secondary', style: 'margin-top:0', onclick: onToggleView }, [view === 'tasks' ? 'Chat' : 'Tasks']),
      el('button', { class: 'secondary', onclick: function () { alert('Demo preview - sign out is disabled.'); } }, ['Sign out'])
    ]);
    return el('header', {}, [left, right]);
  }

  // ---- chat view --------------------------------------------------------
  function ChatView() {
    var messages = DEMO_MESSAGES.slice();
    var thread = el('div', { id: 'thread' }, []);
    var text = '';

    function renderThread() {
      thread.innerHTML = '';
      messages.forEach(function (m) {
        thread.appendChild(el('div', { class: 'msg ' + m.role }, [m.content]));
        if (m.folders && m.folders.length) {
          thread.appendChild(el('div', { class: 'cites' }, ['memory: ' + m.folders.map(function (f) { return '[' + f.n + '] ' + f.title; }).join('  ')]));
        }
      });
      thread.scrollTop = thread.scrollHeight;
    }
    renderThread();

    var textarea = el('textarea', { placeholder: 'Message Alleah...', rows: 1 }, []);
    textarea.addEventListener('input', function () { text = textarea.value; });
    textarea.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    var sendBtn = el('button', { onclick: function () { send(); } }, ['Send']);

    function send() {
      var content = textarea.value.trim();
      if (!content) return;
      messages.push({ role: 'user', content: content });
      textarea.value = ''; renderThread();
      setTimeout(function () {
        messages.push({ role: 'assistant', content: "(demo preview) I've noted that - this reply is canned since there's no live backend here." });
        renderThread();
      }, 500);
    }

    return el('div', { style: 'flex:1;display:flex;flex-direction:column;min-height:0' }, [
      thread,
      el('div', { class: 'composer' }, [textarea, sendBtn])
    ]);
  }

  // ---- tasks view --------------------------------------------------------
  var STATUS_COLOR = { queued: '#9aa3ad', running: '#3ecf8e', done: '#3ecf8e', capped: '#e0a458', failed: '#ff7b72', cancelled: '#5c636e' };
  function fmtAge(iso) {
    var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    if (m < 1440) return Math.floor(m / 60) + 'h ago';
    return Math.floor(m / 1440) + 'd ago';
  }

  function TaskCard(t) {
    var open = false;
    var active = t.status === 'queued' || t.status === 'running';
    var steps = Math.min(t.steps_used || 0, 25);
    var spend = Math.min(Number(t.spend_usd) || 0, 0.5);
    var spendRatio = spend / 0.5;
    var endMs = t.completed_at ? new Date(t.completed_at).getTime() : Date.now();
    var elapsedMs = Math.max(0, Math.min(endMs - new Date(t.created_at).getTime(), 15 * 60000));
    var elapsed = Math.floor(elapsedMs / 60000) + 'm ' + Math.floor((elapsedMs % 60000) / 1000) + 's';
    var spendColor = spendRatio < 0.5 ? '#3ecf8e' : spendRatio < 0.8 ? '#e0a458' : '#ff7b72';
    var color = STATUS_COLOR[t.status] || '#9aa3ad';

    var card = el('div', { class: 'card' }, []);
    var top = el('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:8px' }, [
      el('span', { class: 'badge' }, [
        el('span', { class: 'dot' + (t.status === 'running' ? ' pulse' : ''), style: 'background:' + color }, []),
        el('span', { style: 'color:' + color }, [t.status])
      ]),
      el('span', { class: 'small' }, [fmtAge(t.created_at)])
    ]);
    card.appendChild(top);

    var body = el('div', {}, []);
    var instr = el('p', { style: 'margin:8px 0 4px;cursor:pointer' }, [t.instruction.length > 110 ? t.instruction.slice(0, 110) + '...' : t.instruction]);
    instr.addEventListener('click', function () { open = !open; renderOpen(); });
    body.appendChild(instr);

    if (t.status === 'running' && t.progress) body.appendChild(el('p', { class: 'small', style: 'color:#e6e6e6' }, ['\u25b8 ' + t.progress]));

    if (active) {
      var actWrap = el('div', {}, [
        el('div', { class: 'small' }, ['steps used: ' + steps + ' / 25']),
        el('div', { class: 'segbar' }, Array.from({ length: 25 }, function (_, i) { return el('span', { class: 'seg' + (i < steps ? ' on' : '') }, []); })),
        el('div', { class: 'small' }, ['spend: $' + spend.toFixed(2) + ' / $0.50 cap']),
        el('div', { class: 'meter' }, [el('div', { style: 'width:' + (spendRatio * 100) + '%;background:' + spendColor }, [])]),
        el('div', { class: 'small' }, ['time since queued: ' + elapsed + ' / 15m limit']),
        el('div', { class: 'meter' }, [el('div', { style: 'width:' + (elapsedMs / (15 * 60000) * 100) + '%;background:#3ecf8e' }, [])])
      ]);
      body.appendChild(actWrap);
    }

    var openSlot = el('div', {}, []);
    body.appendChild(openSlot);
    card.appendChild(body);

    function renderOpen() {
      instr.textContent = open ? t.instruction : (t.instruction.length > 110 ? t.instruction.slice(0, 110) + '...' : t.instruction);
      openSlot.innerHTML = '';
      if (!open) return;
      if (t.result) openSlot.appendChild(el('div', { class: 'task-full' }, [t.result]));
      if (t.error) openSlot.appendChild(el('p', { class: 'err', style: 'padding:0' }, [t.error]));
      openSlot.appendChild(el('p', { class: 'small' }, ['steps ' + (t.steps_used || 0) + ' \u00b7 $' + (Number(t.spend_usd) || 0).toFixed(2) +
        ' \u00b7 queued ' + new Date(t.created_at).toLocaleString() + (t.completed_at ? ' \u00b7 finished ' + new Date(t.completed_at).toLocaleString() : '')]));
    }

    return card;
  }

  function TasksView() {
    var wrap = el('div', { id: 'tasks' }, []);
    DEMO_TASKS.forEach(function (t) { wrap.appendChild(TaskCard(t)); });
    return wrap;
  }

  // ---- app shell ----------------------------------------------------------
  var view = 'chat';
  function renderApp() {
    root.innerHTML = '';
    var container = el('div', { style: 'height:100%;display:flex;flex-direction:column' }, []);
    container.appendChild(Header(view, function () { view = view === 'tasks' ? 'chat' : 'tasks'; renderApp(); }));
    container.appendChild(view === 'tasks' ? TasksView() : ChatView());
    container.appendChild(el('p', { class: 'demo-banner' }, ['Static preview \u00b7 synthetic demo data \u00b7 no live backend']));
    root.appendChild(container);
  }
  renderApp();
})();
</script>

<script type="application/json" id="alleah-pin-config">{"task_id": "b518c3a3-f019-414e-ae6d-39fe7c06f8f1", "revision": 2, "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "changelog": [{"revision": 1, "note": "Depending on the length of the streak make the flame change colours", "resolution": "resolved"}]}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
</body></html>
