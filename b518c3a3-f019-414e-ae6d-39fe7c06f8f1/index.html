<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — preview</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;position:relative;gap:8px}
.hleft{display:flex;align-items:center;gap:10px;min-width:0}
.hright{display:flex;gap:8px;flex:0 0 auto}
h1{font-size:18px;margin:0}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#3ecf8e;color:#08130d;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1a1d23;border:1px solid #2c313a;border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:#9aa3ad;margin-top:-4px;padding:0 6px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button:disabled{opacity:.5}
.muted{color:#9aa3ad;font-size:14px}
.err{color:#ff7b72;font-size:14px;padding:0 14px}
.typing{align-self:flex-start;color:#9aa3ad;font-size:14px;padding:0 6px}
#tasks{flex:1;overflow-y:auto;padding:8px 14px}
.card{border:1px solid #2c313a;border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#14171d}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.segbar{display:flex;gap:2px;margin:4px 0}
.seg{flex:1;height:8px;border-radius:2px;background:#2c313a}
.seg.on{background:#3ecf8e}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.task-full{white-space:pre-wrap;background:#12151a;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;max-height:320px;overflow-y:auto;font-size:14px}
.banner{font-size:12px;color:#08130d;background:#3ecf8e;text-align:center;padding:4px 8px}

.streak-wrap{position:relative}
.streak-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid;cursor:pointer;user-select:none;transition:border-color .2s,background .2s,color .2s}
.streak-chip .flame{flex:0 0 auto}
.streak-pop{position:absolute;top:34px;left:0;z-index:20;background:#1a1d23;border:1px solid #2c313a;border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:230px}
.streak-pop-title{font-size:12px;color:#9aa3ad;margin:0 0 2px;font-weight:600}
.streak-pop-sub{font-size:11px;color:#5c636e;margin:0 0 8px}
.streak-days{display:flex;gap:8px;justify-content:space-between}
.streak-day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#9aa3ad}
.streak-day .flame{opacity:.25}
.streak-day.active .flame{opacity:1}
.streak-day.today{color:#e6e6e6;font-weight:600}
.streak-demo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #2c313a}
.streak-demo button{padding:0 10px;height:26px;border-radius:8px;font-size:14px;line-height:1;background:#2c313a;color:#e6e6e6}
</style></head><body>
<div class="banner">Static preview — synthetic demo data, no live accounts or network calls</div>
<div id="root"></div>
<script>
(function(){
  var h = function(tag, attrs){
    var el = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'style') el.setAttribute('style', attrs[k]);
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'html') el.innerHTML = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      if (Array.isArray(c)) c.forEach(function(cc){ if (cc) el.appendChild(cc); });
      else if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    }
    return el;
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ===== Daily streak: flame colour scales with streak length =====
  var TIERS = [
    {min: 0,  color: '#5c636e', label: 'No streak yet'},
    {min: 1,  color: '#ffb15c', label: 'Just started'},
    {min: 3,  color: '#ff9142', label: 'Building'},
    {min: 7,  color: '#ff6a3d', label: 'On fire'},
    {min: 14, color: '#ff3b3b', label: 'Blazing'},
    {min: 30, color: '#c084fc', label: 'Unstoppable'},
    {min: 60, color: '#60a5fa', label: 'Legendary'}
  ];
  function tierFor(n) {
    var t = TIERS[0];
    for (var i = 0; i < TIERS.length; i++) if (n >= TIERS[i].min) t = TIERS[i];
    return t;
  }
  function hexToRgba(hex, a) {
    var m = hex.replace('#','');
    var r = parseInt(m.substring(0,2),16), g = parseInt(m.substring(2,4),16), b = parseInt(m.substring(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function flameSvg(size, color, dim) {
    return '<svg class="flame" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' +
      (dim ? '#5c636e' : color) + '" style="' + (dim ? 'opacity:.35' : '') + '">' +
      '<path d="M12 2c1 3-2 4.5-2 7.5a2 2 0 0 0 4 0c0-1-.5-1.5-.5-1.5 2 1 3.5 3.5 3.5 6a5.5 5.5 0 0 1-11 0C6 9.5 9.5 8 12 2z"/></svg>';
  }

  var DOW = ['S','M','T','W','T','F','S'];
  function last7For(streak) {
    var active = Math.max(0, Math.min(streak, 7));
    var days = [];
    var today = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push({ label: DOW[d.getDay()], active: i < active, today: i === 0 });
    }
    return days;
  }

  // ===== Fixture data (synthetic, static) =====
  var state = {
    view: 'chat',
    streak: 16,
    popoverOpen: false,
    busy: false,
    messages: [
      {role:'assistant', content:"Hey — welcome back. I remembered you're prepping the Q3 offsite deck."},
      {role:'user', content:"Yeah. Can you pull up what I told you about the venue shortlist?"},
      {role:'assistant', content:"You'd narrowed it to Cedar Hall and The Boathouse, leaning Cedar Hall for the AV setup.", folders:[{n:1, title:'Q3 Offsite'}, {n:2, title:'Venues'}]}
    ],
    tasks: [
      {id:'t1', status:'running', instruction:'Summarize last week\u2019s standup notes into action items and owners.', progress:'reading source notes (3/5)', steps_used: 9, spend_usd: 0.11, created_at: new Date(Date.now()-6*60000).toISOString()},
      {id:'t2', status:'done', instruction:'Draft a follow-up email to the Cedar Hall venue contact confirming the March 14 hold.', result:'Subject: Confirming March 14 hold — Cedar Hall\n\nHi Priya,\n\nConfirming we\u2019d like to hold Cedar Hall for March 14 (est. 40 guests). Could you send the updated contract?\n\nThanks,\nAlleah on behalf of the team', steps_used: 14, spend_usd: 0.18, created_at: new Date(Date.now()-3*3600000).toISOString(), completed_at: new Date(Date.now()-3*3600000+240000).toISOString()},
      {id:'t3', status:'failed', instruction:'Cross-check budget spreadsheet totals against the vendor invoices folder.', error:'Could not locate a linked spreadsheet in memory — ask to attach one first.', steps_used: 4, spend_usd: 0.04, created_at: new Date(Date.now()-26*3600000).toISOString(), completed_at: new Date(Date.now()-26*3600000+90000).toISOString()},
      {id:'t4', status:'cancelled', instruction:'Generate five icebreaker prompts for the offsite kickoff.', steps_used: 2, spend_usd: 0.01, created_at: new Date(Date.now()-49*3600000).toISOString(), completed_at: new Date(Date.now()-49*3600000+60000).toISOString()}
    ]
  };

  var STATUS_COLOR = {queued:'#9aa3ad', running:'#3ecf8e', done:'#3ecf8e', capped:'#e0a458', failed:'#ff7b72', cancelled:'#5c636e'};

  function fmtAge(iso) {
    var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    if (m < 1440) return Math.floor(m/60) + 'h ago';
    return Math.floor(m/1440) + 'd ago';
  }

  // ===== Render =====
  var root = document.getElementById('root');

  function render() {
    root.innerHTML = '';
    root.appendChild(renderHeader());
    if (state.view === 'tasks') root.appendChild(renderTasks());
    else root.appendChild(renderChat());
  }

  function renderStreakChip() {
    var tier = tierFor(state.streak);
    var wrap = h('div', {class:'streak-wrap'});
    var chip = h('div', {
      class:'streak-chip',
      style:'border-color:' + tier.color + ';background:' + hexToRgba(tier.color, 0.14) + ';color:' + tier.color,
      title: 'Daily streak',
      onclick: function(e){ e.stopPropagation(); state.popoverOpen = !state.popoverOpen; render(); }
    });
    chip.innerHTML = flameSvg(14, tier.color, false) + '<span>' + state.streak + '</span>';
    wrap.appendChild(chip);

    if (state.popoverOpen) {
      var pop = h('div', {class:'streak-pop', onclick:function(e){ e.stopPropagation(); }});
      pop.appendChild(h('p', {class:'streak-pop-title'},
        state.streak > 0 ? state.streak + '-day streak' : 'No active streak yet'));
      pop.appendChild(h('p', {class:'streak-pop-sub'}, tier.label + ' · last 7 days'));
      var days = h('div', {class:'streak-days'});
      last7For(state.streak).forEach(function(d){
        var cell = h('div', {class:'streak-day' + (d.active ? ' active' : '') + (d.today ? ' today' : '')});
        cell.innerHTML = flameSvg(16, tier.color, !d.active) + '<span>' + d.label + '</span>';
        days.appendChild(cell);
      });
      pop.appendChild(days);
      var demo = h('div', {class:'streak-demo'});
      demo.appendChild(h('span', {class:'small'}, 'preview only: adjust streak'));
      var btns = h('div', {style:'display:flex;gap:6px'});
      btns.appendChild(h('button', {onclick:function(e){ e.stopPropagation(); state.streak = Math.max(0, state.streak - 1); render(); }}, '\u2212'));
      btns.appendChild(h('button', {onclick:function(e){ e.stopPropagation(); state.streak = Math.min(120, state.streak + 1); render(); }}, '+'));
      demo.appendChild(btns);
      pop.appendChild(demo);
      wrap.appendChild(pop);
    }
    return wrap;
  }

  function renderHeader() {
    var header = h('header', {});
    var left = h('div', {class:'hleft'});
    left.appendChild(h('h1', {}, 'Alleah'));
    left.appendChild(renderStreakChip());
    header.appendChild(left);

    var right = h('div', {class:'hright'});
    right.appendChild(h('button', {class:'secondary', style:'margin-top:0', onclick:function(){ state.view = state.view === 'tasks' ? 'chat' : 'tasks'; render(); }}, state.view === 'tasks' ? 'Chat' : 'Tasks'));
    right.appendChild(h('button', {class:'secondary', onclick:function(){ if (confirm('Clear this conversation? (Your memory folders are not affected.)')) { state.messages = []; render(); } }}, 'New chat'));
    right.appendChild(h('button', {class:'secondary', onclick:function(){ alert('This is a static preview — sign out is disabled.'); }}, 'Sign out'));
    header.appendChild(right);
    return header;
  }

  function renderChat() {
    var frag = document.createDocumentFragment();
    var thread = h('div', {id:'thread'});
    if (state.messages.length === 0) {
      thread.appendChild(h('p', {class:'muted', style:'padding:0 6px'}, 'Talk to me. What you tell me about what you know gets remembered - automatically.'));
    }
    state.messages.forEach(function(m){
      thread.appendChild(h('div', {class:'msg ' + m.role}, m.content));
      if (m.folders && m.folders.length) {
        thread.appendChild(h('div', {class:'cites'}, 'memory: ' + m.folders.map(function(f){ return '[' + f.n + '] ' + f.title; }).join('  ')));
      }
    });
    if (state.busy) thread.appendChild(h('div', {class:'typing'}, 'thinking...'));
    var endMarker = h('div', {});
    thread.appendChild(endMarker);
    frag.appendChild(thread);

    var composer = h('div', {class:'composer'});
    var ta = h('textarea', {placeholder:'Message Alleah...', rows:'1'});
    var sendBtn = h('button', {onclick: function(){ send(ta.value); }}, 'Send');
    ta.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(ta.value); }
    });
    composer.appendChild(ta);
    composer.appendChild(sendBtn);
    frag.appendChild(composer);

    setTimeout(function(){ endMarker.scrollIntoView({behavior:'smooth'}); }, 0);
    return frag;
  }

  function send(content) {
    content = (content || '').trim();
    if (!content || state.busy) return;
    state.messages.push({role:'user', content: content});
    state.busy = true;
    render();
    setTimeout(function(){
      state.messages.push({role:'assistant', content: "Noted — I've filed that away. (This is a static preview, so replies are canned.)"});
      state.busy = false;
      render();
    }, 700);
  }

  function renderTasks() {
    var wrap = h('div', {id:'tasks'});
    state.tasks.forEach(function(t){ wrap.appendChild(renderTaskCard(t)); });
    return wrap;
  }

  function renderTaskCard(t) {
    var active = t.status === 'queued' || t.status === 'running';
    var steps = Math.min(t.steps_used || 0, 25);
    var spend = Math.min(Number(t.spend_usd) || 0, 0.5);
    var spendRatio = spend / 0.5;
    var endMs = t.completed_at ? new Date(t.completed_at).getTime() : Date.now();
    var elapsedMs = Math.max(0, Math.min(endMs - new Date(t.created_at).getTime(), 15*60000));
    var elapsed = Math.floor(elapsedMs/60000) + 'm ' + Math.floor((elapsedMs%60000)/1000) + 's';
    var spendColor = spendRatio < 0.5 ? '#3ecf8e' : spendRatio < 0.8 ? '#e0a458' : '#ff7b72';
    var color = STATUS_COLOR[t.status] || '#9aa3ad';
    var open = !!t._open;

    var card = h('div', {class:'card'});
    var top = h('div', {style:'display:flex;justify-content:space-between;align-items:center;gap:8px'});
    var badge = h('span', {class:'badge'});
    badge.innerHTML = '<span class="dot' + (t.status==='running' ? ' pulse' : '') + '" style="background:' + color + '"></span><span style="color:' + color + '">' + t.status + '</span>';
    top.appendChild(badge);
    top.appendChild(h('span', {class:'small'}, fmtAge(t.created_at)));
    if (active) {
      top.appendChild(h('button', {class:'secondary', style:'margin-top:0;padding:4px 10px;font-size:12px', onclick:function(e){ e.stopPropagation(); if (confirm('Cancel this task?')) { t.status = 'cancelled'; render(); } }}, 'Cancel'));
    }
    card.appendChild(top);

    var instrEl = h('p', {style:'margin:8px 0 4px;cursor:pointer', onclick:function(){ t._open = !t._open; render(); }},
      open ? t.instruction : (t.instruction.length > 110 ? t.instruction.slice(0,110) + '...' : t.instruction));
    card.appendChild(instrEl);

    if (t.status === 'running' && t.progress) {
      card.appendChild(h('p', {class:'small', style:'color:#e6e6e6'}, '\u25b8 ' + t.progress));
    }

    if (active) {
      var box = h('div', {});
      box.appendChild(h('div', {class:'small'}, 'steps used: ' + steps + ' / 25'));
      var segbar = h('div', {class:'segbar'});
      for (var i = 0; i < 25; i++) segbar.appendChild(h('span', {class:'seg' + (i < steps ? ' on' : '')}));
      box.appendChild(segbar);
      box.appendChild(h('div', {class:'small'}, 'spend: $' + spend.toFixed(2) + ' / $0.50 cap'));
      var m1 = h('div', {class:'meter'}); m1.appendChild(h('div', {style:'width:' + (spendRatio*100) + '%;background:' + spendColor})); box.appendChild(m1);
      box.appendChild(h('div', {class:'small'}, 'time since queued: ' + elapsed + ' / 15m limit (worker may start up to 1m after queuing)'));
      var m2 = h('div', {class:'meter'}); m2.appendChild(h('div', {style:'width:' + (elapsedMs/(15*60000)*100) + '%;background:#3ecf8e'})); box.appendChild(m2);
      card.appendChild(box);
    }

    if (open) {
      if (t.result) card.appendChild(h('div', {class:'task-full'}, t.result));
      if (t.error) card.appendChild(h('p', {class:'err', style:'padding:0'}, t.error));
      card.appendChild(h('p', {class:'small'}, 'steps ' + (t.steps_used || 0) + ' \u00b7 $' + (Number(t.spend_usd)||0).toFixed(2) +
        ' \u00b7 queued ' + new Date(t.created_at).toLocaleString() +
        (t.completed_at ? ' \u00b7 finished ' + new Date(t.completed_at).toLocaleString() : '')));
    }
    return card;
  }

  document.addEventListener('click', function(){ if (state.popoverOpen) { state.popoverOpen = false; render(); } });

  render();
})();
</script>

<script type="application/json" id="alleah-pin-config">{"task_id": "b518c3a3-f019-414e-ae6d-39fe7c06f8f1", "revision": 1, "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "changelog": [{"revision": 0, "note": "Depending on the length of the streak make the flame change colours", "resolution": "resolved"}]}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
</body></html>
