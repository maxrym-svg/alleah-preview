<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — preview</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;position:relative}
h1{font-size:18px;margin:0}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#3ecf8e;color:#08130d;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1a1d23;border:1px solid #2c313a;border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:#9aa3ad;margin-top:-4px;padding:0 6px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button:disabled{opacity:.5}
.muted{color:#9aa3ad;font-size:14px}
.err{color:#ff7b72;font-size:14px;padding:0 14px}
.typing{align-self:flex-start;color:#9aa3ad;font-size:14px;padding:0 6px}
#tasks{flex:1;overflow-y:auto;padding:8px 14px}
.card{background:#12151a;border:1px solid #2c313a;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.segbar{display:flex;gap:2px;margin:4px 0}
.seg{flex:1;height:8px;border-radius:2px;background:#2c313a}
.seg.on{background:#3ecf8e}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.task-full{white-space:pre-wrap;background:#12151a;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;max-height:320px;overflow-y:auto;font-size:14px}
.streak-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid;cursor:pointer;user-select:none;transition:border-color .2s,background .2s,color .2s}
.streak-chip .flame{flex:0 0 auto}
.streak-pop{position:absolute;top:40px;left:14px;z-index:20;background:#1a1d23;border:1px solid #2c313a;border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:230px}
.streak-pop-title{font-size:12px;color:#9aa3ad;margin:0 0 2px;font-weight:600}
.streak-pop-sub{font-size:11px;color:#5c636e;margin:0 0 8px}
.streak-days{display:flex;gap:8px;justify-content:space-between}
.streak-day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#9aa3ad}
.streak-day .flame{opacity:.25}
.streak-day.active .flame{opacity:1}
.streak-day.today{color:#e6e6e6;font-weight:600}
.preview-tag{position:fixed;bottom:8px;right:10px;font-size:10px;color:#5c636e;letter-spacing:.03em;z-index:5}
</style></head><body>
<div id="root"></div>
<div class="preview-tag">STATIC PREVIEW · demo data</div>
<script>
"use strict";

// ============================================================
// Baked demo fixtures only. Nothing here makes a network call -
// this is a self-contained preview of the home header streak chip.
// ============================================================

function isoDate(d) { return d.toISOString().slice(0, 10); }

function computeStreakInfo(activeSet) {
  const today = new Date();
  today.setUTCHours(0, 0, 0, 0);
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setUTCDate(d.getUTCDate() - i);
    const iso = isoDate(d);
    last7.push({
      date: iso,
      active: activeSet.has(iso),
      label: d.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 1),
      today: i === 0,
    });
  }
  let streak = 0;
  const cursor = new Date(today);
  if (!activeSet.has(isoDate(cursor))) cursor.setUTCDate(cursor.getUTCDate() - 1);
  while (activeSet.has(isoDate(cursor))) {
    streak++;
    cursor.setUTCDate(cursor.getUTCDate() - 1);
  }
  return { streak, last7 };
}

// Demo fixture: an unbroken 12-day streak, so all of the last 7 days show active.
const DEMO_ACTIVE_DAYS = (function () {
  const set = new Set();
  const today = new Date();
  today.setUTCHours(0, 0, 0, 0);
  for (let i = 0; i < 12; i++) {
    const d = new Date(today);
    d.setUTCDate(d.getUTCDate() - i);
    set.add(isoDate(d));
  }
  return set;
})();

const STREAK_TIERS = [
  { min: 0,  color: '#5c636e', label: 'No streak yet' },
  { min: 1,  color: '#ffb15c', label: 'Just started' },
  { min: 3,  color: '#ff9142', label: 'Building' },
  { min: 7,  color: '#ff6a3d', label: 'On fire' },
  { min: 14, color: '#ff3b3b', label: 'Blazing' },
  { min: 30, color: '#c084fc', label: 'Unstoppable' },
  { min: 60, color: '#60a5fa', label: 'Legendary' },
];

function streakTier(n) {
  let t = STREAK_TIERS[0];
  for (const tier of STREAK_TIERS) if (n >= tier.min) t = tier;
  return t;
}

function hexToRgba(hex, a) {
  const m = hex.replace('#', '');
  const r = parseInt(m.substring(0, 2), 16), g = parseInt(m.substring(2, 4), 16), b = parseInt(m.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function flameSvg(size, color, dim) {
  const fill = dim ? '#5c636e' : color;
  const style = dim ? ' style="opacity:.35"' : '';
  return `<svg class="flame" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}"${style}>` +
    `<path d="M12 2c1 3-2 4.5-2 7.5a2 2 0 0 0 4 0c0-1-.5-1.5-.5-1.5 2 1 3.5 3.5 3.5 6a5.5 5.5 0 0 1-11 0C6 9.5 9.5 8 12 2z"/></svg>`;
}

function renderStreakChip(container, info) {
  const tier = streakTier(info.streak);
  container.innerHTML = `
    <div class="streak-chip" style="border-color:${tier.color};background:${hexToRgba(tier.color, 0.14)};color:${tier.color}" title="Daily streak">
      ${flameSvg(14, tier.color, false)}
      <span>${info.streak}</span>
    </div>
    <div class="streak-pop" hidden>
      <p class="streak-pop-title">${info.streak > 0 ? info.streak + '-day streak' : 'No active streak yet'}</p>
      <p class="streak-pop-sub">${tier.label} &middot; last 7 days</p>
      <div class="streak-days">
        ${info.last7.map(d => `
          <div class="streak-day${d.active ? ' active' : ''}${d.today ? ' today' : ''}">
            ${flameSvg(16, tier.color, !d.active)}
            <span>${d.label}</span>
          </div>`).join('')}
      </div>
    </div>`;
  const chip = container.querySelector('.streak-chip');
  const pop = container.querySelector('.streak-pop');
  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    pop.hidden = !pop.hidden;
  });
  document.addEventListener('click', (e) => {
    if (!container.contains(e.target)) pop.hidden = true;
  });
}

// ===== Demo chat fixtures =====
const DEMO_MESSAGES = [
  { role: 'user', content: 'Remind me what I told you about the Nord Theory sprint plan.' },
  { role: 'assistant', content: 'You framed it as three phases: discovery, a two-week build, then a soak week before launch. You flagged the soak week as the part most likely to get cut under time pressure.',
    folders: [{ n: 1, title: 'Nord Theory — sprint plan' }] },
  { role: 'user', content: 'Good. Log that I want to protect the soak week no matter what.' },
  { role: 'assistant', content: 'Got it — noted as a standing preference tied to the sprint plan folder.',
    folders: [{ n: 1, title: 'Nord Theory — sprint plan' }] },
];

// ===== Demo task fixtures =====
const DEMO_TASKS = [
  {
    id: 't1', status: 'running', instruction: 'Summarize the last 10 memory folders tagged "sprint" into a one-page brief.',
    steps_used: 9, spend_usd: 0.14, created_at: new Date(Date.now() - 3 * 60000).toISOString(), progress: 'reading folder 7 of 10',
  },
  {
    id: 't2', status: 'done', instruction: 'Draft three follow-up questions for the Nord Theory retro.',
    steps_used: 4, spend_usd: 0.05, created_at: new Date(Date.now() - 90 * 60000).toISOString(),
    completed_at: new Date(Date.now() - 86 * 60000).toISOString(),
    result: '1. What made the soak week feel negotiable in the first place?\n2. Which phase had the least accurate original estimate?\n3. What would "protecting" the soak week look like concretely next sprint?',
  },
  {
    id: 't3', status: 'failed', instruction: 'Cross-link every project folder created this month with related people folders.',
    steps_used: 22, spend_usd: 0.41, created_at: new Date(Date.now() - 26 * 3600000).toISOString(),
    completed_at: new Date(Date.now() - 25 * 3600000).toISOString(), error: 'Error: step budget exhausted before linking finished.',
  },
];

const STATUS_COLOR = { queued: '#9aa3ad', running: '#3ecf8e', done: '#3ecf8e', capped: '#e0a458', failed: '#ff7b72', cancelled: '#5c636e' };

function fmtAge(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  return Math.floor(m / 1440) + 'd ago';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderThread(threadEl, messages) {
  threadEl.innerHTML = messages.map(m => `
    <div class="msg ${m.role}">${escapeHtml(m.content)}</div>
    ${m.folders && m.folders.length ? `<div class="cites">memory: ${m.folders.map(f => '[' + f.n + '] ' + escapeHtml(f.title)).join('  ')}</div>` : ''}
  `).join('');
  threadEl.scrollTop = threadEl.scrollHeight;
}

function renderTasks(tasksEl, tasks) {
  tasksEl.innerHTML = tasks.map(t => {
    const active = t.status === 'queued' || t.status === 'running';
    const steps = Math.min(t.steps_used || 0, 25);
    const spend = Math.min(Number(t.spend_usd) || 0, 0.5);
    const spendRatio = spend / 0.5;
    const endMs = t.completed_at ? new Date(t.completed_at).getTime() : Date.now();
    const elapsedMs = Math.max(0, Math.min(endMs - new Date(t.created_at).getTime(), 15 * 60000));
    const elapsed = Math.floor(elapsedMs / 60000) + 'm ' + Math.floor((elapsedMs % 60000) / 1000) + 's';
    const spendColor = spendRatio < 0.5 ? '#3ecf8e' : spendRatio < 0.8 ? '#e0a458' : '#ff7b72';
    const color = STATUS_COLOR[t.status] || '#9aa3ad';
    const shortInstruction = t.instruction.length > 110 ? t.instruction.slice(0, 110) + '...' : t.instruction;
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span class="badge"><span class="dot${t.status === 'running' ? ' pulse' : ''}" style="background:${color}"></span><span style="color:${color}">${t.status}</span></span>
          <span class="small">${fmtAge(t.created_at)}</span>
        </div>
        <p style="margin:8px 0 4px">${escapeHtml(shortInstruction)}</p>
        ${t.status === 'running' && t.progress ? `<p class="small" style="color:#e6e6e6">▸ ${escapeHtml(t.progress)}</p>` : ''}
        ${active ? `
          <div>
            <div class="small">steps used: ${steps} / 25</div>
            <div class="segbar">${Array.from({ length: 25 }, (_, i) => `<span class="seg${i < steps ? ' on' : ''}"></span>`).join('')}</div>
            <div class="small">spend: $${spend.toFixed(2)} / $0.50 cap</div>
            <div class="meter"><div style="width:${spendRatio * 100}%;background:${spendColor}"></div></div>
            <div class="small">time since queued: ${elapsed} / 15m limit</div>
            <div class="meter"><div style="width:${elapsedMs / (15 * 60000) * 100}%;background:#3ecf8e"></div></div>
          </div>` : ''}
        ${t.result ? `<div class="task-full">${escapeHtml(t.result)}</div>` : ''}
        ${t.error ? `<p class="err" style="padding:0">${escapeHtml(t.error)}</p>` : ''}
      </div>`;
  }).join('');
}

function main() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <header>
      <div style="display:flex;align-items:center;gap:10px">
        <h1>Alleah</h1>
        <div class="streak-chip-wrap" style="position:relative"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="secondary" id="viewToggle" style="margin-top:0">Tasks</button>
        <button class="secondary" id="newChat">New chat</button>
        <button class="secondary" id="signOut">Sign out</button>
      </div>
    </header>
    <div id="thread"></div>
    <div id="tasks" hidden></div>
    <div class="composer" id="composer">
      <textarea id="composerInput" placeholder="Message Alleah..." rows="1"></textarea>
      <button id="sendBtn">Send</button>
    </div>`;

  renderStreakChip(root.querySelector('.streak-chip-wrap'), computeStreakInfo(DEMO_ACTIVE_DAYS));

  const thread = root.querySelector('#thread');
  const tasksEl = root.querySelector('#tasks');
  const composer = root.querySelector('#composer');
  const viewToggle = root.querySelector('#viewToggle');
  const input = root.querySelector('#composerInput');
  const sendBtn = root.querySelector('#sendBtn');

  let messages = DEMO_MESSAGES.slice();
  renderThread(thread, messages);
  renderTasks(tasksEl, DEMO_TASKS);

  let view = 'chat';
  viewToggle.addEventListener('click', () => {
    view = view === 'tasks' ? 'chat' : 'tasks';
    thread.hidden = view === 'tasks';
    composer.hidden = view === 'tasks';
    tasksEl.hidden = view !== 'tasks';
    viewToggle.textContent = view === 'tasks' ? 'Chat' : 'Tasks';
  });

  root.querySelector('#newChat').addEventListener('click', () => {
    if (confirm('Clear this conversation? (Your memory folders are not affected.) [Preview: local demo state only]')) {
      messages = [];
      renderThread(thread, messages);
    }
  });

  root.querySelector('#signOut').addEventListener('click', () => {
    alert('Preview only — sign out is disabled in this static demo.');
  });

  function send() {
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    messages = messages.concat([{ role: 'user', content }]);
    renderThread(thread, messages);
    setTimeout(() => {
      messages = messages.concat([{ role: 'assistant', content: '(Preview demo — replies are canned. Real Alleah would answer using your memory folders here.)' }]);
      renderThread(thread, messages);
    }, 350);
  }
  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
}

main();
</script>

<script type="application/json" id="alleah-pin-config">{"task_id": "b518c3a3-f019-414e-ae6d-39fe7c06f8f1", "revision": 3, "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "changelog": [{"revision": 1, "note": "Depending on the length of the streak make the flame change colours", "resolution": "resolved"}]}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
</body></html>
