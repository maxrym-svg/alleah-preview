<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — preview: calibrated typing indicator</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
.previewTag{font-size:10px;color:#9aa3ad;border:1px solid #2c313a;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#3ecf8e;color:#08130d;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1a1d23;border:1px solid #2c313a;border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:#9aa3ad;margin-top:-4px;padding:0 6px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button.stop-btn{background:#ff7b72;color:#2b0d0b}
button:disabled{opacity:.5}
.auth{padding:16px 14px}
.muted{color:#9aa3ad;font-size:14px}
.err{color:#ff7b72;font-size:14px;padding:0 14px}
#tasks,#goals,#upgrades{flex:1;overflow-y:auto;padding:8px 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.menu-wrap{position:relative}
.menu-btn{width:46px;height:46px;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:12px;padding:0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu-btn:active{background:#2c313a}
.menu-btn[aria-expanded="true"]{background:#2c313a;border-color:#3ecf8e}
.menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:208px;background:#1a1d23;border:1px solid #2c313a;border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:30}
.menu-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9aa3ad;padding:10px 12px 6px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:transparent;color:#e6e6e6;border:0;border-radius:10px;padding:12px 12px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.menu-item:active{background:#2c313a}
.menu-item.active{background:#3ecf8e;color:#08130d;font-weight:700}
.menu-sep{height:1px;background:#2c313a;margin:6px 6px}
.upgrade-actions{display:flex;gap:8px;margin-top:10px}
.upgrade-actions button{flex:1;padding:8px 0}
.demo-controls{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.demo-controls button{font-size:11px;padding:6px 10px;border-radius:999px}
.msg.pending{display:flex;flex-direction:column;gap:4px}
.stream-wrap{display:grid}
.stream-wrap>*{grid-area:1/1}
.think-row{display:inline-flex;align-items:center;gap:8px;transition:opacity .25s ease}
.think-row.fade-out{opacity:0}
.think-label{font-size:13px;color:#9aa3ad}
.think-dots{display:inline-flex;gap:5px;padding:4px 2px;align-items:center}
.think-dot{font-size:16px;line-height:1;color:#9aa3ad;animation:think-bounce 1.1s infinite ease-in-out}
@keyframes think-bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.stream-text{opacity:0;transition:opacity .25s ease;white-space:pre-wrap;word-wrap:break-word}
.stream-text.show{opacity:1}
.stream-cursor{display:inline-block;width:2px;height:1em;background:#9aa3ad;vertical-align:text-bottom;margin-left:1px;animation:cursor-blink 1s step-start infinite}
@keyframes cursor-blink{50%{opacity:0}}
.interrupted-note{font-size:12px;color:#e0a458;font-style:italic;margin-top:2px}
</style></head><body>
<div id="root"></div>
<script>
// ============================================================================
// Self-contained STATIC preview of the calibrated typing/streaming indicator.
// No network calls, no auth, no Supabase: all data is inline synthetic fixture
// data and a simulated backend latency, purely so the timing/animation states
// (thinking -> cross-fade -> streaming -> interrupted) can be demoed reliably.
// ============================================================================

const root = document.getElementById('root');

// ---- synthetic fixtures ----
const SEED_MESSAGES = [
  {role:'user', content:'What do I have filed about the balcony garden project?'},
  {role:'assistant', content:'From your memory: you started a small balcony garden in March, mostly herbs (basil, mint, thyme) plus one stubborn tomato plant that keeps leaning toward the railing. [1] [2]', folders:[{n:1,title:'Balcony garden - herbs'},{n:2,title:'Balcony garden - tomato plant'}]},
];

const CANNED_REPLIES = [
  "From your memory: you mentioned wanting to switch your morning routine around so reading comes before email, because email tends to hijack your focus for the rest of the morning. [1]\n\nGeneral knowledge: a common trick for that is to physically leave your phone/laptop in another room until after the reading block - removing the option is more reliable than willpower in the moment.",
  "You haven't filed anything on this specific topic yet, but generally: batching similar small tasks (replies, quick edits, filing) into one block tends to reduce the context-switching cost that eats a surprising amount of a day.",
  "From your memory: you're easing into a lighter training week after the last stretch felt heavier than planned. [1]\n\nThat's a reasonable call - a deload week every few cycles is standard practice precisely because it lets adaptation catch up with the stress you've already put in.",
];

const FIXTURE_LONG_REPLY = "Here's a longer one, useful for trying the Stop button mid-stream: from your memory, you've been slowly mapping out the kitchen remodel - counters first, then the sink relocation, and only after that any thought about the flooring, because ripping up flooring twice would be the expensive mistake. [1] [2]\n\nGeneral knowledge: the usual sequencing advice for a remodel like this is exactly that - do anything under the floor or behind the walls before the finish work, since finish work is what gets damaged when plans change late. It's not a small thing to get the order right, and most of the regret people report afterward is about doing decorative work too early and then having to redo it.";

const HISTORY = SEED_MESSAGES.slice();

// ---- calibration knobs (mirrors the real app) ----
const MIN_THINK_MS = 400;   // 300-500ms calibrated band - dots never flash faster than this
const CROSSFADE_MS = 250;   // dots -> text cross-fade duration
const REVEAL_CHARS_PER_TICK = 3;
const REVEAL_TICK_MS = 16;

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'disabled') node.disabled = !!v;
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

// ============ App shell / header menu ============
const VIEWS = [
  {key:'chat', label:'Chat'},
  {key:'tasks', label:'Tasks'},
  {key:'goals', label:'Goals'},
  {key:'upgrades', label:'Upgrades'},
];
let currentView = 'chat';

function renderHeader() {
  const wrap = el('div', {class:'menu-wrap'});
  let open = false;
  const btn = el('button', {
    type:'button', class:'menu-btn', 'aria-haspopup':'menu', 'aria-expanded':'false', 'aria-label':'Open menu',
    onclick: () => { open = !open; renderMenu(); },
  }, '☰');
  wrap.appendChild(btn);

  function renderMenu() {
    btn.setAttribute('aria-expanded', String(open));
    const existing = wrap.querySelector('.menu-dropdown');
    if (existing) existing.remove();
    if (!open) return;
    const dd = el('div', {class:'menu-dropdown', role:'menu'},
      el('div', {class:'menu-label'}, 'View'),
      ...VIEWS.map(v => el('button', {
        type:'button', role:'menuitem',
        class:'menu-item' + (currentView === v.key ? ' active' : ''),
        onclick: () => { currentView = v.key; open = false; renderApp(); },
      }, v.label)),
      el('div', {class:'menu-sep'}),
      el('button', {type:'button', role:'menuitem', class:'menu-item', onclick: () => { open=false; renderMenu(); alert('Preview only - "New chat" is disabled in this static demo.'); }}, 'New chat'),
    );
    wrap.appendChild(dd);
  }
  document.addEventListener('click', (e) => {
    if (open && !wrap.contains(e.target)) { open = false; renderMenu(); }
  });
  return el('header', null,
    el('h1', null, 'Alleah', el('span', {class:'previewTag'}, 'preview')),
    wrap);
}

// ============ Thinking dots + pending bubble ============
// Text ("Thinking" + literal dot characters), not just a CSS animation on empty
// nodes - so the indicator is detectable by reading rendered text/accessible
// name, not only by pixel inspection. role=status announces the state change.
function thinkingDots(fading) {
  return el('div', {class:'think-row' + (fading ? ' fade-out' : ''), role:'status', 'aria-live':'polite', 'aria-label':'Alleah is thinking'},
    el('span', {class:'think-label'}, 'Thinking'),
    el('span', {class:'think-dots'},
      el('span', {class:'think-dot', style:'animation-delay:0s'}, '\u2022'),
      el('span', {class:'think-dot', style:'animation-delay:.15s'}, '\u2022'),
      el('span', {class:'think-dot', style:'animation-delay:.3s'}, '\u2022')));
}

function pendingBubble(p, handlers) {
  const wrap = el('div', {class:'msg assistant pending', 'data-phase':p.phase});
  if (p.phase === 'interrupted') {
    const hasPartial = !!(p.revealed && p.revealed.length);
    if (hasPartial) wrap.appendChild(el('span', null, p.revealed));
    wrap.appendChild(el('div', {class:'interrupted-note'}, hasPartial ? 'Generation stopped.' : 'Stopped before generating a response.'));
    const actions = el('div', {class:'upgrade-actions'});
    if (hasPartial) actions.appendChild(el('button', {type:'button', class:'secondary', onclick: handlers.onContinue}, 'Continue'));
    actions.appendChild(el('button', {type:'button', class:'secondary', onclick: handlers.onRegenerate}, 'Regenerate'));
    wrap.appendChild(actions);
    return wrap;
  }
  const showDots = p.phase === 'thinking' || p.phase === 'crossfade';
  const showText = p.phase === 'crossfade' || p.phase === 'streaming';
  const sw = el('div', {class:'stream-wrap'});
  if (showDots) sw.appendChild(thinkingDots(p.phase === 'crossfade'));
  if (showText) sw.appendChild(el('span', {class:'stream-text show'}, p.revealed, el('span', {class:'stream-cursor'})));
  wrap.appendChild(sw);
  return wrap;
}

// ============ Chat view ============
function renderChat(container) {
  const state = {
    messages: HISTORY.slice(),
    pending: null,       // {phase, revealed, fullAnswer, folders}
    err: '',
    replyIdx: 0,
  };
  let timers = {reveal:null, guard:null, crossfade:null};
  let lastTurn = null;

  function clearTimers() {
    if (timers.reveal) { clearInterval(timers.reveal); timers.reveal = null; }
    if (timers.guard) { clearTimeout(timers.guard); timers.guard = null; }
    if (timers.crossfade) { clearTimeout(timers.crossfade); timers.crossfade = null; }
  }

  function draw() {
    container.innerHTML = '';
    const thread = el('div', {id:'thread'});
    if (state.messages.length === 0) {
      thread.appendChild(el('p', {class:'muted', style:'padding:0 6px'}, 'Talk to me. What you tell me about what you know gets remembered - automatically.'));
    }
    state.messages.forEach(m => {
      thread.appendChild(el('div', {class:'msg ' + m.role}, m.content));
      if (m.folders && m.folders.length) {
        thread.appendChild(el('div', {class:'cites'}, 'memory: ' + m.folders.map(f => '[' + f.n + '] ' + f.title).join('  ')));
      }
    });
    if (state.pending) {
      thread.appendChild(pendingBubble(state.pending, {
        onContinue: continueGen,
        onRegenerate: regenerate,
      }));
    }
    const endMarker = el('div');
    thread.appendChild(endMarker);
    container.appendChild(thread);

    // Demo controls: lets a reviewer trigger a fast reply (guard visible) or a
    // deliberately long one (easy to hit Stop mid-stream) without hunting for copy.
    const demo = el('div', {class:'demo-controls'},
      el('button', {type:'button', class:'secondary', onclick: () => quickSend('What did I say about my sleep schedule?', true)}, '⚡ instant reply demo'),
      el('button', {type:'button', class:'secondary', onclick: () => quickSend('Walk me through the kitchen remodel plan.', false)}, '⏱ long reply demo (try Stop)'));
    container.appendChild(demo);

    if (state.err) container.appendChild(el('p', {class:'err'}, state.err));

    const textarea = el('textarea', {placeholder:'Message Alleah...', rows:1});
    textarea.value = state.text || '';
    const generating = !!state.pending && state.pending.phase !== 'interrupted';
    const actionBtn = generating
      ? el('button', {type:'button', class:'stop-btn', onclick: stop}, 'Stop')
      : el('button', {disabled: !(state.text && state.text.trim()), onclick: send}, 'Send');
    textarea.addEventListener('input', e => {
      state.text = e.target.value;
      if (!generating) actionBtn.disabled = !e.target.value.trim();
    });
    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    container.appendChild(el('div', {class:'composer'}, textarea, actionBtn));

    endMarker.scrollIntoView({block:'nearest'});
  }

  function updatePending(patch) {
    state.pending = state.pending ? Object.assign({}, state.pending, patch) : patch;
    draw();
    const ta = container.querySelector('textarea');
    if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
  }

  // Mutates state.pending.revealed directly and pokes the existing text node in
  // place (instead of a full re-render every tick) - a full draw() every 16ms
  // would risk replacing the Stop button out from under an in-flight click.
  function startReveal() {
    if (timers.reveal) clearInterval(timers.reveal);
    timers.reveal = setInterval(() => {
      const p = state.pending;
      if (!p || p.fullAnswer == null) return;
      const nextLen = Math.min((p.revealed || '').length + REVEAL_CHARS_PER_TICK, p.fullAnswer.length);
      const revealed = p.fullAnswer.slice(0, nextLen);
      p.revealed = revealed;
      const node = container.querySelector('.stream-text');
      if (node && node.firstChild) node.firstChild.nodeValue = revealed;
      if (nextLen >= p.fullAnswer.length) {
        clearInterval(timers.reveal); timers.reveal = null;
        p.phase = 'streaming';
        finalizeMessage();
      }
    }, REVEAL_TICK_MS);
  }

  function finalizeMessage() {
    const p = state.pending;
    if (!p) return;
    state.messages.push({role:'assistant', content: p.fullAnswer, folders: p.folders || []});
    state.pending = null;
    draw();
  }

  // Simulates the network round trip: resolves with a canned answer after a
  // randomized latency so both the "instant" and "slow" cases are reachable.
  function simulateBackend(userText, forceLatencyMs) {
    let reply;
    if (/sleep/i.test(userText)) reply = CANNED_REPLIES[0];
    else if (/kitchen|remodel/i.test(userText)) reply = FIXTURE_LONG_REPLY;
    else { reply = CANNED_REPLIES[state.replyIdx % CANNED_REPLIES.length]; state.replyIdx++; }
    const latency = forceLatencyMs != null ? forceLatencyMs : (120 + Math.random() * 1400);
    let cancelled = false;
    let timeoutId;
    const promise = new Promise((resolve) => {
      timeoutId = setTimeout(() => { if (!cancelled) resolve({answer: reply, folders: []}); }, latency);
    });
    promise._cancel = () => { cancelled = true; clearTimeout(timeoutId); };
    return promise;
  }

  function runSend(turns, forceLatencyMs) {
    state.err = '';
    lastTurn = {turns, forceLatencyMs};
    const start = Date.now();
    let aborted = false;
    state.pending = {phase:'thinking', revealed:'', fullAnswer:null, folders:[]};
    draw();

    const backendPromise = simulateBackend(turns[turns.length - 1].content, forceLatencyMs);
    state._activeBackend = backendPromise;
    state._abort = () => { aborted = true; backendPromise._cancel && backendPromise._cancel(); };

    backendPromise.then((answerData) => {
      if (!state.pending || state.pending.phase === 'interrupted' || aborted) return;
      const elapsed = Date.now() - start;
      const remaining = Math.max(0, MIN_THINK_MS - elapsed);
      timers.guard = setTimeout(() => {
        if (!state.pending || state.pending.phase === 'interrupted') return;
        updatePending({phase:'crossfade', fullAnswer: answerData.answer, folders: answerData.folders || []});
        startReveal();
        timers.crossfade = setTimeout(() => {
          if (state.pending && state.pending.phase === 'crossfade') updatePending({phase:'streaming'});
        }, CROSSFADE_MS);
      }, remaining);
    });
  }

  function send() {
    const content = (state.text || '').trim();
    if (!content) return;
    if (state.pending && state.pending.phase !== 'interrupted') return;
    state.text = '';
    if (state.pending) state.pending = null;
    state.messages.push({role:'user', content});
    runSend(state.messages);
  }

  function quickSend(content, forceInstant) {
    if (state.pending && state.pending.phase !== 'interrupted') return;
    if (state.pending) state.pending = null;
    state.messages.push({role:'user', content});
    runSend(state.messages, forceInstant ? 120 : (2600 + Math.random() * 800));
  }

  function stop() {
    clearTimers();
    if (state._abort) state._abort();
    if (!state.pending) return;
    updatePending({phase:'interrupted'});
  }

  function continueGen() {
    const p = state.pending;
    if (!p || p.fullAnswer == null) return;
    updatePending({phase:'streaming'});
    startReveal();
  }

  function regenerate() {
    clearTimers();
    state.pending = null;
    draw();
    if (lastTurn) runSend(lastTurn.turns, lastTurn.forceLatencyMs);
  }

  draw();
}

// ============ Static placeholder tabs (fixture-only, for visual completeness) ============
function renderTasks(container) {
  container.appendChild(el('div', {id:'tasks'},
    el('p', {class:'muted'}, 'Fixture preview — Tasks tab is unrelated to this feature.'),
    el('div', {class:'card'},
      el('span', {class:'badge'}, el('span', {class:'dot', style:'background:#3ecf8e'}), el('span', {style:'color:#3ecf8e'}), 'done'),
      el('p', {style:'margin:8px 0 4px'}, 'research: morning-routine literature scan'))));
}
function renderGoals(container) {
  container.appendChild(el('div', {id:'goals'},
    el('p', {class:'muted', style:'padding:16px 2px'}, 'Fixture preview — Goals tab is unrelated to this feature.')));
}
function renderUpgrades(container) {
  container.appendChild(el('div', {id:'upgrades'},
    el('div', {class:'card'},
      el('p', {style:'font-size:15px;font-weight:700;margin:0 0 4px'}, 'Calibrated typing/streaming indicator'),
      el('p', {class:'small'}, 'status: approved — this preview'))));
}

// ============ Root render ============
function renderApp() {
  root.innerHTML = '';
  root.appendChild(renderHeader());
  const body = el('div', {style:'flex:1;display:flex;flex-direction:column;min-height:0'});
  root.appendChild(body);
  if (currentView === 'chat') renderChat(body);
  else if (currentView === 'tasks') renderTasks(body);
  else if (currentView === 'goals') renderGoals(body);
  else renderUpgrades(body);
}
renderApp();
</script>

  background: #3d3a35;

}

  position: fixed;
  left: 14px;

  background: #fffdf8;

.apo-log-item { border-top: 1px solid #eee7da; padding: 6px 0; }

.apo-hidden { display: none; }
</style>
<script type="application/json" id="alleah-pin-config">{"task_id": "f35e69a7-cd64-49c6-9431-59bad4d0d3a9", "revision": 0, "deploy_marker": "f35e69a7-r0-1786407590", "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "review_endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/request-review", "changelog": []}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
