<!doctype html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — Chat (contrast + theming preview)</title>
<meta name="theme-color" content="#121212">
<style>
/* ===== Design tokens =====
   WCAG AA contrast pass: dark theme (default) uses a dark-grey surface
   (~#121212) - never pure black - plus muted accent hues so accent-as-text
   and text-on-accent both clear 4.5:1 (body) / 3:1 (large text / UI
   components). A full light theme is provided via [data-theme="light"],
   toggled below and persisted. Every color in this preview reads one of
   these variables. */
:root{
  color-scheme:dark;
  --bg:#121212;
  --surface:#1c1c1e;
  --surface-2:#242427;
  --border:#3a3a3d;
  --text-primary:#f2f2f3;
  --text-secondary:#b7bac0;
  --accent:#3ddb96;
  --accent-muted-dark:#2f9d6c;
  --accent-contrast:#06120c;
  --danger:#ff9086;
  --danger-contrast:#2b0705;
  --warning:#e7b567;
  --info:#7db8ff;
  --purple:#dd9dff;
  --neutral:#9498a1;
  --focus-ring:#7db8ff;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f6f7;
  --surface:#ffffff;
  --surface-2:#edeef0;
  --border:#d6d8db;
  --text-primary:#17181a;
  --text-secondary:#53565c;
  --accent:#0e7a4a;
  --accent-muted-dark:#0e7a4a;
  --accent-contrast:#ffffff;
  --danger:#b3261e;
  --danger-contrast:#ffffff;
  --warning:#8a5a00;
  --info:#0b5fb8;
  --purple:#7c3aad;
  --neutral:#5b5e65;
  --focus-ring:#0b5fb8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font:16px/1.5 -apple-system,system-ui,sans-serif;transition:background .15s ease,color .15s ease}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;gap:8px}
h1{font-size:18px;margin:0}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-toggle{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text-primary);cursor:pointer}
.theme-toggle .swatch{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.tabbar{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto}
.tabbtn{flex:none;background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.tabbtn.active{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-contrast);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:var(--text-secondary);margin-top:-4px;padding:0 6px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:var(--accent);color:var(--accent-contrast);border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:var(--surface-2);color:var(--text-primary);font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border)}
button.stop-btn{background:var(--danger);color:var(--danger-contrast)}
button:disabled{opacity:.5}
.muted{color:var(--text-secondary);font-size:14px}
.err{color:var(--danger);font-size:14px;padding:0 14px}
#tasks{flex:1;overflow-y:auto;padding:8px 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.status-icon{font-size:11px;line-height:1}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.segbar{display:flex;gap:2px;margin:4px 0}
.seg{flex:1;height:8px;border-radius:2px;background:var(--surface-2)}
.seg.on{background:var(--accent-muted-dark)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:var(--text-secondary);margin:2px 0}
.think-row{display:inline-flex;align-items:center;gap:8px}
.think-label{font-size:13px;color:var(--text-secondary)}
.think-dots{display:inline-flex;gap:5px;padding:4px 2px;align-items:center}
.think-dot{font-size:16px;line-height:1;color:var(--text-secondary);animation:think-bounce 1.1s infinite ease-in-out}
@keyframes think-bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.interrupted-note{font-size:12px;color:var(--warning);font-style:italic;margin-top:2px}
.audit-note{font-size:12.5px;color:var(--text-secondary);padding:10px 14px 0;line-height:1.5}
.audit-note b{color:var(--text-primary)}
.zoom-note{font-size:11.5px;color:var(--text-secondary);text-align:center;padding:4px 14px 10px}

<script>
const h = (tag, props, ...children) => {
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)) {
    if (k === 'className') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== undefined && v !== null) el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return el;
};

// ===== Theme toggle (persisted; demo only, no network) =====
const THEME_KEY = 'alleah_preview_theme';
function getInitialTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') return saved;
  } catch {}
  try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light'; } catch {}
  return 'dark';
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f6f6f7' : '#121212');
  try { localStorage.setItem(THEME_KEY, t); } catch {}
}
applyTheme(getInitialTheme());

// ===== Synthetic fixtures (no real data, no network calls) =====
const FIXTURE_MESSAGES = [
  {role:'assistant', content:"Hi, I'm Alleah. Tell me things you know and I'll remember them - automatically."},
  {role:'user', content:"Remember that I prefer meeting notes summarized as bullet points, not prose."},
  {role:'assistant', content:"Got it - saved to memory. I'll format meeting-note summaries as bullet points from now on.", folders:[{n:1, title:'Preferences: note formatting'}]},
  {role:'user', content:"Also, my accessibility reviewer flagged our chat colors for contrast. Can you fix that?"},
];

const STATUS_META = {
  queued:    {color:'var(--text-secondary)', icon:'🕓', label:'queued'},
  running:   {color:'var(--accent)',         icon:'▶', label:'running'},
  done:      {color:'var(--accent)',         icon:'✓', label:'done'},
  capped:    {color:'var(--warning)',        icon:'▲', label:'capped'},
  failed:    {color:'var(--danger)',         icon:'✕', label:'failed'},
  cancelled: {color:'var(--neutral)',        icon:'⦸', label:'cancelled'},
};
const FIXTURE_TASKS = [
  {id:1, kind:'build', status:'running', instruction:'Add WCAG AA contrast tokens to chat theme', steps:18, stepsCap:50, spend:0.62, spendCap:2.00, age:'2m ago'},
  {id:2, kind:'review', status:'done', instruction:'Audit of build: chat contrast pass', steps:25, stepsCap:25, spend:0.11, spendCap:0.50, age:'11m ago'},
  {id:3, kind:'research', status:'capped', instruction:'Survey best-practice dark-mode accent muting', steps:25, stepsCap:25, spend:0.49, spendCap:0.50, age:'1h ago'},
  {id:4, kind:'build', status:'failed', instruction:'Add screen-reader labels to status dots', steps:6, stepsCap:50, spend:0.20, spendCap:2.00, age:'3h ago'},
  {id:5, kind:'build', status:'cancelled', instruction:'Increase composer font size on zoom', steps:2, stepsCap:50, spend:0.02, spendCap:2.00, age:'1d ago'},
];

function StatusBadge(status) {
  const meta = STATUS_META[status] || {color:'var(--text-secondary)', icon:'•', label:status};
  return h('span', {className:'badge'},
    h('span', {className:'dot' + (status === 'running' ? ' pulse' : ''), style:{background:meta.color}}),
    h('span', {className:'status-icon', 'aria-hidden':'true', style:{color:meta.color}}, meta.icon),
    h('span', {style:{color:meta.color}}, meta.label));
}

function renderThread() {
  const thread = document.getElementById('thread');
  thread.innerHTML = '';
  FIXTURE_MESSAGES.forEach(m => {
    thread.appendChild(h('div', {className:'msg ' + m.role}, m.content));
    if (m.folders && m.folders.length) {
      thread.appendChild(h('div', {className:'cites'}, 'memory: ' + m.folders.map(f => '[' + f.n + '] ' + f.title).join('  ')));
    }
  });
  // A live "thinking" bubble, shown as generic redundant-signal demo (text + dots, not color-only).
  const pending = h('div', {className:'msg assistant'},
    h('div', {className:'think-row', role:'status', 'aria-live':'polite', 'aria-label':'Alleah is thinking'},
      h('span', {className:'think-label'}, 'Thinking'),
      h('span', {className:'think-dots'},
        h('span', {className:'think-dot', style:{animationDelay:'0s'}}, '\u2022'),
        h('span', {className:'think-dot', style:{animationDelay:'.15s'}}, '\u2022'),
        h('span', {className:'think-dot', style:{animationDelay:'.3s'}}, '\u2022'))));
  thread.appendChild(pending);
  thread.scrollTop = thread.scrollHeight;
}

function taskCard(t) {
  const stepsRatio = t.steps / t.stepsCap;
  const spendRatio = t.spend / t.spendCap;
  const spendColor = spendRatio < 0.5 ? 'var(--accent)' : spendRatio < 0.8 ? 'var(--warning)' : 'var(--danger)';
  return h('div', {className:'card'},
    h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center', gap:'8px'}},
      StatusBadge(t.status),
      h('span', {className:'small'}, t.age)),
    h('p', {style:{margin:'8px 0 4px', fontSize:'14px'}}, (t.kind !== 'research' ? t.kind + ' · ' : '') + t.instruction),
    h('div', {className:'small'}, 'steps used: ' + t.steps + ' / ' + t.stepsCap),
    h('div', {className:'segbar'}, Array.from({length: t.stepsCap}, (_, i) => h('span', {className:'seg' + (i < t.steps ? ' on' : '')}))),
    h('div', {className:'small'}, 'spend: $' + t.spend.toFixed(2) + ' / $' + t.spendCap.toFixed(2) + ' cap'),
    h('div', {className:'meter'}, h('div', {style:{width:(spendRatio*100)+'%', background:spendColor}})));
}

function renderTasks() {
  const tasks = document.getElementById('tasks');
  tasks.innerHTML = '';
  FIXTURE_TASKS.forEach(t => tasks.appendChild(taskCard(t)));
}

function App() {
  const root = document.getElementById('root');
  let theme = getInitialTheme();
  let view = 'chat';

  function ThemeToggleBtn() {
    return h('button', {
      type:'button', className:'theme-toggle',
      onClick: () => { theme = theme === 'light' ? 'dark' : 'light'; applyTheme(theme); rerenderHeader(); },
    }, h('span', {className:'swatch'}), theme === 'light' ? '🌙 Dark theme' : '☀️ Light theme');
  }

  function TabBar() {
    const tabs = [['chat','Chat'],['tasks','Tasks']];
    return h('div', {className:'tabbar'}, tabs.map(([key,label]) =>
      h('button', {
        type:'button', className:'tabbtn' + (view === key ? ' active' : ''),
        'aria-current': view === key ? 'page' : undefined,
        onClick: () => { view = key; rerenderBody(); },
      }, label)));
  }

  function rerenderHeader() {
    const headerActions = document.getElementById('header-actions');
    headerActions.innerHTML = '';
    headerActions.appendChild(ThemeToggleBtn());
  }

  function rerenderBody() {
    const body = document.getElementById('body-slot');
    body.innerHTML = '';
    const tabbarWrap = document.getElementById('tabbar-slot');
    tabbarWrap.innerHTML = '';
    tabbarWrap.appendChild(TabBar());
    if (view === 'chat') {
      body.appendChild(h('div', {id:'thread'}));
      body.appendChild(h('p', {className:'err'}));
      body.appendChild(h('div', {className:'composer'},
        h('textarea', {placeholder:'Message Alleah...', rows:1}),
        h('button', {type:'button'}, 'Send')));
      document.getElementById('body-slot').querySelector('.err').remove();
      renderThread();
    } else {
      body.appendChild(h('div', {id:'tasks'}));
      renderTasks();
    }
  }

  root.appendChild(h('header', null,
    h('h1', null, 'Alleah'),
    h('div', {className:'header-actions', id:'header-actions'})));
  root.appendChild(h('div', {id:'tabbar-slot'}));
  root.appendChild(h('div', {id:'body-slot', style:{flex:'1', display:'flex', flexDirection:'column', minHeight:'0'}}));
  root.appendChild(h('p', {className:'audit-note'},
    h('b', null, 'Contrast + theming pass (preview): '),
    'text, accents, and status colors below are drawn from CSS variable tokens (--text-primary, --text-secondary, --surface, --accent, --accent-muted-dark…). Dark mode uses a dark-grey #121212 surface, never pure black, with muted accents; every status also carries an icon + word so no indicator relies on color alone. Toggle the theme button to compare light vs. dark.'));
  root.appendChild(h('p', {className:'zoom-note'}, 'Layout uses relative (rem/em-scale) sizing and reflows cleanly at 200% browser zoom.'));

  rerenderHeader();
  rerenderBody();
}

App();
</script>

<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
</body></html>
