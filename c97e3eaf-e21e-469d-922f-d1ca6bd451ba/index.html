<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — Goals (preview)</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
.hdr-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#1a1d23;border:1px solid #2c313a;color:#9aa3ad}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer;min-height:38px}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px;min-height:34px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:10px;padding:12px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#9aa3ad;font-size:14px}
#goals{flex:1;overflow-y:auto;padding:8px 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px;transition:width .3s ease}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:2px 2px 10px;color:#9aa3ad;font-size:12px}
.summary b{color:#e6e6e6}
.goal-desc{white-space:pre-wrap;background:#0f1115;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;font-size:13.5px;color:#c7ccd3}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.addform .row2{display:flex;gap:8px}
.addform .row2>*{flex:1}
.newgoalbtn{width:100%;text-align:left;background:#1a1d23;color:#9aa3ad;border:1px dashed #2c313a}
.goal-path{display:flex;flex-direction:column}
.goal-row{display:flex;gap:10px}
.goal-connector{display:flex;flex-direction:column;align-items:center;width:18px;flex:none}
.goal-node-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:14px;box-shadow:0 0 0 3px #0f1115,0 0 0 4.5px currentColor}
.goal-node-line{width:2px;flex:1;min-height:22px;background:#2c313a;margin:4px 0}
.goal-box{flex:1;min-width:0;background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.goal-box-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-obj-count{font-size:12px;color:#9aa3ad}
.goal-checklist{margin-top:10px;padding-top:10px;border-top:1px solid #2c313a;display:flex;flex-direction:column;gap:2px}
.goal-obj{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.goal-obj input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#3ecf8e;cursor:pointer}
.goal-obj span{font-size:14px}
.goal-obj.done span{text-decoration:line-through;color:#9aa3ad}
.goal-generate-btn{margin-top:10px;width:100%}
.banner{margin:10px 14px 0;padding:8px 12px;border-radius:10px;background:#1a1d23;border:1px solid #2c313a;color:#9aa3ad;font-size:12px}
</style></head><body>
<div id="root"></div>
<script>
(function(){
"use strict";
// ============================================================================
// Self-contained static preview of the Alleah Goals tab + "Generate
// mini-objectives" feature. No network calls anywhere in this file: no
// fetch(), no axios, no XMLHttpRequest, no WebSocket, no Supabase client.
// All data is synthetic fixtures held in memory / localStorage on this page.
// ============================================================================

var GOALS_KEY = "alleah_goals_preview_v1";
var GOALS_DAY = 86400000;

var DIFFICULTY = {
  easy:   {label: "Easy",   color: "#3ecf8e"},
  medium: {label: "Medium", color: "#58a6ff"},
  hard:   {label: "Hard",   color: "#e0a458"},
  epic:   {label: "Epic",   color: "#d68fff"}
};
var GOAL_STATUS_COLOR = {active:"#3ecf8e", completed:"#3ecf8e", paused:"#e0a458", abandoned:"#5c636e"};

function nowMs(){ return Date.now(); }
function daysFromNow(n){ return nowMs() + n * GOALS_DAY; }
function daysAgo(n){ return nowMs() - n * GOALS_DAY; }

function mkObj(text, done){ return {id: "o" + Math.random().toString(36).slice(2,9), text: text, done: !!done}; }

// ---- Generic synthetic demo fixtures (no real user data) ----
function seedGoals() {
  return [
    {
      id: "g1", title: "Buy a starter home", category: "Home", difficulty: "hard",
      status: "active", description: "Save, shop, and close on a first house within budget.",
      created_at: daysAgo(21), target_date: daysFromNow(120),
      objectives: [mkObj("Research neighborhoods", true), mkObj("Calculate budget", true), mkObj("Get pre-approved for a mortgage", false)]
    },
    {
      id: "g2", title: "Run a half marathon", category: "Fitness", difficulty: "medium",
      status: "active", description: "Train consistently and finish a half marathon comfortably.",
      created_at: daysAgo(10), target_date: daysFromNow(45),
      objectives: [mkObj("Pick a training plan", true), mkObj("Buy proper running shoes", false)]
    },
    {
      id: "g3", title: "Learn conversational Spanish", category: "Learning", difficulty: "medium",
      status: "completed", description: "Reach a comfortable conversational level for travel.",
      created_at: daysAgo(200), target_date: daysAgo(5), completed_at: daysAgo(5),
      objectives: [mkObj("Finish beginner course", true), mkObj("Practice weekly with a tutor", true), mkObj("Watch a show without subtitles", true)]
    },
    {
      id: "g4", title: "Launch a side project", category: "Career", difficulty: "epic",
      status: "paused", description: "Ship a small, useful tool and get real users.",
      created_at: daysAgo(60), target_date: daysFromNow(9),
      objectives: [mkObj("Validate the idea", true)]
    }
  ];
}

function loadGoals() {
  try {
    var raw = JSON.parse(localStorage.getItem(GOALS_KEY));
    if (Array.isArray(raw) && raw.length) return raw;
  } catch (e) {}
  var seeded = seedGoals();
  localStorage.setItem(GOALS_KEY, JSON.stringify(seeded));
  return seeded;
}
function saveGoals(goals) {
  localStorage.setItem(GOALS_KEY, JSON.stringify(goals));
}

function parseDateInputToMs(dateStr) {
  if (!dateStr) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if (!m) return null;
  var year = Number(m[1]), month = Number(m[2]), day = Number(m[3]);
  return new Date(year, month - 1, day).getTime();
}
function fmtRelDay(ms) {
  var days = Math.round((ms - nowMs()) / GOALS_DAY);
  if (days === 0) return "today";
  if (days > 0) return "in " + days + "d";
  return Math.abs(days) + "d ago";
}
function fmtAgeShort(ms) {
  var days = Math.round((nowMs() - ms) / GOALS_DAY);
  if (days < 1) return "today";
  if (days < 30) return days + "d ago";
  if (days < 365) return Math.round(days/30) + "mo ago";
  return Math.round(days/365) + "y ago";
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

// ===== Mini-objective generation (LOCAL ONLY - no network) =====
// generateObjectives() is a pure, synchronous, local function. There is no
// fetch(), axios, XMLHttpRequest, WebSocket, or any other network/API-client
// call anywhere in this function or anything it calls - it just samples 3-5
// items from a small fixed pool, skipping any the goal already has. The only
// "delay" in the whole flow is an artificial setTimeout in the click handler
// below, kept purely to preserve the pre-existing loading-state UX.
var OBJECTIVE_POOL = [
  "Research neighborhoods",
  "Calculate budget",
  "Schedule viewings",
  "Compare financing options",
  "Draft a checklist",
  "Set a target date",
  "List must-haves",
  "Review progress with a friend"
];

function generateObjectives(existingTexts) {
  var have = {};
  (existingTexts || []).forEach(function(t){ have[t] = true; });
  var pool = OBJECTIVE_POOL.filter(function(t){ return !have[t]; });
  var count = Math.min(pool.length, 3 + Math.floor(Math.random() * 3)); // 3-5
  var picked = [];
  var src = pool.slice();
  while (picked.length < count && src.length) {
    var idx = Math.floor(Math.random() * src.length);
    picked.push(src.splice(idx, 1)[0]);
  }
  return picked;
}

// ===== App state =====
var state = {
  goals: loadGoals(),
  showForm: false,
  openIds: {},
  generatingIds: {}
};

function setState(patch) {
  Object.assign(state, patch);
  saveGoals(state.goals);
  render();
}

function toggleObjective(goalId, objId) {
  state.goals = state.goals.map(function(g){
    if (g.id !== goalId) return g;
    return Object.assign({}, g, {
      objectives: g.objectives.map(function(o){
        return o.id !== objId ? o : Object.assign({}, o, {done: !o.done});
      })
    });
  });
  saveGoals(state.goals);
  render();
}

function toggleOpen(goalId) {
  state.openIds[goalId] = !state.openIds[goalId];
  render();
}

function handleGenerate(goalId) {
  if (state.generatingIds[goalId]) return;
  state.generatingIds[goalId] = true;
  render();
  // Fake latency only, to preserve the loading-state UX - no network call.
  setTimeout(function(){
    var goal = state.goals.find(function(g){ return g.id === goalId; });
    var existingTexts = goal ? goal.objectives.map(function(o){ return o.text; }) : [];
    var picked = generateObjectives(existingTexts);
    state.goals = state.goals.map(function(g){
      if (g.id !== goalId) return g;
      var added = picked.map(function(text){ return mkObj(text, false); });
      return Object.assign({}, g, {objectives: g.objectives.concat(added)});
    });
    state.generatingIds[goalId] = false;
    saveGoals(state.goals);
    render();
  }, 700);
}

function addGoal(g) {
  state.goals = [g].concat(state.goals);
  state.showForm = false;
  saveGoals(state.goals);
  render();
}

// ===== Rendering (vanilla DOM, no framework / no CDN) =====
var root = document.getElementById("root");

function render() {
  root.innerHTML = "";
  root.appendChild(buildHeader());
  root.appendChild(buildGoalsView());
  wireEvents();
}

function buildHeader() {
  var header = document.createElement("header");
  var h1 = document.createElement("h1");
  h1.textContent = "Alleah";
  var pill = document.createElement("span");
  pill.className = "hdr-pill";
  pill.textContent = "Goals · preview";
  header.appendChild(h1);
  header.appendChild(pill);
  return header;
}

function goalBoxHtml(g) {
  var diff = DIFFICULTY[g.difficulty];
  var color = GOAL_STATUS_COLOR[g.status];
  var overdue = g.status === "active" && g.target_date != null && g.target_date < nowMs();
  var total = g.objectives.length;
  var done = g.objectives.filter(function(o){ return o.done; }).length;
  var ratio = total ? done / total : 0;
  var meterColor = overdue ? "#ff7b72" : color;
  var dateLine;
  if (g.status === "completed") dateLine = "completed " + fmtAgeShort(g.completed_at);
  else if (g.status === "active") dateLine = (overdue ? "was due " : "due ") + fmtRelDay(g.target_date);
  else dateLine = "target " + fmtRelDay(g.target_date);
  var open = !!state.openIds[g.id];
  var generating = !!state.generatingIds[g.id];

  var html = "";
  html += "<div class='goal-box-head'>";
  html += "<p style='font-size:15px;font-weight:700;margin:0 0 2px'>" + esc(g.title) + "</p>";
  html += "<span class='pill' style='background:" + diff.color + "22;color:" + diff.color + ";border:1px solid " + diff.color + "55'>" + esc(diff.label) + "</span>";
  html += "</div>";
  html += "<div style='display:flex;align-items:center;gap:8px;flex-wrap:wrap'>";
  html += "<span class='badge'><span class='dot" + (g.status === "active" ? " pulse" : "") + "' style='background:" + color + "'></span><span style='color:" + color + "'>" + esc(g.status) + "</span></span>";
  html += "<span class='small'>" + esc(g.category) + "</span>";
  if (g.target_date != null) {
    html += "<span class='small'>·</span>";
    html += "<span class='small' style='color:" + (overdue ? "#ff7b72" : "#9aa3ad") + "'>" + esc(dateLine) + "</span>";
  }
  html += "</div>";
  html += "<div class='meter'><div style='width:" + (ratio*100) + "%;background:" + meterColor + "'></div></div>";
  html += "<div class='goal-obj-count'>" + done + " / " + total + " mini-objectives</div>";
  if (open) {
    html += "<div class='goal-desc'>" + esc(g.description) + "</div>";
    html += "<div class='goal-checklist'>";
    g.objectives.forEach(function(o){
      html += "<label class='goal-obj" + (o.done ? " done" : "") + "' data-toggle-goal='" + g.id + "' data-toggle-obj='" + o.id + "'>";
      html += "<input type='checkbox' " + (o.done ? "checked" : "") + " data-toggle-goal='" + g.id + "' data-toggle-obj='" + o.id + "'>";
      html += "<span>" + esc(o.text) + "</span>";
      html += "</label>";
    });
    html += "</div>";
    html += "<button type='button' class='secondary goal-generate-btn' data-generate='" + g.id + "' " + (generating ? "disabled" : "") + ">" +
      (generating ? "Generating…" : "+ Generate mini-objectives") + "</button>";
  }
  return html;
}

function buildGoalsView() {
  var wrap = document.createElement("div");
  wrap.id = "goals";

  var banner = document.createElement("div");
  banner.className = "banner";
  banner.textContent = "Preview build - synthetic demo goals, stored only in this browser's localStorage. No network calls.";
  wrap.appendChild(banner);

  var goals = state.goals;

  if (goals.length) {
    var doneCount = goals.reduce(function(n,g){ return n + g.objectives.filter(function(o){ return o.done; }).length; }, 0);
    var summary = document.createElement("div");
    summary.className = "summary";
    summary.innerHTML = "<span><b>" + goals.length + "</b> goals</span><span><b>" + doneCount + "</b> objectives done</span>";
    wrap.appendChild(summary);
  }

  if (state.showForm) {
    wrap.appendChild(buildNewGoalForm());
  } else {
    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "newgoalbtn";
    addBtn.textContent = "+ New goal";
    addBtn.addEventListener("click", function(){ setState({showForm: true}); });
    wrap.appendChild(addBtn);
  }

  if (!goals.length && !state.showForm) {
    var empty = document.createElement("p");
    empty.className = "muted";
    empty.style.padding = "16px 2px";
    empty.textContent = "No goals yet - add your first.";
    wrap.appendChild(empty);
  }

  if (goals.length) {
    var path = document.createElement("div");
    path.className = "goal-path";
    path.style.marginTop = "10px";
    goals.forEach(function(g, i){
      var row = document.createElement("div");
      row.className = "goal-row";

      var connector = document.createElement("div");
      connector.className = "goal-connector";
      var dot = document.createElement("span");
      dot.className = "goal-node-dot";
      dot.style.color = GOAL_STATUS_COLOR[g.status];
      connector.appendChild(dot);
      if (i < goals.length - 1) {
        var line = document.createElement("span");
        line.className = "goal-node-line";
        connector.appendChild(line);
      }
      row.appendChild(connector);

      var box = document.createElement("div");
      box.className = "goal-box";
      box.setAttribute("data-goal-box", g.id);
      box.innerHTML = goalBoxHtml(g);
      row.appendChild(box);

      path.appendChild(row);
    });
    wrap.appendChild(path);
  }

  return wrap;
}

function buildNewGoalForm() {
  var form = document.createElement("form");
  form.className = "card addform";
  form.innerHTML =
    "<input name='title' placeholder='Goal title' autofocus>" +
    "<div class='row2'>" +
      "<input name='category' placeholder='Category (optional)'>" +
      "<select name='difficulty'>" +
        Object.keys(DIFFICULTY).map(function(k){ return "<option value='" + k + "'" + (k === "medium" ? " selected" : "") + ">" + DIFFICULTY[k].label + "</option>"; }).join("") +
      "</select>" +
    "</div>" +
    "<input name='target_date' type='date'>" +
    "<textarea name='description' rows='3' style='min-height:70px' placeholder='Description (optional)'></textarea>" +
    "<div class='row'>" +
      "<button type='submit'>Add goal</button>" +
      "<button type='button' class='secondary' data-cancel-form>Cancel</button>" +
    "</div>";
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var fd = new FormData(form);
    var title = (fd.get("title") || "").toString().trim();
    if (!title) return;
    addGoal({
      id: "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: title,
      category: (fd.get("category") || "").toString().trim() || "General",
      difficulty: fd.get("difficulty"),
      status: "active",
      description: (fd.get("description") || "").toString().trim(),
      created_at: nowMs(),
      target_date: parseDateInputToMs(fd.get("target_date")),
      objectives: []
    });
  });
  form.querySelector("[data-cancel-form]").addEventListener("click", function(){
    setState({showForm: false});
  });
  return form;
}

function wireEvents() {
  // Expand/collapse a goal box (ignore clicks on interactive children).
  Array.prototype.forEach.call(document.querySelectorAll("[data-goal-box]"), function(box){
    box.addEventListener("click", function(e){
      if (e.target.closest("[data-toggle-goal]") || e.target.closest("[data-generate]")) return;
      toggleOpen(box.getAttribute("data-goal-box"));
    });
  });
  // Toggle a checkbox: the label only stops the click from bubbling up to the
  // goal box (which would otherwise collapse/expand it); the actual state
  // change is driven solely by the checkbox's native 'change' event so a
  // click on the label text (which forwards a click to its checkbox) never
  // double-toggles.
  Array.prototype.forEach.call(document.querySelectorAll("label[data-toggle-obj]"), function(label){
    label.addEventListener("click", function(e){ e.stopPropagation(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("input[data-toggle-obj]"), function(input){
    input.addEventListener("change", function(e){
      toggleObjective(input.getAttribute("data-toggle-goal"), input.getAttribute("data-toggle-obj"));
    });
  });
  // Generate mini-objectives button.
  Array.prototype.forEach.call(document.querySelectorAll("[data-generate]"), function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      handleGenerate(btn.getAttribute("data-generate"));
    });
  });
}

render();
})();
</script>

  overflow-y: auto;
  pointer-events: auto;
  z-index: 2147483001;
  background: #fffdf8;
  border: 1px solid #c9c2b6;
  border-radius: 8px;
  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3);
  padding: 10px;
  font: 12px/1.45 system-ui, sans-serif;
  color: #333;
}

.apo-log h3 {
  margin: 0 0 6px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #8a8478;
}

.apo-log-item { border-top: 1px solid #eee7da; padding: 6px 0; }
.apo-log-item:first-of-type { border-top: 0; }
.apo-log-rev { color: #8a8478; font-size: 11px; }
.apo-hidden { display: none; }
</style>
<script type="application/json" id="alleah-pin-config">{"task_id": "c97e3eaf-e21e-469d-922f-d1ca6bd451ba", "revision": 0, "deploy_marker": "c97e3eaf-r0-1785489235", "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "review_endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/request-review", "changelog": []}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
</body></html>
