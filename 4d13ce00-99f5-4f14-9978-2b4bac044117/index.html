<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — Upgrades (preview)</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;height:38px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;height:auto;border-radius:8px}
button:disabled{opacity:.5}
input,select,textarea{width:100%;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:10px;padding:12px;font:inherit}
textarea{resize:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#9aa3ad;font-size:14px}
#view{flex:1;overflow-y:auto;padding:8px 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.filterbtn{flex:none;background:#1a1d23;color:#9aa3ad;border:1px solid #2c313a;border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.filterbtn.active{background:#e6e6e6;color:#0f1115;border-color:#e6e6e6}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:2px 2px 10px;color:#9aa3ad;font-size:12px}
.summary b{color:#e6e6e6}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid}
.score-row{display:flex;gap:14px;margin:8px 0}
.score-col{flex:1}
.score-label{display:flex;justify-content:space-between;font-size:11px;color:#9aa3ad;margin-bottom:3px}
.priority-num{font-size:12px;color:#9aa3ad}
.priority-num b{color:#e6e6e6;font-size:14px}
.upgrade-actions{display:flex;gap:8px;margin-top:10px}
.upgrade-actions button{flex:1;padding:8px 0;height:auto}
.reject-btn{background:transparent;border:1px solid #ff7b72;color:#ff7b72}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.addform .row2{display:flex;gap:8px}
.addform .row2>*{flex:1}
.directive-item{background:#12151a;border:1px solid #2c313a;border-radius:10px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.demo-banner{background:#1a1d23;border:1px dashed #2c313a;border-radius:10px;padding:8px 12px;font-size:12px;color:#9aa3ad;margin-bottom:10px}
.menu-wrap{position:relative}
.menu-btn{width:46px;height:46px;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:12px;padding:0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:208px;background:#1a1d23;border:1px solid #2c313a;border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:30}
.menu-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9aa3ad;padding:10px 12px 6px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:transparent;color:#e6e6e6;border:0;border-radius:10px;padding:12px 12px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.menu-item:active{background:#2c313a}
.menu-item.active{background:#3ecf8e;color:#08130d;font-weight:700}
.menu-sep{height:1px;background:#2c313a;margin:6px 6px}
</style></head><body>
<div id="root">
  <header>
    <h1>Alleah</h1>
    <div class="menu-wrap" id="menuWrap">
      <button type="button" class="menu-btn" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Open menu">☰</button>
      <div class="menu-dropdown" id="menuDropdown" role="menu" style="display:none">
        <div class="menu-label">View</div>
        <div id="menuItems"></div>
      </div>
    </div>
  </header>
  <div id="view"></div>
</div>
<script>
/* ============================================================
   SEALED STATIC PREVIEW — Upgrades tab only.
   No network calls, no Supabase client, no auth. All data below
   is fixture/demo data held in memory for this preview session.
   ============================================================ */
const VIEWS = [
  {key:'chat', label:'Chat'},
  {key:'tasks', label:'Tasks'},
  {key:'goals', label:'Goals'},
  {key:'upgrades', label:'Upgrades'},
];
let currentView = 'upgrades';

const BENEFIT_TYPES = {
  ui_improvement:    {label: 'UI improvement',    color: '#58a6ff'},
  efficiency_upgrade:{label: 'Efficiency upgrade',color: '#3ecf8e'},
  feature_update:    {label: 'Feature update',    color: '#d68fff'},
  new_feature:       {label: 'New feature',       color: '#ffd166'},
  bug_fix:           {label: 'Bug fix',           color: '#ff7b72'},
};
const PROPOSAL_STATUS = {
  proposed: {label: 'Proposed', color: '#9aa3ad'},
  approved: {label: 'Approved', color: '#58a6ff'},
  building: {label: 'Building', color: '#e0a458'},
  done:     {label: 'Done',     color: '#3ecf8e'},
  rejected: {label: 'Rejected', color: '#ff7b72'},
};
const KNOWN_STATUSES = ['proposed', 'approved', 'building', 'done', 'rejected'];
const STATUS_FILTERS = ['all', 'proposed', 'approved', 'building', 'done', 'rejected', 'other'];
// Exact guardrail sentence appended to every "Approve & Build" queued task instruction,
// per Max's pin. Composed as: title, then summary, then implementation_plan, then this.
// Demo only below: nothing here inserts into a real worker_tasks table.
const BUILD_GUARDRAIL_SENTENCE = 'Build this as an app-surface preview only: ';

// ---- DEMO fixture rows (clearly synthetic; stand in for optimization_proposals) ----
let proposals = [
  {id:'d1', benefit_type:'ui_improvement', title:'[Demo] Larger tap targets on Tasks cards', summary:'Demo data: several buried buttons on the Tasks tray are hard to hit on small screens; widen the cancel control.', implementation_plan:'[Demo] Increase the .secondary cancel button min-height to 44px and add horizontal padding on the Tasks card.', functionality_score:6, cost_score:2, priority:4, status:'proposed', created_at:'2025-03-01'},
  {id:'d2', benefit_type:'efficiency_upgrade', title:'[Demo] Batch preview_tasks polling', summary:'Demo data: combine repeated polling calls into a single batched request to cut redundant round trips.', implementation_plan:'[Demo] Merge the per-task preview_tasks fetch into the existing 5s worker_tasks poll interval.', functionality_score:7, cost_score:3, priority:4, status:'approved', created_at:'2025-03-02'},
  {id:'d3', benefit_type:'feature_update', title:'[Demo] Add due-date reminders to Goals', summary:'Demo data: surface a gentle reminder badge when a goal is close to its target date.', implementation_plan:'[Demo] Compute days-until-due client side and render an amber badge on goal boxes within 3 days.', functionality_score:8, cost_score:5, priority:3, status:'building', created_at:'2025-03-03'},
  {id:'d4', benefit_type:'new_feature', title:'[Demo] Weekly digest email', summary:'Demo data: send a short weekly summary of new folders and completed goals.', implementation_plan:'[Demo] Add a scheduled edge function that emails a digest every Monday.', functionality_score:9, cost_score:6, priority:3, status:'done', created_at:'2025-02-20'},
  {id:'d5', benefit_type:'bug_fix', title:'[Demo] Fix duplicate memory citations', summary:'Demo data: chat replies occasionally cite the same folder twice in the memory line.', implementation_plan:'[Demo] Dedupe the folders array by id before rendering the citation line.', functionality_score:5, cost_score:1, priority:4, status:'rejected', created_at:'2025-02-18'},
  {id:'d6', benefit_type:'ui_improvement', title:'[Demo] Dark-mode contrast pass on chips', summary:'Demo data: a few status chips read low-contrast on OLED displays at night.', implementation_plan:'[Demo] Raise chip border/text opacity from 55% to 70% against the #0f1115 background.', functionality_score:4, cost_score:2, priority:2, status:'proposed', created_at:'2025-03-04'},
  {id:'d7', benefit_type:'efficiency_upgrade', title:'[Demo] Cache embeddings for repeat queries', summary:'Demo data: identical questions re-embed every time; cache by normalized text for a session.', implementation_plan:'[Demo] Add an in-memory Map keyed by normalized query text for the session lifetime.', functionality_score:6, cost_score:4, priority:2, status:'proposed', created_at:'2025-03-05'},
  {id:'d8', benefit_type:'new_feature', title:'[Demo] Shareable goal roadmap link', summary:'Demo data: let a user export a read-only link to their goal path for an accountability partner.', implementation_plan:'[Demo] Generate a signed read-only token that renders a stripped-down Goals view.', functionality_score:7, cost_score:7, priority:0, status:'approved', created_at:'2025-02-27'},
  {id:'d9', benefit_type:'ui_improvement', title:'[Demo] Archived idea: skeuomorphic icons', summary:'Demo data: illustrates a status value outside the five known states - it is bucketed under the "Other" filter so counts still sum to the total.', implementation_plan:'[Demo] N/A - archived.', functionality_score:3, cost_score:2, priority:1, status:'archived', created_at:'2025-01-10'},
  {id:'d10', benefit_type:'efficiency_upgrade', title:'[Demo] Scoring still pending', summary:'Demo data: cost_score has not been set yet, so the meters and priority line are hidden until both scores exist.', implementation_plan:'[Demo] N/A - awaiting review.', functionality_score:7, cost_score:null, priority:null, status:'proposed', created_at:'2025-03-06'},
  {id:'d11', benefit_type:'legacy_cleanup', title:'[Demo] Retire unused feature-flag table', summary:'Demo data: benefit_type values outside the five known categories still render their raw string, never a blank chip.', implementation_plan:'[Demo] Drop the deprecated flags table after confirming no reads remain.', functionality_score:4, cost_score:3, priority:1, status:'proposed', created_at:'2025-03-07'},
];
let directives = [
  {id:'r1', directive_text:'[Demo] How do other note apps handle atomic idea splitting?', priority:3},
];
let currentFilter = 'all';
let directiveMsg = '';
let actionMsg = '';
// Single status-message timer "ref" (this preview has no React refs, so a plain
// module-level handle stands in for one): always cleared before a new message is
// scheduled, and cleared when the user navigates away from Upgrades (unmount).
let msgTimer = null;
function clearMsgTimer() {
  if (msgTimer) { clearTimeout(msgTimer); msgTimer = null; }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderMenu() {
  const items = document.getElementById('menuItems');
  items.innerHTML = VIEWS.map(function(v) {
    return '<button type="button" role="menuitem" class="menu-item' + (currentView === v.key ? ' active' : '') +
      '" data-view="' + v.key + '">' + escapeHtml(v.label) + '</button>';
  }).join('') + '<div class="menu-sep"></div><div class="menu-label" style="padding-top:0">Preview scope</div>' +
    '<div class="small" style="padding:0 12px 8px">Only the Upgrades tab is implemented in this static preview.</div>';
  Array.prototype.forEach.call(items.querySelectorAll('[data-view]'), function(btn) {
    btn.addEventListener('click', function() {
      currentView = btn.getAttribute('data-view');
      if (currentView !== 'upgrades') clearMsgTimer(); // leaving Upgrades = "unmount"
      document.getElementById('menuDropdown').style.display = 'none';
      document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
      renderMenu();
      renderView();
    });
  });
}

function renderStub(label) {
  return '<div class="card"><p class="muted" style="margin:0">The "' + escapeHtml(label) +
    '" tab is not part of this preview build - only the new Upgrades tab is implemented here.</p></div>';
}

function proposalCardHtml(p) {
  // Benefit chip fallback: raw benefit_type string, or 'unknown' if the field
  // itself is missing/blank - the chip must never render empty.
  const benefit = BENEFIT_TYPES[p.benefit_type] || {label: (p.benefit_type || 'unknown'), color: '#9aa3ad'};
  const status = PROPOSAL_STATUS[p.status] || {label: p.status, color: '#9aa3ad'};
  // Scores render as (value ?? '-')/10; meters and the priority line are hidden
  // whenever either score is null, and priority is the DB column, never recomputed.
  const hasScores = p.functionality_score != null && p.cost_score != null;
  const funcTxt = (p.functionality_score == null ? '-' : p.functionality_score) + '/10';
  const costTxt = (p.cost_score == null ? '-' : p.cost_score) + '/10';
  const actions = p.status === 'proposed'
    ? '<div class="upgrade-actions">' +
        '<button type="button" data-approve="' + p.id + '">Approve &amp; Build</button>' +
        '<button type="button" class="reject-btn" data-reject="' + p.id + '">Reject</button>' +
      '</div>'
    : '';
  const scoreRow = '<div class="score-row">' +
      '<div class="score-col"><div class="score-label"><span>Functionality</span><span>' + funcTxt + '</span></div>' +
        (hasScores ? '<div class="meter"><div style="width:' + (p.functionality_score*10) + '%;background:#3ecf8e"></div></div>' : '') + '</div>' +
      '<div class="score-col"><div class="score-label"><span>Cost</span><span>' + costTxt + '</span></div>' +
        (hasScores ? '<div class="meter"><div style="width:' + (p.cost_score*10) + '%;background:#e0a458"></div></div>' : '') + '</div>' +
    '</div>';
  const priorityLine = hasScores ? '<div class="priority-num">Priority score: <b>' + (p.priority == null ? '-' : p.priority) + '</b></div>' : '';
  return '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
      '<span class="chip" style="background:' + benefit.color + '22;color:' + benefit.color + ';border-color:' + benefit.color + '55">' + escapeHtml(benefit.label) + '</span>' +
      '<span class="badge"><span class="dot" style="background:' + status.color + '"></span><span style="color:' + status.color + '">' + escapeHtml(status.label) + '</span></span>' +
    '</div>' +
    '<p style="font-size:15px;font-weight:700;margin:10px 0 2px">' + escapeHtml(p.title) + '</p>' +
    '<p class="small" style="font-size:13.5px;color:#c7ccd3;margin:2px 0 0">' + escapeHtml(p.summary) + '</p>' +
    scoreRow +
    priorityLine +
    actions +
  '</div>';
}

function renderUpgrades() {
  // Statuses outside KNOWN_STATUSES fall into the 'other' bucket so per-status
  // counts always sum to the total, however proposals.status is populated.
  const counts = {};
  STATUS_FILTERS.forEach(function(f) {
    if (f === 'all') counts[f] = proposals.length;
    else if (f === 'other') counts[f] = proposals.filter(function(p){ return KNOWN_STATUSES.indexOf(p.status) === -1; }).length;
    else counts[f] = proposals.filter(function(p){ return p.status === f; }).length;
  });
  const visible = currentFilter === 'all' ? proposals
    : currentFilter === 'other' ? proposals.filter(function(p){ return KNOWN_STATUSES.indexOf(p.status) === -1; })
    : proposals.filter(function(p){ return p.status === currentFilter; });

  const filterHtml = '<div class="filterbar">' + STATUS_FILTERS.map(function(f) {
    const label = (PROPOSAL_STATUS[f] ? PROPOSAL_STATUS[f].label : (f === 'other' ? 'Other' : 'All')) + ' (' + counts[f] + ')';
    return '<button type="button" class="filterbtn' + (currentFilter === f ? ' active' : '') + '" data-filter="' + f + '">' + escapeHtml(label) + '</button>';
  }).join('') + '</div>';

  const summaryHtml = proposals.length ? '<div class="summary"><span><b>' + proposals.length + '</b> total</span>' +
    STATUS_FILTERS.filter(function(f){ return f !== 'all'; }).map(function(f) {
      const label = PROPOSAL_STATUS[f] ? PROPOSAL_STATUS[f].label : 'Other';
      return '<span><b>' + counts[f] + '</b> ' + label.toLowerCase() + '</span>';
    }).join('') + '</div>' : '';

  const listHtml = visible.length
    ? visible.map(proposalCardHtml).join('')
    : '<p class="muted" style="padding:8px 2px">No proposals match this filter.</p>';

  const directivesHtml = directives.length
    ? directives.map(function(d) {
        return '<div class="directive-item"><span>' + escapeHtml(d.directive_text) + '</span><span class="small">priority ' + d.priority + '</span></div>';
      }).join('')
    : '';

  const formHtml =
    '<form class="card addform" id="directiveForm">' +
      '<p style="font-size:14px;font-weight:700;margin:0 0 2px">Queue a research question</p>' +
      '<textarea id="directiveText" placeholder="What should Alleah look into?" rows="3" style="min-height:70px"></textarea>' +
      '<div class="row2">' +
        '<select id="directivePriority">' +
          [1,2,3,4,5].map(function(n){ return '<option value="' + n + '"' + (n===3?' selected':'') + '>Priority ' + n + (n===1?' (low)':n===5?' (high)':'') + '</option>'; }).join('') +
        '</select>' +
        '<button type="submit">Queue question</button>' +
      '</div>' +
      (directiveMsg ? '<p class="small" style="color:#3ecf8e">' + escapeHtml(directiveMsg) + '</p>' : '') +
      (directivesHtml ? '<div style="margin-top:4px">' + directivesHtml + '</div>' : '') +
    '</form>';

  document.getElementById('view').innerHTML =
    '<div id="upgrades">' +
      '<div class="demo-banner">Demo data - fixture rows only. Nothing here reads or writes a real database.</div>' +
      filterHtml + summaryHtml +
      (actionMsg ? '<p class="small" style="color:#3ecf8e">' + escapeHtml(actionMsg) + '</p>' : '') +
      listHtml + formHtml +
    '</div>';

  wireUpgradesEvents();
}

function wireUpgradesEvents() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function(btn) {
    btn.addEventListener('click', function() {
      currentFilter = btn.getAttribute('data-filter');
      renderUpgrades();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-approve]'), function(btn) {
    btn.addEventListener('click', function() { approveAndBuild(btn.getAttribute('data-approve')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-reject]'), function(btn) {
    btn.addEventListener('click', function() { decide(btn.getAttribute('data-reject'), 'rejected'); });
  });
  const form = document.getElementById('directiveForm');
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const textEl = document.getElementById('directiveText');
      const text = textEl.value.trim();
      if (!text) return;
      const priority = Number(document.getElementById('directivePriority').value);
      directives = [{id:'r' + Date.now(), directive_text: text, priority: priority}, ...directives];
      directiveMsg = 'Question queued (demo only - not saved to a real table).';
      clearMsgTimer();
      renderUpgrades();
      msgTimer = setTimeout(function() { directiveMsg = ''; msgTimer = null; renderUpgrades(); }, 3000);
    });
  }
}

function decide(id, status) {
  proposals = proposals.map(function(p) { return p.id === id ? Object.assign({}, p, {status: status}) : p; });
  renderUpgrades();
}

// Approve & Build (demo): confirm, flip the fixture row to 'approved' locally, then
// simulate queuing a capped build task. Instruction chains title -> summary ->
// implementation_plan -> the exact guardrail sentence. Nothing here is a real
// worker_tasks insert - this is a sealed static preview with no network calls.
function approveAndBuild(id) {
  const p = proposals.find(function(x) { return x.id === id; });
  if (!p) return;
  if (!window.confirm('Approve and queue a build task (~$2 cap)?')) return;
  proposals = proposals.map(function(x) { return x.id === id ? Object.assign({}, x, {status: 'approved'}) : x; });
  const instruction = [p.title, p.summary, p.implementation_plan || '', BUILD_GUARDRAIL_SENTENCE].join('\n\n');
  console.log('[demo] would insert worker_tasks row:', {kind: 'build', status: 'queued', instruction: instruction});
  actionMsg = 'Approved. Build task queued (demo only - not sent to a real worker).';
  clearMsgTimer();
  renderUpgrades();
  msgTimer = setTimeout(function() { actionMsg = ''; msgTimer = null; renderUpgrades(); }, 3500);
}

function renderView() {
  if (currentView === 'upgrades') renderUpgrades();
  else {
    const v = VIEWS.find(function(x){ return x.key === currentView; });
    document.getElementById('view').innerHTML = renderStub(v ? v.label : currentView);
  }
}

document.getElementById('menuBtn').addEventListener('click', function() {
  const dd = document.getElementById('menuDropdown');
  const open = dd.style.display !== 'none';
  dd.style.display = open ? 'none' : 'block';
  this.setAttribute('aria-expanded', String(!open));
});
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('menuWrap');
  if (!wrap.contains(e.target)) {
    document.getElementById('menuDropdown').style.display = 'none';
    document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
  }
});

renderMenu();
renderView();
</script>

<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
