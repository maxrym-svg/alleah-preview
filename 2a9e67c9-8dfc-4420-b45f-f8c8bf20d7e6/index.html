<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — Goals</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;gap:8px}
h1{font-size:18px;margin:0;flex-shrink:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button.secondary.active{background:#3ecf8e;color:#08130d}
button:disabled{opacity:.5}
.muted{color:#9aa3ad;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#3ecf8e;color:#08130d;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1a1d23;border:1px solid #2c313a;border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
#tasks{flex:1;overflow-y:auto;padding:8px 14px}
#goals{flex:1;overflow-y:auto;padding:8px 14px 24px}
.summary-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.summary-num{font-size:20px;font-weight:700;color:#3ecf8e}
.summary-grid{display:flex;gap:10px;margin-top:8px}
.summary-stat{flex:1;text-align:center;background:#0f1115;border:1px solid #2c313a;border-radius:8px;padding:8px 4px}
.summary-stat .n{font-size:16px;font-weight:700}
.summary-stat .l{font-size:10.5px;color:#9aa3ad;margin-top:2px}
.filter-bar{display:flex;gap:6px;margin:14px 0 4px}
/* ===== Goals map: scavenger-hunt style trail, easiest goal at the top,
   hardest at the bottom, alternating left/right down a dashed spine. ===== */
.map-wrap{position:relative;padding:34px 0 6px}
.map-wrap::before{content:'';position:absolute;left:50%;top:2px;bottom:2px;width:2px;
  background:repeating-linear-gradient(to bottom,#2c313a 0 6px,transparent 6px 13px);
  transform:translateX(-50%);z-index:0}
.map-row{position:relative;display:flex;margin:0 0 40px;z-index:1}
.map-row:last-child{margin-bottom:4px}
.map-row.mleft{justify-content:flex-start}
.map-row.mright{justify-content:flex-end}
.map-node{width:47%;position:relative;z-index:2}
.map-stem{position:absolute;top:22px;height:2px;background:#2c313a;z-index:1}
.map-row.mleft .map-stem{left:47%;width:3%}
.map-row.mright .map-stem{right:47%;width:3%}
.map-dot{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:18px;height:18px;
  border-radius:50%;border:3px solid #0f1115;z-index:3;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;color:#08130d}
.map-tag{position:absolute;top:-15px;font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;white-space:nowrap}
.map-row.mleft .map-tag{left:2px}
.map-row.mright .map-tag{right:2px}
.goal-card{background:#12151a;border:1px solid #2c313a;border-radius:11px;overflow:hidden}
.goal-head{padding:10px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.goal-toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-title{font-weight:600;font-size:13.5px;line-height:1.3}
.goal-desc{font-size:11.5px;color:#9aa3ad;margin-top:1px}
.chev{flex-shrink:0;color:#9aa3ad;transition:transform .2s ease;margin-top:1px;display:inline-block;font-size:12px}
.chev.open{transform:rotate(90deg)}
.progress-row{display:flex;align-items:center;gap:7px;margin-top:1px}
.progress-row .meter{flex:1;margin:0;height:6px}
.progress-row .frac{font-size:11px;color:#9aa3ad;white-space:nowrap}
.steps-inner{padding:4px 12px 10px;border-top:1px solid #2c313a}
.step-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #1c2027;cursor:pointer}
.step-row:last-child{border-bottom:none}
.step-row input[type=checkbox]{width:18px;height:18px;accent-color:#3ecf8e;flex-shrink:0;cursor:pointer}
.step-title{font-size:13px}
.step-title.done{color:#6f7580;text-decoration:line-through}
.step-meta{margin-left:auto;font-size:10.5px;color:#5c636e;white-space:nowrap}
.status-active{color:#3ecf8e}
.status-completed{color:#9aa3ad}
.note{font-size:11px;color:#5c636e;padding:2px 6px 0}
</style></head><body>
<div id="root"></div>
<script>
(function(){
'use strict';
const h = (tag, attrs) => { let s = '<' + tag; attrs = attrs || {}; for (const k in attrs) s += ' ' + k + '="' + attrs[k] + '"'; return s; };

// ===== Synthetic, self-contained demo fixtures (no network calls) =====
const now = Date.now();
const hrsAgo = (n) => new Date(now - n*3600000).toISOString();
const daysAgo = (n) => new Date(now - n*86400000).toISOString();

let GOALS = [
  {id:'g1', title:'Drink 8 glasses of water daily', description:'Small daily habit to build hydration consistency.', status:'active', difficulty:1, created_at: daysAgo(30)},
  {id:'g2', title:'Read 12 books this year', description:'One a month, mixing fiction and non-fiction.', status:'active', difficulty:1, created_at: daysAgo(25)},
  {id:'g3', title:'Tidy the home office', description:'One clean, calm space to actually work in.', status:'completed', difficulty:1, created_at: daysAgo(60)},
  {id:'g4', title:'Hold a conversation in Spanish', description:'Enough to order food and chat with a stranger.', status:'active', difficulty:2, created_at: daysAgo(20)},
  {id:'g5', title:'Run a half marathon', description:'13.1 miles, on my own two feet, by autumn.', status:'active', difficulty:3, created_at: daysAgo(14)},
  {id:'g6', title:'Launch a small side business', description:'Ship something people can actually pay for.', status:'active', difficulty:3, created_at: daysAgo(9)},
  {id:'g7', title:'Write and publish a novel', description:'50,000 words, start to finished draft.', status:'active', difficulty:4, created_at: daysAgo(3)},
];

let STEPS = [
  {id:'s1', goal_id:'g1', position:1, title:'Buy a marked water bottle', completed:true, completed_at: daysAgo(29)},
  {id:'s2', goal_id:'g1', position:2, title:'Set 3 daily reminders', completed:true, completed_at: daysAgo(27)},
  {id:'s3', goal_id:'g1', position:3, title:'Track for 2 full weeks', completed:false, completed_at:null},

  {id:'s4', goal_id:'g2', position:1, title:'Pick the first 3 books', completed:true, completed_at: daysAgo(24)},
  {id:'s5', goal_id:'g2', position:2, title:'Finish book one', completed:true, completed_at: daysAgo(18)},
  {id:'s6', goal_id:'g2', position:3, title:'Finish book two', completed:false, completed_at:null},
  {id:'s7', goal_id:'g2', position:4, title:'Finish book three', completed:false, completed_at:null},

  {id:'s8', goal_id:'g3', position:1, title:'Clear the desk', completed:true, completed_at: daysAgo(58)},
  {id:'s9', goal_id:'g3', position:2, title:'Sort the cable drawer', completed:true, completed_at: daysAgo(56)},
  {id:'s10', goal_id:'g3', position:3, title:'Donate the old chair', completed:true, completed_at: daysAgo(55)},

  {id:'s11', goal_id:'g4', position:1, title:'Learn the present tense basics', completed:true, completed_at: daysAgo(19)},
  {id:'s12', goal_id:'g4', position:2, title:'Learn 200 core vocab words', completed:true, completed_at: daysAgo(12)},
  {id:'s13', goal_id:'g4', position:3, title:'Complete 10 speaking lessons', completed:false, completed_at:null},
  {id:'s14', goal_id:'g4', position:4, title:'Have a 5-minute chat with a tutor', completed:false, completed_at:null},
  {id:'s15', goal_id:'g4', position:5, title:'Order a full meal in Spanish', completed:false, completed_at:null},

  {id:'s16', goal_id:'g5', position:1, title:'Run a 5k without stopping', completed:true, completed_at: daysAgo(10)},
  {id:'s17', goal_id:'g5', position:2, title:'Run a 10k', completed:false, completed_at:null},
  {id:'s18', goal_id:'g5', position:3, title:'Build up to 15 miles/week', completed:false, completed_at:null},
  {id:'s19', goal_id:'g5', position:4, title:'Run a half-distance training run', completed:false, completed_at:null},
  {id:'s20', goal_id:'g5', position:5, title:'Race day', completed:false, completed_at:null},

  {id:'s21', goal_id:'g6', position:1, title:'Validate the idea with 10 people', completed:false, completed_at:null},
  {id:'s22', goal_id:'g6', position:2, title:'Build a minimum viable product', completed:false, completed_at:null},
  {id:'s23', goal_id:'g6', position:3, title:'Set up payments', completed:false, completed_at:null},
  {id:'s24', goal_id:'g6', position:4, title:'Get the first paying customer', completed:false, completed_at:null},
  {id:'s25', goal_id:'g6', position:5, title:'Reach 10 paying customers', completed:false, completed_at:null},
  {id:'s26', goal_id:'g6', position:6, title:'Take a full week off and it keeps running', completed:false, completed_at:null},

  {id:'s27', goal_id:'g7', position:1, title:'Outline the plot', completed:false, completed_at:null},
  {id:'s28', goal_id:'g7', position:2, title:'Write the first 10,000 words', completed:false, completed_at:null},
  {id:'s29', goal_id:'g7', position:3, title:'Reach the halfway point', completed:false, completed_at:null},
  {id:'s30', goal_id:'g7', position:4, title:'Finish the first draft', completed:false, completed_at:null},
  {id:'s31', goal_id:'g7', position:5, title:'Revise with beta readers', completed:false, completed_at:null},
  {id:'s32', goal_id:'g7', position:6, title:'Publish', completed:false, completed_at:null},
];

const MESSAGES = [
  {role:'assistant', content:"Talk to me. What you tell me about what you know gets remembered - automatically."},
  {role:'user', content:'Remind me what I said about training for the half marathon.'},
  {role:'assistant', content:"You're building up mileage gradually and just finished your first 5k without stopping. Race day is the goal — I've got it tracked in Goals."},
];

const TASKS = [
  {id:'t1', kind:'build', status:'done', instruction:'Add a Goals tab with expandable step checklists', created_at: hrsAgo(5), completed_at: hrsAgo(4), steps_used: 31, spend_usd: 1.42},
  {id:'t2', kind:'research', status:'done', instruction:'Summarize best practices for habit-tracking UI', created_at: hrsAgo(26), completed_at: hrsAgo(25), steps_used: 9, spend_usd: 0.11},
];

function diffMeta(n) {
  const DIFF = [
    {label:'Warm-up',     color:'#3ecf8e'},
    {label:'Steady',      color:'#5ec9e0'},
    {label:'Challenging', color:'#e0a458'},
    {label:'Expedition',  color:'#ff7b72'},
  ];
  const i = Math.min(Math.max((n|0) - 1, 0), DIFF.length - 1);
  return DIFF[i];
}
function stepFraction(steps) {
  const total = steps.length;
  const done = steps.filter(s => s.completed).length;
  return {total, done, pct: total ? Math.round(done/total*100) : 0};
}
function fmtAge(iso) {
  const m = Math.floor((now - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ===== app state =====
const state = { view: 'goals', filter: 'active', open: {} };

function render() {
  const root = document.getElementById('root');
  root.innerHTML =
    h('header') +
      '<h1>Alleah</h1>' +
      h('div', {class:'tabs'}) +
        h('button', {class:'secondary' + (state.view==='chat'?' active':''), onclick:'App.setView("chat")'}) + 'Chat</button>' +
        h('button', {class:'secondary' + (state.view==='tasks'?' active':''), onclick:'App.setView("tasks")'}) + 'Tasks</button>' +
        h('button', {class:'secondary' + (state.view==='goals'?' active':''), onclick:'App.setView("goals")'}) + 'Goals</button>' +
      '</div>' +
    '</header>' +
    (state.view === 'chat' ? renderChat() : state.view === 'tasks' ? renderTasks() : renderGoals());
}

function renderChat() {
  let out = h('div', {id:'thread'});
  MESSAGES.forEach(m => { out += h('div', {class:'msg ' + m.role}) + esc(m.content) + '</div>'; });
  out += '</div>';
  out += h('div', {class:'composer'}) +
    h('textarea', {placeholder:'Message Alleah...', rows:1, disabled:'disabled'}) + '</textarea>' +
    h('button', {disabled:'disabled'}) + 'Send</button>' +
  '</div>';
  out += '<p class="note" style="padding:0 14px">Demo preview — chat is static, read-only.</p>';
  return out;
}

function renderTasks() {
  let out = h('div', {id:'tasks'});
  TASKS.forEach(t => {
    out += h('div', {class:'card'}) +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
        h('span', {class:'badge'}) +
          h('span', {class:'dot', style:'background:#3ecf8e'}) + '</span>' +
          '<span style="color:#3ecf8e">' + t.kind + ' · ' + t.status + '</span>' +
        '</span>' +
        '<span class="small">' + fmtAge(t.created_at) + '</span>' +
      '</div>' +
      '<p style="margin:8px 0 4px">' + esc(t.instruction) + '</p>' +
      '<p class="small">steps ' + t.steps_used + ' · $' + t.spend_usd.toFixed(2) + '</p>' +
    '</div>';
  });
  return out + '</div>';
}

function renderGoals() {
  const stepsByGoal = {};
  STEPS.forEach(s => { (stepsByGoal[s.goal_id] = stepsByGoal[s.goal_id] || []).push(s); });
  const activeGoals = GOALS.filter(g => g.status === 'active');
  const visible = GOALS.filter(g => state.filter === 'all' ? true : g.status === 'active');
  const trail = visible.slice().sort((a, b) =>
    (a.difficulty||1) - (b.difficulty||1) || new Date(a.created_at) - new Date(b.created_at));
  const activeFrac = stepFraction(activeGoals.flatMap(g => stepsByGoal[g.id] || []));
  const completedCount = GOALS.filter(g => g.status === 'completed').length;

  let out = h('div', {id:'goals'});

  out += h('div', {class:'card'}) +
    '<div class="summary-top">' +
      '<div><span class="summary-num">' + activeGoals.length + '</span> ' +
        '<span class="muted">' + (activeGoals.length === 1 ? 'active goal' : 'active goals') + '</span></div>' +
      '<span class="small">' + activeFrac.pct + '% of active steps done</span>' +
    '</div>' +
    h('div', {class:'meter'}) + h('div', {style:'width:'+activeFrac.pct+'%;background:#3ecf8e'}) + '</div></div>' +
    '<div class="summary-grid">' +
      '<div class="summary-stat"><div class="n">' + activeFrac.done + '</div><div class="l">steps done</div></div>' +
      '<div class="summary-stat"><div class="n">' + (activeFrac.total - activeFrac.done) + '</div><div class="l">steps left</div></div>' +
      '<div class="summary-stat"><div class="n">' + completedCount + '</div><div class="l">completed goals</div></div>' +
    '</div>' +
  '</div>';

  out += '<div class="filter-bar">' +
    h('button', {class:'secondary' + (state.filter==='active'?' active':''), onclick:'App.setFilter("active")'}) + 'Active</button>' +
    h('button', {class:'secondary' + (state.filter==='all'?' active':''), onclick:'App.setFilter("all")'}) + 'All</button>' +
  '</div>';

  out += '<p class="note">Map runs easiest → hardest as you scroll down.</p>';

  out += '<div class="map-wrap">';
  trail.forEach((g, i) => {
    const side = i % 2 === 0 ? 'mleft' : 'mright';
    const dm = diffMeta(g.difficulty);
    const gsteps = stepsByGoal[g.id] || [];
    const frac = stepFraction(gsteps);
    const isOpen = !!state.open[g.id];
    out += '<div class="map-row ' + side + '">' +
      '<span class="map-tag" style="color:' + dm.color + '">' + dm.label + '</span>' +
      '<span class="map-stem"></span>' +
      '<span class="map-dot" style="background:' + dm.color + '">' + (i+1) + '</span>' +
      '<div class="map-node">' +
        '<div class="goal-card">' +
          '<div class="goal-head" onclick="App.toggleGoal(\'' + g.id + '\')">' +
            '<div class="goal-toprow">' +
              '<div>' +
                '<div class="goal-title">' + esc(g.title) + '</div>' +
                (g.description ? '<div class="goal-desc">' + esc(g.description) + '</div>' : '') +
              '</div>' +
              '<div style="display:flex;align-items:center;gap:8px">' +
                '<span class="badge"><span class="dot" style="background:#3ecf8e"></span>' +
                  '<span class="' + (g.status==='completed'?'status-completed':'status-active') + '">' + g.status + '</span></span>' +
                '<span class="chev' + (isOpen?' open':'') + '">▸</span>' +
              '</div>' +
            '</div>' +
            '<div class="progress-row">' +
              '<div class="meter"><div style="width:' + frac.pct + '%;background:#3ecf8e"></div></div>' +
              '<span class="frac">' + frac.done + '/' + frac.total + ' steps</span>' +
            '</div>' +
          '</div>' +
          (isOpen ? '<div class="steps-inner">' +
            gsteps.map(s =>
              '<label class="step-row">' +
                '<input type="checkbox" ' + (s.completed?'checked':'') + ' onclick="event.stopPropagation();App.toggleStep(\'' + s.id + '\')">' +
                '<span class="step-title' + (s.completed?' done':'') + '">' + esc(s.title) + '</span>' +
                (s.completed && s.completed_at ? '<span class="step-meta">done ' + fmtAge(s.completed_at) + '</span>' : '') +
              '</label>').join('') +
          '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  });
  out += '</div>';

  return out;
}

window.App = {
  setView(v) { state.view = v; render(); },
  setFilter(f) { state.filter = f; render(); },
  toggleGoal(id) { state.open[id] = !state.open[id]; render(); },
  toggleStep(id) {
    const s = STEPS.find(x => x.id === id);
    if (!s) return;
    s.completed = !s.completed;
    s.completed_at = s.completed ? new Date().toISOString() : null;
    // Roll the goal's status up from its steps, mirroring the server trigger.
    const gid = s.goal_id;
    const gsteps = STEPS.filter(x => x.goal_id === gid);
    const goal = GOALS.find(g => g.id === gid);
    if (goal && goal.status !== 'archived') {
      const allDone = gsteps.length > 0 && gsteps.every(x => x.completed);
      goal.status = allDone ? 'completed' : 'active';
    }
    render();
  },
};

render();
})();
</script>

<script type="application/json" id="alleah-pin-config">{"task_id": "2a9e67c9-8dfc-4420-b45f-f8c8bf20d7e6", "revision": 1, "deploy_marker": "2a9e67c9-r1-1785326656", "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "changelog": [{"revision": 0, "note": "Would you be able to make the goals yo oriented in a way that looks more like a map rather than a list of goals. When clicking on each goal I love the mini objectives on them but just make the goals look smaller, more spread out and connected by lines. I\u2019d like it to look something akin to a scavenger hunt map where the place of the goal boxes alternate from left to right and as you scroll down it gets to the harder and harder goals.", "resolution": "resolved"}]}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
