<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — Goals</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{min-height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
.hdr-badge{font-size:12px;color:#9aa3ad;border:1px solid #2c313a;border-radius:999px;padding:4px 12px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;height:40px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;height:auto;border-radius:8px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:10px;padding:12px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#9aa3ad;font-size:14px}
#goals{flex:1;overflow-y:auto;padding:8px 14px 40px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:2px 2px 10px;color:#9aa3ad;font-size:12px}
.summary b{color:#e6e6e6}
.goal-desc{white-space:pre-wrap;background:#0f1115;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;font-size:13.5px;color:#c7ccd3}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.addform .row2{display:flex;gap:8px}
.addform .row2>*{flex:1}
.newgoalbtn{width:100%;text-align:left;background:#1a1d23;color:#9aa3ad;border:1px dashed #2c313a}
.goal-path{display:flex;flex-direction:column}
.goal-row{display:flex;gap:10px}
.goal-connector{display:flex;flex-direction:column;align-items:center;width:18px;flex:none}
.goal-node-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:14px;box-shadow:0 0 0 3px #0f1115,0 0 0 4.5px currentColor}
.goal-node-line{width:2px;flex:1;min-height:22px;background:#2c313a;margin:4px 0}
.goal-box{flex:1;min-width:0;background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.goal-box-summary{cursor:pointer}
.goal-box-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-obj-count{font-size:12px;color:#9aa3ad}
.goal-open{margin-top:0}
.goal-checklist{margin-top:10px;padding-top:10px;border-top:1px solid #2c313a;display:flex;flex-direction:column;gap:2px}
.goal-obj{display:flex;align-items:center;gap:6px;min-height:44px}
.goal-obj-label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.goal-obj input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#3ecf8e;cursor:pointer}
.goal-obj span{font-size:14px}
.goal-obj.done .goal-obj-label span{text-decoration:line-through;color:#9aa3ad}
.goal-obj-del{background:transparent;border:0;color:#9aa3ad;font-size:20px;line-height:1;padding:6px 10px;cursor:pointer;flex:none;border-radius:8px}
.goal-obj-del:active{color:#ff7b72;background:#1a1d23}
.addstep{display:flex;gap:8px;margin-top:8px}
.addstep input{flex:1}
.addstep button{flex:none;padding:0 16px;height:40px}
.steps-generating{display:flex;align-items:center;gap:10px;color:#9aa3ad;font-size:13.5px;padding:10px 2px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #2c313a;border-top-color:#3ecf8e;flex:none;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.previewnote{font-size:11px;color:#5c636e;text-align:center;padding:10px 14px 22px}
</style></head>
<body>
<div id="root">
  <header>
    <h1>Alleah</h1>
    <span class="hdr-badge">Goals · preview</span>
  </header>
  <div id="goals"></div>
  <p class="previewnote">Sealed preview — fixture data only, no network calls, nothing you enter here is sent anywhere.</p>
</div>
<script>
(function () {
  "use strict";
  const GOALS_KEY = "alleah_goals_preview_v1"; // preview-local key, kept separate from the real app's storage
  const DIFFICULTY = {
    easy:   {label: 'Easy',   color: '#3ecf8e'},
    medium: {label: 'Medium', color: '#58a6ff'},
    hard:   {label: 'Hard',   color: '#e0a458'},
    epic:   {label: 'Epic',   color: '#d68fff'},
  };
  const GOAL_STATUS_COLOR = {active:'#3ecf8e', completed:'#3ecf8e', paused:'#e0a458', abandoned:'#5c636e'};
  const DAY = 86400000;
  const now = Date.now();

  // ---- Synthetic seed fixtures (only used the very first time the preview loads) ----
  const SEED_GOALS = [
    {
      id: 'g_demo1', title: 'Learn conversational Spanish', category: 'Language', difficulty: 'medium',
      status: 'active', description: 'Get comfortable holding a casual 10-minute conversation with a native speaker by practicing a little every day.',
      created_at: now - 18*DAY, target_date: now + 42*DAY, stepsStatus: 'done',
      objectives: [
        {id:'o1', text:'Finish beginner course units 1-5', done:true},
        {id:'o2', text:'Practice 15 minutes daily with an app', done:true},
        {id:'o3', text:'Learn the 100 most common verbs', done:false},
        {id:'o4', text:'Have a 5-minute chat with a native speaker', done:false},
      ],
    },
    {
      id: 'g_demo2', title: 'Run a 10K', category: 'Fitness', difficulty: 'hard',
      status: 'active', description: 'Build up endurance from a standing start to comfortably finishing a 10K run.',
      created_at: now - 30*DAY, target_date: now + 60*DAY, stepsStatus: 'done',
      objectives: [
        {id:'o5', text:'Run 3x per week for 2 weeks straight', done:true},
        {id:'o6', text:'Complete a 5K without stopping', done:true},
        {id:'o7', text:'Add one weekly long run', done:false},
        {id:'o8', text:'Complete an 8K training run', done:false},
        {id:'o9', text:'Sign up for a local 10K race', done:false},
      ],
    },
    {
      id: 'g_demo3', title: 'Read 12 books this year', category: 'Personal', difficulty: 'easy',
      status: 'completed', description: 'A book a month, mixing fiction and nonfiction.',
      created_at: now - 380*DAY, completed_at: now - 5*DAY, target_date: now - 5*DAY, stepsStatus: 'done',
      objectives: [
        {id:'o10', text:'Pick and start book 1', done:true},
        {id:'o11', text:'Finish 6 books by mid-year', done:true},
        {id:'o12', text:'Finish all 12 books', done:true},
      ],
    },
  ];

  function loadGoals() {
    try {
      const raw = JSON.parse(localStorage.getItem(GOALS_KEY));
      if (Array.isArray(raw) && raw.length) return raw;
    } catch (e) {}
    return SEED_GOALS.map(g => ({...g, objectives: g.objectives.map(o => ({...o}))}));
  }
  function saveGoals() { localStorage.setItem(GOALS_KEY, JSON.stringify(state.goals)); }

  function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function parseDateInputToMs(dateStr) {
    if (!dateStr) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
    if (!m) return null;
    const year = Number(m[1]), month = Number(m[2]), day = Number(m[3]);
    return new Date(year, month - 1, day).getTime();
  }
  function fmtRelDay(ms) {
    const days = Math.round((ms - Date.now()) / DAY);
    if (days === 0) return 'today';
    if (days > 0) return 'in ' + days + 'd';
    return Math.abs(days) + 'd ago';
  }
  function fmtAgeShort(ms) {
    const days = Math.round((Date.now() - ms) / DAY);
    if (days < 1) return 'today';
    if (days < 30) return days + 'd ago';
    if (days < 365) return Math.round(days/30) + 'mo ago';
    return Math.round(days/365) + 'y ago';
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Fake goal-steps "generation" ----
  // Stands in for POST /functions/v1/goal-steps -> {steps:[...]}. Deterministic,
  // hardcoded fixture pools keyed by difficulty (no network call fires here at all -
  // just a short setTimeout so the "generating steps…" state is visibly real).
  const STEP_POOLS = {
    easy: (t) => [
      'Write down why "' + t + '" matters to you',
      'Break it into 2-3 smaller milestones',
      'Do a first 20-minute session on it',
      'Set a weekly check-in reminder',
    ],
    medium: (t) => [
      'Research the best approach for "' + t + '"',
      'Set a concrete first milestone with a date',
      'Block recurring time on the calendar for it',
      'Complete the first practice session',
      'Find an accountability partner or community',
    ],
    hard: (t) => [
      'Map out a phased plan for "' + t + '"',
      'Identify the hardest sub-skill and tackle it first',
      'Set up a way to track weekly progress',
      'Complete a trial run to test the plan',
      'Get feedback from someone experienced',
      'Adjust the plan based on week-1 results',
    ],
    epic: (t) => [
      'Draft a full roadmap with checkpoints for "' + t + '"',
      'Identify the 3 biggest risks and mitigation ideas',
      'Recruit support - a mentor, coach, or community',
      'Complete phase 1 and review lessons learned',
      'Complete phase 2 and reassess the timeline',
      'Plan the final push toward "' + t + '"',
    ],
  };
  function fakeGenerateSteps(goal) {
    const pool = (STEP_POOLS[goal.difficulty] || STEP_POOLS.medium)(goal.title);
    const n = goal.difficulty === 'epic' ? 5 : goal.difficulty === 'hard' ? 5 : goal.difficulty === 'easy' ? 3 : 4;
    const steps = pool.slice(0, Math.min(n, pool.length));
    return new Promise(resolve => setTimeout(() => resolve(steps), 900 + Math.round(Math.random()*400)));
  }

  const state = { goals: loadGoals(), showForm: false, openIds: new Set() };

  function mutate(fn) { fn(state); saveGoals(); render(); }

  function toggleObjective(goalId, objId) {
    mutate(s => {
      const g = s.goals.find(x => x.id === goalId); if (!g) return;
      const o = g.objectives.find(x => x.id === objId); if (!o) return;
      o.done = !o.done;
    });
  }
  function addStep(goalId, text) {
    const t = text.trim(); if (!t) return;
    mutate(s => {
      const g = s.goals.find(x => x.id === goalId); if (!g) return;
      g.objectives.push({id: newId('o'), text: t, done:false});
    });
  }
  function deleteStep(goalId, objId) {
    mutate(s => {
      const g = s.goals.find(x => x.id === goalId); if (!g) return;
      g.objectives = g.objectives.filter(o => o.id !== objId);
    });
  }
  function toggleOpen(goalId) {
    if (state.openIds.has(goalId)) state.openIds.delete(goalId); else state.openIds.add(goalId);
    render();
  }
  async function addGoal(g) {
    const pending = {...g, objectives: [], stepsStatus: 'generating'};
    state.goals = [pending, ...state.goals];
    state.showForm = false;
    state.openIds.add(g.id);
    saveGoals(); render();
    const steps = await fakeGenerateSteps(pending); // fixture only - no fetch() anywhere in this file
    const target = state.goals.find(x => x.id === g.id);
    if (target) {
      target.stepsStatus = 'done';
      target.objectives = steps.map(text => ({id: newId('o'), text, done:false}));
    }
    saveGoals(); render();
  }

  // ---- Rendering ----
  function goalBoxHtml(g) {
    const diff = DIFFICULTY[g.difficulty] || DIFFICULTY.medium;
    const color = GOAL_STATUS_COLOR[g.status] || '#9aa3ad';
    const overdue = g.status === 'active' && g.target_date != null && g.target_date < Date.now();
    const generating = g.stepsStatus === 'generating';
    const total = g.objectives.length;
    const done = g.objectives.filter(o => o.done).length;
    const ratio = total ? done / total : 0;
    const meterColor = overdue ? '#ff7b72' : color;
    let dateLine = '';
    if (g.status === 'completed') dateLine = 'completed ' + fmtAgeShort(g.completed_at);
    else if (g.status === 'active' && g.target_date != null) dateLine = (overdue ? 'was due ' : 'due ') + fmtRelDay(g.target_date);
    else if (g.target_date != null) dateLine = 'target ' + fmtRelDay(g.target_date);
    const open = state.openIds.has(g.id);

    const checklistHtml = generating
      ? '<div class="steps-generating"><span class="spin"></span>generating steps…</div>'
      : '<div class="goal-checklist">' +
          g.objectives.map(o => (
            '<div class="goal-obj' + (o.done ? ' done' : '') + '">' +
              '<label class="goal-obj-label" data-action="toggle-obj" data-goal="' + g.id + '" data-obj="' + o.id + '">' +
                '<input type="checkbox" ' + (o.done ? 'checked' : '') + ' tabindex="-1">' +
                '<span>' + esc(o.text) + '</span>' +
              '</label>' +
              '<button type="button" class="goal-obj-del" aria-label="Delete step" data-action="delete-step" data-goal="' + g.id + '" data-obj="' + o.id + '">×</button>' +
            '</div>'
          )).join('') +
          (total === 0 ? '<p class="muted" style="padding:6px 2px 0">No steps yet.</p>' : '') +
          '<form class="addstep" data-form="add-step" data-goal="' + g.id + '">' +
            '<input type="text" name="text" placeholder="+ add step" autocomplete="off">' +
            '<button type="submit">Add</button>' +
          '</form>' +
        '</div>';

    return (
      '<div class="goal-box">' +
        '<div class="goal-box-summary" data-action="toggle-goal" data-goal="' + g.id + '">' +
          '<div class="goal-box-head">' +
            '<p style="font-size:15px;font-weight:700;margin:0 0 2px">' + esc(g.title) + '</p>' +
            '<span class="pill" style="background:' + diff.color + '22;color:' + diff.color + ';border:1px solid ' + diff.color + '55">' + diff.label + '</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
            '<span class="badge"><span class="dot' + (g.status === 'active' ? ' pulse' : '') + '" style="background:' + color + '"></span><span style="color:' + color + '">' + g.status + '</span></span>' +
            '<span class="small">' + esc(g.category) + '</span>' +
            (dateLine ? '<span class="small">·</span><span class="small" style="color:' + (overdue ? '#ff7b72' : '#9aa3ad') + '">' + dateLine + '</span>' : '') +
          '</div>' +
          '<div class="meter"><div style="width:' + (ratio*100) + '%;background:' + meterColor + '"></div></div>' +
          '<div class="goal-obj-count">' + (generating ? 'generating steps…' : done + ' / ' + total + ' mini-objectives') + '</div>' +
        '</div>' +
        (open ? '<div class="goal-open"><div class="goal-desc">' + esc(g.description || '(no description)') + '</div>' + checklistHtml + '</div>' : '') +
      '</div>'
    );
  }

  function formHtml() {
    return (
      '<form class="card addform" data-form="new-goal">' +
        '<input type="text" name="title" placeholder="Goal title" autofocus autocomplete="off">' +
        '<div class="row2">' +
          '<input type="text" name="category" placeholder="Category (optional)" autocomplete="off">' +
          '<select name="difficulty">' +
            Object.keys(DIFFICULTY).map(k => '<option value="' + k + '"' + (k === 'medium' ? ' selected' : '') + '>' + DIFFICULTY[k].label + '</option>').join('') +
          '</select>' +
        '</div>' +
        '<input type="date" name="target_date">' +
        '<textarea name="description" rows="3" style="min-height:70px" placeholder="Description (optional)"></textarea>' +
        '<div class="row">' +
          '<button type="submit">Add goal</button>' +
          '<button type="button" class="secondary" data-action="cancel-form">Cancel</button>' +
        '</div>' +
      '</form>'
    );
  }

  function render() {
    const el = document.getElementById('goals');
    const goals = state.goals;
    let html = '';
    if (goals.length) {
      const doneCount = goals.reduce((n,g) => n + g.objectives.filter(o=>o.done).length, 0);
      html += '<div class="summary"><span><b>' + goals.length + '</b> goals</span><span><b>' + doneCount + '</b> objectives done</span></div>';
    }
    html += state.showForm ? formHtml() : '<button type="button" class="newgoalbtn" data-action="show-form">+ New goal</button>';
    if (!goals.length && !state.showForm) {
      html += '<p class="muted" style="padding:16px 2px">No goals yet - add your first.</p>';
    }
    if (goals.length) {
      html += '<div class="goal-path" style="margin-top:10px">';
      goals.forEach((g, i) => {
        html += '<div class="goal-row">' +
          '<div class="goal-connector">' +
            '<span class="goal-node-dot" style="color:' + (GOAL_STATUS_COLOR[g.status] || '#9aa3ad') + '"></span>' +
            (i < goals.length - 1 ? '<span class="goal-node-line"></span>' : '') +
          '</div>' +
          goalBoxHtml(g) +
        '</div>';
      });
      html += '</div>';
    }
    el.innerHTML = html;
  }

  // ---- Event delegation (attached once) ----
  const root = document.getElementById('goals');
  root.addEventListener('click', function (e) {
    const delBtn = e.target.closest('[data-action="delete-step"]');
    if (delBtn) { deleteStep(delBtn.dataset.goal, delBtn.dataset.obj); return; }
    const showBtn = e.target.closest('[data-action="show-form"]');
    if (showBtn) { state.showForm = true; render(); return; }
    const cancelBtn = e.target.closest('[data-action="cancel-form"]');
    if (cancelBtn) { state.showForm = false; render(); return; }
    const toggleBtn = e.target.closest('[data-action="toggle-goal"]');
    if (toggleBtn) { toggleOpen(toggleBtn.dataset.goal); return; }
  });
  root.addEventListener('change', function (e) {
    const label = e.target.closest('[data-action="toggle-obj"]');
    if (label) { toggleObjective(label.dataset.goal, label.dataset.obj); }
  });
  root.addEventListener('submit', function (e) {
    e.preventDefault();
    const newGoalForm = e.target.closest('[data-form="new-goal"]');
    if (newGoalForm) {
      const fd = new FormData(newGoalForm);
      const title = String(fd.get('title') || '').trim();
      if (!title) return;
      addGoal({
        id: newId('g'),
        title,
        category: String(fd.get('category') || '').trim() || 'General',
        difficulty: String(fd.get('difficulty') || 'medium'),
        status: 'active',
        description: String(fd.get('description') || '').trim(),
        created_at: Date.now(),
        target_date: parseDateInputToMs(String(fd.get('target_date') || '')),
        objectives: [],
      });
      return;
    }
    const addStepForm = e.target.closest('[data-form="add-step"]');
    if (addStepForm) {
      const input = addStepForm.querySelector('input[name="text"]');
      const text = input.value;
      if (text.trim()) { addStep(addStepForm.dataset.goal, text); input.value = ''; }
    }
  });

  render();
})();
</script>

</style>
<script type="application/json" id="alleah-pin-config">{"task_id": "ab12d09f-b338-43e5-8faf-622a3f505329", "revision": 0, "deploy_marker": "ab12d09f-r0-1785449508", "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "review_endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/request-review", "changelog": []}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
</body></html>
