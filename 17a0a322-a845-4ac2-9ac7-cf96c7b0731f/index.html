<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — header menu preview</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#3ecf8e;color:#08130d;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1a1d23;border:1px solid #2c313a;border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:#9aa3ad;margin-top:-4px;padding:0 6px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button:disabled{opacity:.5}
.muted{color:#9aa3ad;font-size:14px}
.err{color:#ff7b72;font-size:14px;padding:0 14px}
.typing{align-self:flex-start;color:#9aa3ad;font-size:14px;padding:0 6px}
#tasks,#goals{flex:1;overflow-y:auto;padding:8px 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.segbar{display:flex;gap:2px;margin:4px 0}
.seg{flex:1;height:8px;border-radius:2px;background:#2c313a}
.seg.on{background:#3ecf8e}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.task-full{white-space:pre-wrap;background:#12151a;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;max-height:320px;overflow-y:auto;font-size:14px}
.auth{padding:16px 14px}
.auth button{padding:12px 18px;margin-top:10px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:2px 2px 10px;color:#9aa3ad;font-size:12px}
.summary b{color:#e6e6e6}
.goal-desc{white-space:pre-wrap;background:#0f1115;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;font-size:13.5px;color:#c7ccd3}
.goal-path{display:flex;flex-direction:column}
.goal-row{display:flex;gap:10px}
.goal-connector{display:flex;flex-direction:column;align-items:center;width:18px;flex:none}
.goal-node-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:14px;box-shadow:0 0 0 3px #0f1115,0 0 0 4.5px currentColor}
.goal-node-line{width:2px;flex:1;min-height:22px;background:#2c313a;margin:4px 0}
.goal-box{flex:1;min-width:0;background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.goal-box-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-obj-count{font-size:12px;color:#9aa3ad}
.goal-checklist{margin-top:10px;padding-top:10px;border-top:1px solid #2c313a;display:flex;flex-direction:column;gap:2px}
.goal-obj{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.goal-obj input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#3ecf8e;cursor:pointer}
.goal-obj span{font-size:14px}
.goal-obj.done span{text-decoration:line-through;color:#9aa3ad}

/* ---- header menu ---- */
.menu-wrap{position:relative}
.menu-btn{width:46px;height:46px;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:12px;padding:0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu-btn:active{background:#2c313a}
.menu-btn[aria-expanded="true"]{background:#2c313a;border-color:#3ecf8e}
.menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:208px;background:#1a1d23;border:1px solid #2c313a;border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:30}
.menu-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9aa3ad;padding:10px 12px 6px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:transparent;color:#e6e6e6;border:0;border-radius:10px;padding:12px 12px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.menu-item:active{background:#2c313a}
.menu-item.active{background:#3ecf8e;color:#08130d;font-weight:700}
.menu-item.danger{color:#ff7b72}
.menu-sep{height:1px;background:#2c313a;margin:6px 6px}

.previewbar{background:#12151a;border-bottom:1px solid #2c313a;color:#9aa3ad;font-size:11.5px;text-align:center;padding:5px 10px}
</style></head><body>
<div class="previewbar">Preview build — header menu feature · synthetic demo data, no live backend</div>
<div id="root"></div>
<script>
(function(){
"use strict";
const h = (tag, opts, ...kids) => {
  const e = document.createElement(tag);
  opts = opts || {};
  for (const k in opts) {
    if (k === 'class') e.className = opts[k];
    else if (k === 'text') e.textContent = opts[k];
    else if (k === 'html') e.innerHTML = opts[k];
    else if (k === 'style') Object.assign(e.style, opts[k]);
    else if (k.startsWith('on') && typeof opts[k] === 'function') e.addEventListener(k.slice(2), opts[k]);
    else if (opts[k] !== undefined && opts[k] !== null && opts[k] !== false) e.setAttribute(k, opts[k] === true ? '' : opts[k]);
  }
  const append = (kid) => {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(append); return; }
    e.appendChild(kid.nodeType ? kid : document.createTextNode(kid));
  };
  kids.forEach(append);
  return e;
};

// ===== synthetic fixtures (no network, no auth) =====
const NOW = Date.now();
const MIN = 60000, DAY = 86400000;

let MESSAGES = [
  {role:'assistant', content:"Hi, I'm Alleah. Tell me things and I'll remember them for later — projects, preferences, people, whatever's useful."},
  {role:'user', content:"I'm training for a 10K in three weeks, long runs on Saturdays."},
  {role:'assistant', content:"Got it — logged the race timeline and your Saturday long-run habit. I'll bring it up if you ask about training or scheduling.", folders:[{n:1,title:'Fitness goals'}]},
  {role:'user', content:"Also remind me my sister's birthday is the 14th next month."},
  {role:'assistant', content:"Noted — sister's birthday on the 14th. Want me to nudge you a few days ahead when it gets close?", folders:[{n:2,title:'Family & dates'}]},
];

const REPLIES = [
  "Logged that. I'll fold it into whatever we're working on next.",
  "Got it — filed under memory, I'll surface it again when it's relevant.",
  "Noted. Anything else you want me to keep track of?",
  "Understood, I've got that saved.",
];

const TASKS = [
  {
    id:'t1', kind:'build', status:'running', instruction:'Build a compact weekly training log view with a mileage chart and a notes field per run.',
    steps_used:22, spend_usd:0.86, created_at: NOW - 6*MIN, progress:'writing the mileage chart component…',
  },
  {
    id:'t2', kind:'build', status:'done', instruction:'Add a header menu with Chat/Tasks links plus New chat and Sign out actions, mobile-first sizing.',
    steps_used:31, spend_usd:1.14, created_at: NOW - 3*DAY, completed_at: NOW - 3*DAY + 26*MIN,
    preview:{status:'ready', revision:2, preview_url:'https://example-preview.pages.dev/header-menu'},
    review:'audited staged commit: 9f2c7ab1230e4d1abc9\nverdict: clean\nfindings: none',
  },
  {
    id:'t3', kind:'research', status:'capped', instruction:'Summarize the tradeoffs between polling and websockets for the tasks tray refresh.',
    steps_used:25, spend_usd:0.50, created_at: NOW - 1*DAY - 4*60*MIN, completed_at: NOW - 1*DAY - 3*60*MIN,
    result:'Hit the research budget cap before finishing the comparison. Partial notes: polling is simpler and fits the current 5s interval; websockets would cut latency but add a persistent-connection dependency that this stack doesn\'t have yet.',
  },
  {
    id:'t4', kind:'revision', status:'failed', instruction:'Tighten the spend meter thresholds so amber kicks in earlier.',
    steps_used:9, spend_usd:0.22, created_at: NOW - 5*DAY, completed_at: NOW - 5*DAY + 4*MIN,
    error:'Task failed: could not locate the target constant to modify (renamed since last build).',
  },
  {
    id:'t5', kind:'build', status:'cancelled', instruction:'Prototype a calendar heatmap for goal streaks.',
    steps_used:4, spend_usd:0.06, created_at: NOW - 9*DAY, completed_at: NOW - 9*DAY + 2*MIN,
  },
];

const STATUS_COLOR = {queued:'#9aa3ad', running:'#3ecf8e', done:'#3ecf8e', capped:'#e0a458', failed:'#ff7b72', cancelled:'#5c636e'};

function fmtAge(ms) {
  const m = Math.floor((NOW - ms) / MIN);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}

// ===== Goals fixtures =====
// Restored rev-0 presentation (recovered from the original 2a9e67c9 build): goals
// render as boxes connected by a dot-and-line path, each expandable into a checklist
// of mini-objectives. Fixture-backed only - no network, no persistence beyond memory.
const DIFFICULTY = {
  easy:   {label:'Easy',   color:'#3ecf8e'},
  medium: {label:'Medium', color:'#58a6ff'},
  hard:   {label:'Hard',   color:'#e0a458'},
  epic:   {label:'Epic',   color:'#d68fff'},
};
const GOAL_STATUS_COLOR = {active:'#3ecf8e', completed:'#3ecf8e', paused:'#e0a458', abandoned:'#5c636e'};
let objSeq = 0;
function mkObj(text, done) { objSeq += 1; return {id:'o' + objSeq, text, done: !!done}; }

const GOALS = [
  {
    id:'g1', title:'Run a 10K', category:'Health', difficulty:'medium', status:'active',
    description:'Build up long-run mileage on the weekends and keep two easy runs during the week until race pace feels comfortable for the full distance.',
    created_at: NOW - 40*DAY, target_date: NOW + 21*DAY,
    objectives:[
      mkObj('Build base mileage to 15mi/week', true),
      mkObj('Add one tempo run per week', true),
      mkObj('Complete an 8-mile long run', true),
      mkObj('Taper and lock in race-week plan', false),
    ],
  },
  {
    id:'g2', title:'Ship personal portfolio site', category:'Career', difficulty:'hard', status:'active',
    description:'Rebuild the portfolio with three case studies, a proper writeup of the memory-graph project, and a fast static build — no framework bloat.',
    created_at: NOW - 18*DAY, target_date: NOW - 2*DAY,
    objectives:[
      mkObj('Draft case study: memory-graph project', true),
      mkObj('Draft case study: task runner', false),
      mkObj('Draft case study: preview pipeline', false),
      mkObj('Rebuild site without a framework', true),
      mkObj('Deploy to production domain', false),
    ],
  },
  {
    id:'g3', title:'Read 12 books this year', category:'Learning', difficulty:'easy', status:'active',
    description:'One book a month, mix of fiction and non-fiction. Currently on book 10.',
    created_at: NOW - 210*DAY, target_date: NOW + 55*DAY,
    objectives:[
      mkObj('Finish books 1 through 6', true),
      mkObj('Finish books 7 through 10', true),
      mkObj('Finish books 11 and 12', false),
    ],
  },
  {
    id:'g4', title:'Meditate daily for a month', category:'Health', difficulty:'easy', status:'completed',
    description:'Ten minutes every morning before checking the phone. Finished the full 30 days.',
    created_at: NOW - 70*DAY, target_date: NOW - 40*DAY, completed_at: NOW - 39*DAY,
    objectives:[
      mkObj('Establish a morning routine', true),
      mkObj('Complete week 1', true),
      mkObj('Complete weeks 2-3', true),
      mkObj('Complete week 4', true),
    ],
  },
  {
    id:'g5', title:'Train for a marathon', category:'Health', difficulty:'epic', status:'paused',
    description:'Paused after a minor knee strain — resuming once cleared by physio. Base mileage was going well before the break.',
    created_at: NOW - 65*DAY, target_date: NOW + 80*DAY,
    objectives:[
      mkObj('Base mileage to 20mi/week', true),
      mkObj('Build to 30mi/week', false),
      mkObj('Get physio clearance', false),
      mkObj('Register for race', false),
    ],
  },
];

function fmtRelDay(ms) {
  const days = Math.round((ms - NOW) / DAY);
  if (days === 0) return 'today';
  if (days > 0) return 'in ' + days + 'd';
  return Math.abs(days) + 'd ago';
}
function fmtAgeShort(ms) {
  const days = Math.round((NOW - ms) / DAY);
  if (days < 1) return 'today';
  if (days < 30) return days + 'd ago';
  if (days < 365) return Math.round(days/30) + 'mo ago';
  return Math.round(days/365) + 'y ago';
}

// ===== app state =====
const state = {
  signedIn: true,
  view: 'chat',
  menuOpen: false,
  messages: MESSAGES.slice(),
  text: '',
  busy: false,
  openTasks: {},
  goals: GOALS.map(g => ({...g, objectives: g.objectives.map(o => ({...o}))})),
  openGoals: {},
};

const root = document.getElementById('root');

function setState(patch) { Object.assign(state, patch); render(); }

// ===== header menu (the feature under preview) =====
// Single source of truth for the view links in the header menu. Add another
// {key,label} here later to introduce a new tab - the highlight logic already
// keys off this list, no other wiring needed.
const VIEWS = [
  {key:'chat', label:'Chat'},
  {key:'tasks', label:'Tasks'},
  {key:'goals', label:'Goals'},
];

function renderHeaderMenu() {
  const wrap = h('div', {class:'menu-wrap'});
  const btn = h('button', {
    type:'button', class:'menu-btn', 'aria-haspopup':'menu', 'aria-expanded': state.menuOpen ? 'true' : 'false',
    'aria-label': state.menuOpen ? 'Close menu' : 'Open menu',
    onclick: (e) => { e.stopPropagation(); setState({menuOpen: !state.menuOpen}); },
  }, '☰');
  wrap.appendChild(btn);
  if (state.menuOpen) {
    const dd = h('div', {class:'menu-dropdown', role:'menu'});
    dd.appendChild(h('div', {class:'menu-label'}, 'View'));
    VIEWS.forEach(v => {
      dd.appendChild(h('button', {
        type:'button', role:'menuitem',
        class:'menu-item' + (state.view === v.key ? ' active' : ''),
        'aria-current': state.view === v.key ? 'page' : undefined,
        onclick: (e) => { e.stopPropagation(); setState({view: v.key, menuOpen:false}); },
      }, v.label));
    });
    dd.appendChild(h('div', {class:'menu-sep'}));
    dd.appendChild(h('button', {
      type:'button', role:'menuitem', class:'menu-item',
      onclick: (e) => {
        e.stopPropagation();
        if (confirm('Clear this conversation? (Your memory folders are not affected.)')) {
          setState({messages:[], menuOpen:false});
        } else {
          setState({menuOpen:false});
        }
      },
    }, 'New chat'));
    dd.appendChild(h('button', {
      type:'button', role:'menuitem', class:'menu-item danger',
      onclick: (e) => { e.stopPropagation(); setState({menuOpen:false, signedIn:false}); },
    }, 'Sign out'));
    wrap.appendChild(dd);
  }
  return wrap;
}

document.addEventListener('mousedown', (e) => {
  if (state.menuOpen && !e.target.closest('.menu-wrap')) setState({menuOpen:false});
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.menuOpen) setState({menuOpen:false});
});

// ===== views =====
function renderAuth() {
  return h('div', {class:'auth'},
    h('h1', null, 'Alleah'),
    h('div', {style:{height:'12px'}}),
    h('p', {class:'muted'}, 'Signed out (preview). No real account system in this build.'),
    h('div', {class:'row', style:{display:'flex', gap:'8px', marginTop:'10px'}},
      h('button', {onclick: () => setState({signedIn:true, view:'chat'})}, 'Sign back in')));
}

function renderChat() {
  const frag = document.createDocumentFragment();
  const thread = h('div', {id:'thread'});
  if (state.messages.length === 0) {
    thread.appendChild(h('p', {class:'muted', style:{padding:'0 6px'}}, 'Talk to me. What you tell me about what you know gets remembered - automatically.'));
  }
  state.messages.forEach(m => {
    thread.appendChild(h('div', {class:'msg ' + m.role}, m.content));
    if (m.folders && m.folders.length) {
      thread.appendChild(h('div', {class:'cites'}, 'memory: ' + m.folders.map(f => '[' + f.n + '] ' + f.title).join('  ')));
    }
  });
  if (state.busy) thread.appendChild(h('div', {class:'typing'}, 'thinking...'));
  const endMarker = h('div');
  thread.appendChild(endMarker);
  frag.appendChild(thread);

  let sendBtn;
  const textarea = h('textarea', {
    placeholder:'Message Alleah...', rows:1,
    oninput: (e) => { state.text = e.target.value; if (sendBtn) sendBtn.disabled = state.busy || !state.text.trim(); },
    onkeydown: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },
  });
  textarea.value = state.text;
  sendBtn = h('button', {disabled: state.busy || !state.text.trim(), onclick: send}, 'Send');
  frag.appendChild(h('div', {class:'composer'}, textarea, sendBtn));

  requestAnimationFrame(() => { endMarker.scrollIntoView({behavior:'smooth'}); textarea.focus(); });
  return frag;

  function send() {
    const content = state.text.trim();
    if (!content || state.busy) return;
    state.messages = state.messages.concat([{role:'user', content}]);
    state.text = '';
    state.busy = true;
    render();
    setTimeout(() => {
      const reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];
      state.messages = state.messages.concat([{role:'assistant', content: reply}]);
      state.busy = false;
      render();
    }, 700);
  }
}

function renderTaskCard(t) {
  const active = t.status === 'queued' || t.status === 'running';
  const CAP = (t.kind === 'build' || t.kind === 'revision') ? {steps:50, spend:2.00, min:30} : {steps:25, spend:0.50, min:15};
  const steps = Math.min(t.steps_used || 0, CAP.steps);
  const spend = Math.min(Number(t.spend_usd) || 0, CAP.spend);
  const spendRatio = spend / CAP.spend;
  const endMs = t.completed_at || NOW;
  const elapsedMs = Math.max(0, Math.min(endMs - t.created_at, CAP.min * MIN));
  const elapsed = Math.floor(elapsedMs/MIN) + 'm ' + Math.floor((elapsedMs%MIN)/1000) + 's';
  const spendColor = spendRatio < 0.5 ? '#3ecf8e' : spendRatio < 0.8 ? '#e0a458' : '#ff7b72';
  const color = STATUS_COLOR[t.status] || '#9aa3ad';
  const open = !!state.openTasks[t.id];
  const pv = t.preview;
  const rvw = t.review;
  const sha = rvw ? (/audited staged commit: ([0-9a-f]{7,40})/i.exec(rvw) || [])[1] : null;
  const saysClean = rvw ? /verdict:\s*clean|findings:\s*(none|0)/i.test(rvw) : false;
  const clean = !!sha && saysClean;

  const label = t.kind === 'review' ? 'audit of build ' + (t.instruction || '').trim().slice(0,8) : (t.instruction || '');
  const shownLabel = open ? label : (label.length > 110 ? label.slice(0,110) + '...' : label);

  const card = h('div', {class:'card'});
  const top = h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center', gap:'8px'}},
    h('span', {class:'badge'},
      h('span', {class:'dot' + (t.status==='running' ? ' pulse' : ''), style:{background:color}}),
      h('span', {style:{color:color}}, (t.kind && t.kind !== 'research' ? t.kind + ' · ' : '') + t.status)),
    h('span', {class:'small'}, fmtAge(t.created_at)));
  if (active) {
    top.appendChild(h('button', {class:'secondary', style:{marginTop:'0', padding:'4px 10px', fontSize:'12px'},
      onclick: () => alert('Preview only — cancelling is disabled in this demo.')}, 'Cancel'));
  }
  card.appendChild(top);

  if (pv) {
    const safeUrl = /^https:\/\//.test(pv.preview_url || '');
    const line = h('p', {class:'small', style:{margin:'6px 0 0'}});
    line.appendChild(safeUrl ? h('a', {href:pv.preview_url, target:'_blank', rel:'noopener', style:{color:'#3ecf8e'}}, 'Preview ↗') : h('span', {style:{color:'#9aa3ad'}}, 'preview url missing'));
    line.appendChild(document.createTextNode('  rev ' + pv.revision + ' · ' + pv.status));
    if (rvw) {
      line.appendChild(clean
        ? h('span', {style:{color:'#3ecf8e'}}, '  ·  review: clean ✓  sha ' + sha.slice(0,12) + '…')
        : h('span', {style:{color:'#9aa3ad'}}, '  ·  review done - ask Alleah for the verdict'));
    }
    card.appendChild(line);
  }

  card.appendChild(h('p', {style:{margin:'8px 0 4px', cursor:'pointer'}, onclick: () => { state.openTasks[t.id] = !open; render(); }}, shownLabel));

  if (t.status === 'running' && t.progress) card.appendChild(h('p', {class:'small', style:{color:'#e6e6e6'}}, '▸ ' + t.progress));

  if (active) {
    const seg = h('div', {class:'segbar'});
    for (let i=0;i<CAP.steps;i++) seg.appendChild(h('span', {class:'seg' + (i < steps ? ' on' : '')}));
    card.appendChild(h('div', {class:'small'}, 'steps used: ' + steps + ' / ' + CAP.steps));
    card.appendChild(seg);
    card.appendChild(h('div', {class:'small'}, 'spend: $' + spend.toFixed(2) + ' / $' + CAP.spend.toFixed(2) + ' cap'));
    card.appendChild(h('div', {class:'meter'}, h('div', {style:{width:(spendRatio*100)+'%', background:spendColor}})));
    card.appendChild(h('div', {class:'small'}, 'time since queued: ' + elapsed + ' / ' + CAP.min + 'm limit'));
    card.appendChild(h('div', {class:'meter'}, h('div', {style:{width:(elapsedMs/(CAP.min*MIN)*100)+'%', background:'#3ecf8e'}})));
  }

  if (open) {
    if (t.result) card.appendChild(h('div', {class:'task-full'}, t.result));

      (t.completed_at ? ' · finished ' + new Date(t.completed_at).toLocaleString() : '')));
  }
  return card;
}

function renderTasks() {
  const wrap = h('div', {id:'tasks'});
  TASKS.forEach(t => wrap.appendChild(renderTaskCard(t)));
  return wrap;
}

function toggleObjective(goalId, objId) {
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  const o = g.objectives.find(x => x.id === objId);
  if (!o) return;
  o.done = !o.done;
  render();
}

function renderGoalBox(g) {
  const diff = DIFFICULTY[g.difficulty];
  const color = GOAL_STATUS_COLOR[g.status];
  const overdue = g.status === 'active' && g.target_date < NOW;
  const total = g.objectives.length;
  const done = g.objectives.filter(o => o.done).length;
  const ratio = total ? done / total : 0;
  const meterColor = overdue ? '#ff7b72' : color;
  let dateLine;
  if (g.status === 'completed') dateLine = 'completed ' + fmtAgeShort(g.completed_at);
  else if (g.status === 'active') dateLine = (overdue ? 'was due ' : 'due ') + fmtRelDay(g.target_date);
  else dateLine = 'target ' + fmtRelDay(g.target_date);
  const open = !!state.openGoals[g.id];

  const box = h('div', {class:'goal-box', onclick: () => { state.openGoals[g.id] = !open; render(); }});
  box.appendChild(h('div', {class:'goal-box-head'},
    h('p', {style:{fontSize:'15px', fontWeight:'700', margin:'0 0 2px'}}, g.title),
    h('span', {class:'pill', style:{background:diff.color+'22', color:diff.color, border:'1px solid '+diff.color+'55'}}, diff.label)));
  box.appendChild(h('div', {style:{display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap'}},
    h('span', {class:'badge'},
      h('span', {class:'dot' + (g.status==='active' ? ' pulse' : ''), style:{background:color}}),
      h('span', {style:{color:color}}, g.status)),
    h('span', {class:'small'}, g.category),
    h('span', {class:'small'}, '·'),
    h('span', {class:'small', style:{color: overdue ? '#ff7b72' : '#9aa3ad'}}, dateLine)));
  box.appendChild(h('div', {class:'meter'}, h('div', {style:{width:(ratio*100)+'%', background:meterColor}})));
  box.appendChild(h('div', {class:'goal-obj-count'}, done + ' / ' + total + ' mini-objectives'));
  if (open) {
    box.appendChild(h('div', {class:'goal-desc'}, g.description));
    const list = h('div', {class:'goal-checklist'});
    g.objectives.forEach(o => {
      const row = h('label', {class:'goal-obj' + (o.done ? ' done' : ''), onclick: (e) => e.stopPropagation()},
        h('input', {type:'checkbox', checked: o.done, onchange: () => toggleObjective(g.id, o.id)}),
        h('span', null, o.text));
      list.appendChild(row);
    });
    box.appendChild(list);
  }
  return box;
}

function renderGoals() {
  const wrap = h('div', {id:'goals'});
  const doneCount = state.goals.reduce((n,g) => n + g.objectives.filter(o=>o.done).length, 0);
  wrap.appendChild(h('div', {class:'summary'},
    h('span', null, h('b', null, String(state.goals.length)), ' goals'),
    h('span', null, h('b', null, String(doneCount)), ' objectives done')));
  const path = h('div', {class:'goal-path'});
  state.goals.forEach((g, i) => {
    const row = h('div', {class:'goal-row'});
    const connector = h('div', {class:'goal-connector'},
      h('span', {class:'goal-node-dot', style:{color: GOAL_STATUS_COLOR[g.status]}}));
    if (i < state.goals.length - 1) connector.appendChild(h('span', {class:'goal-node-line'}));
    row.appendChild(connector);
    row.appendChild(renderGoalBox(g));
    path.appendChild(row);
  });
  wrap.appendChild(path);
  return wrap;
}

// ===== root render =====
function render() {
  root.innerHTML = '';
  if (!state.signedIn) { root.appendChild(renderAuth()); return; }

  const header = h('header', null,
    h('h1', null, 'Alleah'),
    renderHeaderMenu());
  root.appendChild(header);

  if (state.view === 'tasks') root.appendChild(renderTasks());
  else if (state.view === 'goals') root.appendChild(renderGoals());
  else root.appendChild(renderChat());
}

render();
})();
</script>

   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to

    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
