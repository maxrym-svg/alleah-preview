<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — Domain-Scoped Research (Preview)</title>
<meta name="theme-color" content="#121212">
<style>
:root{
  color-scheme:dark;
  --bg:#121212; --surface:#1c1c1e; --surface-2:#242427; --border:#3a3a3d;
  --text-primary:#f2f2f3; --text-secondary:#b7bac0;
  --accent:#3ddb96; --accent-contrast:#06120c;
  --danger:#ff9086; --warning:#e7b567; --info:#7db8ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100dvh;max-width:680px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px;gap:8px;flex:none}
h1{font-size:18px;margin:0}
.badge-tag{font-size:11px;font-weight:700;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg-row{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px}
.msg-row.user{align-self:flex-end;align-items:flex-end}
.msg-row.assistant{align-self:flex-start;align-items:flex-start}
.msg-row-meta{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--text-secondary);padding:0 2px}
.msg-row-name{font-weight:700;color:var(--text-primary)}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--accent);color:var(--accent-contrast);border-bottom-right-radius:4px}
.msg.assistant{background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg a{color:inherit;text-decoration:underline}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 14px calc(14px + env(safe-area-inset-bottom));position:relative;flex:none}
.composer button{min-height:44px;min-width:44px}
.attach-btn,.scope-btn{width:44px;height:44px;min-width:44px;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border);border-radius:14px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.attach-btn:active,.scope-btn:active{background:var(--surface)}
textarea{flex:1;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:min(40dvh,320px);overflow-y:auto;line-height:1.4}
button{background:var(--accent);color:var(--accent-contrast);border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:var(--surface-2);color:var(--text-primary);font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border)}
button:disabled{opacity:.5}
input{width:100%;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:10px;padding:12px;font:inherit}
.muted{color:var(--text-secondary);font-size:14px}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.small{font-size:12px;color:var(--text-secondary);margin:2px 0}
.history-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.history-sheet{position:fixed;left:0;right:0;bottom:0;max-height:80dvh;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -12px 40px rgba(0,0,0,.5);z-index:41;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 2px;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;flex:none}
.sheet-head h2{font-size:16px;margin:0}
.sheet-body{overflow-y:auto;padding:4px 16px 16px}
.menu-btn{width:40px;height:40px;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:12px;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.scope-preview{white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px;color:var(--text-primary);max-height:220px;overflow-y:auto}
.scope-note{font-size:12px;color:var(--text-secondary);margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.scope-drafts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.scope-draft-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12.5px}
.callout{font-size:12px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:0 14px 8px}
</style></head>
<body>
<div id="root"></div>
<script>
// ============================================================================
// STATIC PREVIEW — Domain-Scoped Research (fixed per audit)
// No network calls anywhere in this file. No Supabase client, no keys, no
// auth. All "chat" content and task drafts below are synthetic fixtures
// held in memory / localStorage for this preview only.
//
// Fix #1 (live wiring): the domain-scope tool here is NOT wired into any
// send/runSend path and never touches a /functions/v1/ask-style endpoint.
// It only builds preview text and shows it in a read-only review panel.
//
// Fix #2 (trigger scope): the ONLY way to open the research-scope panel is
// the explicit 🔎 button in the composer. There is no scanning of message
// text for URLs anywhere below — the fixture thread below deliberately
// includes an ordinary message containing a link to demonstrate it is
// never intercepted or blocked.
//
// Fix #3 (no half-implemented contract): there is no "DOMAIN SCOPE
// DIRECTIVE" block appended to any outgoing payload, and no server-side
// piece is implied or required for this preview to be complete.
// ============================================================================

const root = document.getElementById('root');

const FIXTURE_MESSAGES = [
  {role:'user', name:'You', time:'9:41 AM', text:"Morning! Reminder I filed the invoice under project Aster."},
  {role:'assistant', name:'Alleah', time:'9:41 AM', text:"Got it, filed. From your memory: Aster is the Q3 client project [1]."},
  {role:'user', name:'You', time:'9:44 AM', text:"Here's the doc I was talking about: https://example.com/specs/aster-v2 — nothing special, just background."},
  {role:'assistant', name:'Alleah', time:'9:44 AM', text:"Noted the link as context — that's an ordinary chat turn, so nothing about it was intercepted or blocked. You haven't filed anything else on it, but generally, specs docs like that are worth a skim before a kickoff call."},
];

let draftRequests = [];
try { draftRequests = JSON.parse(localStorage.getItem('preview_research_drafts_v1')) || []; } catch(e) { draftRequests = []; }

function saveDrafts() {
  try { localStorage.setItem('preview_research_drafts_v1', JSON.stringify(draftRequests.slice(0, 30))); } catch(e) {}
}

function linkify(text) {
  const parts = text.split(/(https?:\/\/[^\s]+)/g);
  return parts.map(p => /^https?:\/\//.test(p) ? '<a href="' + p + '" target="_blank" rel="noopener">' + p + '</a>' : escapeHtml(p)).join('');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildDomainScopeInstruction(topic, domain) {
  const t = topic.trim();
  const d = domain.trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
  return [
    'Research request: ' + t,
    '',
    'Scope note (for you to include if you ask Alleah to queue this): keep the',
    'investigation limited to sources under "' + d + '" where possible, and say',
    'plainly if that domain doesn\u2019t have enough to answer from.',
    '',
    'This is a draft for review only — nothing has been sent or queued. Copy the',
    'text above into chat and ask Alleah to queue it as a research task if you',
    'want to proceed.',
  ].join('\n');
}

function render() {
  root.innerHTML = '';

  const header = document.createElement('header');
  header.innerHTML = '<h1>Alleah</h1><span class="badge-tag">Preview · Chat</span>';
  root.appendChild(header);

  const callout = document.createElement('div');
  callout.className = 'callout';
  callout.textContent = '🔎 Domain-scoped research is a preview-only composer tool. It never sends anything and never inspects your messages for links — try the "specs" link above, it flows through untouched.';
  root.appendChild(callout);

  const thread = document.createElement('div');
  thread.id = 'thread';
  FIXTURE_MESSAGES.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg-row ' + m.role;
    row.innerHTML = '<div class="msg-row-meta"><span class="msg-row-name">' + m.name + '</span><span>' + m.time + '</span></div>' +
      '<div class="msg ' + m.role + '">' + linkify(m.text) + '</div>';
    thread.appendChild(row);
  });
  root.appendChild(thread);

  const composer = document.createElement('div');
  composer.className = 'composer';
  composer.innerHTML =
    '<button type="button" class="attach-btn" aria-label="Attach file">📎</button>' +
    '<button type="button" class="scope-btn" id="scopeBtn" aria-label="New domain-scoped research request">🔎</button>' +
    '<textarea placeholder="Message Alleah..." rows="1" disabled></textarea>' +
    '<button type="button" disabled>Send</button>';
  root.appendChild(composer);

  document.getElementById('scopeBtn').addEventListener('click', openScopeSheet);
}

function openScopeSheet() {
  const backdrop = document.createElement('div');
  backdrop.className = 'history-backdrop';
  backdrop.addEventListener('click', closeScopeSheet);

  const sheet = document.createElement('div');
  sheet.className = 'history-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.setAttribute('aria-label', 'New domain-scoped research request');
  sheet.id = 'scopeSheet';

  sheet.innerHTML = [
    '<div class="sheet-handle"></div>',
    '<div class="sheet-head"><h2>Scope a research request</h2>',
    '<button type="button" class="menu-btn" id="scopeCloseBtn" aria-label="Close">✕</button></div>',
    '<div class="sheet-body">',
    '<p class="small" style="margin:0 0 10px">Draft wording for a research task that stays scoped to one domain. This only builds preview text — it isn\u2019t sent anywhere. Nothing here reads your chat messages.</p>',
    '<form class="addform" id="scopeForm">',
    '<input placeholder="Topic, e.g. &quot;pricing tiers&quot;" id="scopeTopic">',
    '<input placeholder="Domain to scope to, e.g. docs.stripe.com" id="scopeDomain">',
    '<div class="row"><button type="submit" id="scopeGenBtn" disabled>Generate preview</button></div>',
    '</form>',
    '<div id="scopeResult"></div>',
    '<div id="scopeDraftsWrap"></div>',
    '</div>',
  ].join('');

  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);

  const topicInput = sheet.querySelector('#scopeTopic');
  const domainInput = sheet.querySelector('#scopeDomain');
  const genBtn = sheet.querySelector('#scopeGenBtn');
  function syncGenBtn() { genBtn.disabled = !topicInput.value.trim() || !domainInput.value.trim(); }
  topicInput.addEventListener('input', syncGenBtn);
  domainInput.addEventListener('input', syncGenBtn);

  sheet.querySelector('#scopeCloseBtn').addEventListener('click', closeScopeSheet);
  sheet.querySelector('#scopeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (genBtn.disabled) return;
    const preview = buildDomainScopeInstruction(topicInput.value, domainInput.value);
    renderScopeResult(sheet, preview, topicInput.value.trim(), domainInput.value.trim());
  });

  renderDraftList(sheet);
}

function renderScopeResult(sheet, preview, topic, domain) {
  const wrap = sheet.querySelector('#scopeResult');
  wrap.innerHTML =
    '<div class="scope-preview" id="scopePreviewText"></div>' +
    '<div class="row" style="margin-top:8px">' +
    '<button type="button" class="secondary" id="scopeCopyBtn">Copy text</button>' +
    '<button type="button" class="secondary" id="scopeSaveBtn">Save draft</button>' +
    '</div>' +
    '<div class="scope-note">Preview only — nothing was queued or sent. Paste this into chat yourself and ask Alleah to queue it if you want it to become a real task.</div>';
  wrap.querySelector('#scopePreviewText').textContent = preview;
  wrap.querySelector('#scopeCopyBtn').addEventListener('click', function() {
    const btn = this;
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(preview) : Promise.reject())
      .then(() => { btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = 'Copy text', 2000); })
      .catch(() => {});
  });
  wrap.querySelector('#scopeSaveBtn').addEventListener('click', function() {
    draftRequests.unshift({id:'rd'+Date.now().toString(36), topic, domain, text: preview, ts: Date.now()});
    saveDrafts();
    wrap.innerHTML = '';
    sheet.querySelector('#scopeTopic').value = '';
    sheet.querySelector('#scopeDomain').value = '';
    sheet.querySelector('#scopeGenBtn').disabled = true;
    renderDraftList(sheet);
  });
}

function renderDraftList(sheet) {
  const draftsWrap = sheet.querySelector('#scopeDraftsWrap');
  if (!draftRequests.length) { draftsWrap.innerHTML = ''; return; }
  draftsWrap.innerHTML = '<p class="small" style="margin:10px 0 0;font-weight:700;color:var(--text-primary)">Saved drafts</p>' +
    '<div class="scope-drafts">' + draftRequests.map(d =>
      '<div class="scope-draft-item"><div><b>' + escapeHtml(d.topic) + '</b> \u2192 ' + escapeHtml(d.domain) + '</div>' +
      '<div class="small">' + new Date(d.ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + '</div></div>'
    ).join('') + '</div>';
}

function closeScopeSheet() {
  const sheet = document.getElementById('scopeSheet');
  if (sheet) sheet.remove();
  document.querySelectorAll('.history-backdrop').forEach(el => el.remove());
}

render();
</script>

<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
</body></html>
