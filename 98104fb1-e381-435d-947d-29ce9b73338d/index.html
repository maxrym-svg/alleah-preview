/* ===== Design tokens (mirrors live app) ===== */
:root{
  color-scheme:dark;
  --bg:#121212;
  --surface:#1c1c1e;
  --surface-2:#242427;
  --border:#3a3a3d;
  --text-primary:#f2f2f3;
  --text-secondary:#b7bac0;
  --accent:#3ddb96;
  --accent-contrast:#06120c;
  --danger:#ff9086;
  --danger-contrast:#2b0705;
  --warning:#e7b567;
  --focus-ring:#7db8ff;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f6f7;
  --surface:#ffffff;
  --surface-2:#edeef0;
  --border:#d6d8db;
  --text-primary:#17181a;
  --text-secondary:#53565c;
  --accent:#0e7a4a;
  --accent-contrast:#ffffff;
  --danger:#b3261e;
  --danger-contrast:#ffffff;
  --warning:#8a5a00;
  --focus-ring:#0b5fb8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
.banner{margin:6px 14px 0;padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);font-size:12px}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:2px}

/* ---- original bubble styling (unchanged) ---- */
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-contrast);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:var(--text-secondary);margin-top:-4px;padding:0 6px}
.typing{align-self:flex-start;color:var(--text-secondary);font-size:14px;padding:0 6px}

/* ---- NEW "message rows" feature ----
   .msg-row wraps each turn (sender label + timestamp + bubble).
   Spec requires consistent 16px padding on all sides for the row
   container itself (a prior audit flagged this being inconsistent
   per-side on the first pass) - fixed below via a single shorthand
   declaration so all four sides stay locked together. */
.msg-row{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px}
.msg-row.user{align-items:flex-end}
.msg-row.assistant{align-items:flex-start}
.msg-row-meta{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--text-secondary);padding:0 2px}
.msg-row-name{font-weight:700;color:var(--text-primary)}
.msg-row-time{color:var(--text-secondary)}

.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:var(--accent);color:var(--accent-contrast);border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:var(--surface-2);color:var(--text-primary);font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border)}
button.stop-btn{background:var(--danger);color:var(--danger-contrast)}
button:disabled{opacity:.5}
.muted{color:var(--text-secondary);font-size:14px}
.menu-btn{width:40px;height:40px;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:12px;padding:0;font-size:16px;cursor:pointer}
.think-row{display:inline-flex;align-items:center;gap:8px}
.think-label{font-size:13px;color:var(--text-secondary)}
.think-dots{display:inline-flex;gap:5px;padding:4px 2px;align-items:center}
.think-dot{font-size:16px;line-height:1;color:var(--text-secondary);animation:think-bounce 1.1s infinite ease-in-out}
.think-dot:nth-child(2){animation-delay:.15s}
.think-dot:nth-child(3){animation-delay:.3s}
@keyframes think-bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

<div id="root"></div>
<script>
/* ============================================================
   Self-contained static preview - no network calls, no auth,
   no Supabase. All data below is synthetic demo fixture data.
   ============================================================ */
const root = document.getElementById('root');

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'className') node.className = props[k];
    else if (k === 'style' && typeof props[k] === 'object') Object.assign(node.style, props[k]);
    else if (k.startsWith('on') && typeof props[k] === 'function') node.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if (props[k] !== undefined && props[k] !== null) node.setAttribute(k, props[k]);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

// ---- synthetic fixture history (generic, non-real demo data) ----
const now = Date.now();
const FIXTURES = [
  {role:'user', content:'What did I tell you about the Meridian project deadline?', ts: now - 42*60000},
  {role:'assistant', content:'You mentioned the Meridian project is targeting a soft launch on the 14th, with final QA wrapping the week before.', ts: now - 41*60000,
    folders:[{n:1, title:'Work / Meridian'}]},
  {role:'user', content:'Nice. Remind me what my goals for this quarter were.', ts: now - 18*60000},
  {role:'assistant', content:'Three active goals: ship the Meridian launch, run 3x a week through the quarter, and finish the budgeting spreadsheet overhaul.', ts: now - 17*60000,
    folders:[{n:2, title:'Goals / Q3'}]},
  {role:'user', content:'Perfect, thanks for keeping track.', ts: now - 6*60000},
  {role:'assistant', content:'Anytime. Let me know if anything about those changes and I\u2019ll update the memory folders.', ts: now - 5*60000},
];

let messages = FIXTURES.slice();
let pending = null; // {phase:'thinking'|'streaming', revealed, fullAnswer}
let theme = 'dark';

const CANNED_REPLIES = [
  'Got it \u2014 noted and filed under the right memory folder.',
  'Sounds good. I\u2019ll keep that in mind for next time it\u2019s relevant.',
  'Makes sense \u2014 thanks for the update, I\u2019ve saved that detail.',
  'Understood. Anything else you want me to remember about that?'
];

function renderMessageRow(m) {
  const bubble = el('div', {className:'msg ' + m.role}, m.content);
  const row = el('div', {className:'msg-row ' + m.role},
    el('div', {className:'msg-row-meta'},
      el('span', {className:'msg-row-name'}, m.role === 'user' ? 'You' : 'Alleah'),
      m.ts ? el('span', {className:'msg-row-time'}, formatTime(m.ts)) : null),
    bubble);
  const frag = document.createDocumentFragment();
  frag.appendChild(row);
  if (m.folders && m.folders.length) {
    frag.appendChild(el('div', {className:'cites'}, 'memory: ' + m.folders.map(f => '[' + f.n + '] ' + f.title).join('  ')));
  }
  return frag;
}

function renderPendingRow(p) {
  const inner = p.phase === 'thinking'
    ? el('div', {className:'think-row', role:'status', 'aria-live':'polite', 'aria-label':'Alleah is thinking'},
        el('span', {className:'think-label'}, 'Thinking'),
        el('span', {className:'think-dots'},
          el('span', {className:'think-dot'}, '\u2022'),
          el('span', {className:'think-dot'}, '\u2022'),
          el('span', {className:'think-dot'}, '\u2022')))
    : el('span', null, p.revealed);
  const bubble = el('div', {className:'msg assistant'}, inner);
  return el('div', {className:'msg-row assistant'},
    el('div', {className:'msg-row-meta'}, el('span', {className:'msg-row-name'}, 'Alleah')),
    bubble);
}

function render() {
  root.innerHTML = '';
  const header = el('header', null,
    el('h1', null, 'Alleah'),
    el('div', {style:{display:'flex', gap:'8px'}},
      el('button', {className:'menu-btn', title:'Toggle theme', onClick:toggleTheme}, theme === 'light' ? '\u2600\ufe0f' : '\ud83c\udf19'),
      el('button', {className:'menu-btn', title:'New chat', onClick:resetChat}, '+')));
  root.appendChild(header);
  root.appendChild(el('div', {className:'banner'}, 'Preview: chat message rows \u2014 each turn now shows a sender + time row above the bubble, with consistent 16px padding on all sides.'));

  const thread = el('div', {id:'thread'});
  messages.forEach(m => thread.appendChild(renderMessageRow(m)));
  if (pending) thread.appendChild(renderPendingRow(pending));
  root.appendChild(thread);
  thread.scrollTop = thread.scrollHeight;

  const textarea = el('textarea', {placeholder:'Message Alleah...', rows:1});
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(textarea.value); }
  });
  const sendBtn = pending
    ? el('button', {className:'stop-btn', type:'button', onClick:stop}, 'Stop')
    : el('button', {type:'button', onClick:() => send(textarea.value)}, 'Send');
  root.appendChild(el('div', {className:'composer'}, textarea, sendBtn));
  if (!pending) textarea.focus();
}

let thinkTimer = null, streamTimer = null;

function send(text) {
  const content = (text || '').trim();
  if (!content || pending) return;
  messages.push({role:'user', content, ts: Date.now()});
  pending = {phase:'thinking', revealed:''};
  render();
  thinkTimer = setTimeout(() => {
    const full = CANNED_REPLIES[Math.floor(Math.random() * CANNED_REPLIES.length)];
    pending = {phase:'streaming', revealed:'', fullAnswer: full};
    render();
    let i = 0;
    streamTimer = setInterval(() => {
      i = Math.min(i + 3, pending.fullAnswer.length);
      pending.revealed = pending.fullAnswer.slice(0, i);
      if (i >= pending.fullAnswer.length) {
        clearInterval(streamTimer); streamTimer = null;
        messages.push({role:'assistant', content: pending.fullAnswer, ts: Date.now()});
        pending = null;
      }
      render();
    }, 18);
  }, 450);
}

function stop() {
  if (thinkTimer) { clearTimeout(thinkTimer); thinkTimer = null; }
  if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
  pending = null;
  render();
}

function resetChat() {
  if (pending) return;
  messages = FIXTURES.slice();
  render();
}

function toggleTheme() {
  theme = theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  render();
}

render();
</script>

<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);

  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;

  function positionMarker(m, pin) {

    m.style.display = "";

    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);

  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";

    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";

    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();

      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {

      if (idx >= 0) {

        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;

      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
</body></html>
