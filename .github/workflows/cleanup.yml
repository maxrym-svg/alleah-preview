name: Cleanup stale previews
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete task folders idle over 7 days (git history only - no DB creds by design)
        run: |
          set -e
          changed=0
          for d in */ ; do
            d="${d%/}"
            [ "$d" = ".github" ] && continue
            [ "$d" = "staged" ] && continue
            last=$(git log -1 --format=%ct -- "$d" 2>/dev/null || echo 0)
            [ -z "$last" ] && last=0
            now=$(date +%s)
            age=$(( (now - last) / 86400 ))
            if [ "$age" -gt 7 ]; then
              git rm -rq "$d" || true
              [ -d "staged/$d" ] && git rm -rq "staged/$d" || true
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git config user.name "preview-cleanup"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "cleanup: remove previews idle over 7 days"
            git push
          fi
