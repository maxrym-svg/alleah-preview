<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}

button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button:disabled{opacity:.5}
input,select,textarea{width:100%;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:10px;padding:12px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#9aa3ad;font-size:14px}

.meter>div{height:100%;border-radius:4px;transition:width .3s}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:2px 2px 10px;color:#9aa3ad;font-size:12px}
.summary b{color:#e6e6e6}
.goal-desc{white-space:pre-wrap;background:#0f1115;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;font-size:13.5px;color:#c7ccd3}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.addform .row2{display:flex;gap:8px}
.addform .row2>*{flex:1}

.goal-row{display:flex;gap:10px}
.goal-connector{display:flex;flex-direction:column;align-items:center;width:18px;flex:none}
.goal-node-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:14px;box-shadow:0 0 0 3px #0f1115,0 0 0 4.5px currentColor}
.goal-node-line{width:2px;flex:1;min-height:22px;background:#2c313a;margin:4px 0}
.goal-box{flex:1;min-width:0;background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.goal-box-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-obj-count{font-size:12px;color:#9aa3ad}
.goal-checklist{margin-top:10px;padding-top:10px;border-top:1px solid #2c313a;display:flex;flex-direction:column;gap:2px}
.goal-obj{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.goal-obj input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#3ecf8e;cursor:pointer}
.goal-obj span{font-size:14px}
.goal-obj.done span{text-decoration:line-through;color:#9aa3ad}
.genbtn{width:100%;margin-top:10px;background:#1a1d23;color:#3ecf8e;border:1px solid #2c313a;font-size:13px;font-weight:600;padding:10px;border-radius:10px}
.genbtn:disabled{color:#9aa3ad}
.genrow{display:flex;align-items:center;gap:8px;justify-content:center}
.genspinner{width:12px;height:12px;border-radius:50%;border:2px solid #2c313a;border-top-color:#3ecf8e;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.previewbanner{background:#1a1d23;border-bottom:1px solid #2c313a;color:#9aa3ad;font-size:11px;padding:6px 14px;text-align:center}
</style></head><body>
<div class="previewbanner">STATIC PREVIEW — synthetic demo data only · no live network calls</div>
<div id="root"></div>
<script>
"use strict";
// ============================================================================
// Alleah — Goals tab preview: "auto-generate mini-objectives" feature.
// Self-contained static bundle. Vanilla JS + DOM (no React/CDN — nothing here
// depends on any network resource). All data is synthetic and localStorage-only.
//
// Fix applied for this revision (High severity / Fidelity-Secrets audit finding):
// generateObjectives() previously fired a real network request. It now NEVER
// calls fetch/XHR/websocket/any remote endpoint. It resolves a hardcoded fixture
// object (FIXTURE_OBJECTIVES_BY_GOAL, built at load time from local templates —
// see buildFixtureObjectives()) after a short simulated delay purely for UX
// feel (setTimeout, no I/O). See generateObjectives() below for the full path.
// ============================================================================

const GOALS_KEY = "alleah_goals_preview_v1";

const DIFFICULTY = {
  easy:   {label: 'Easy',   color: '#3ecf8e'},
  medium: {label: 'Medium', color: '#58a6ff'},
  hard:   {label: 'Hard',   color: '#e0a458'},
  epic:   {label: 'Epic',   color: '#d68fff'},
};
const GOAL_STATUS_COLOR = {active:'#3ecf8e', completed:'#3ecf8e', paused:'#e0a458', abandoned:'#5c636e'};
const GOALS_DAY = 86400000;

function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---- Synthetic seed fixtures (generic/demo only) --------------------------
function seedGoals() {
  const now = Date.now();
  return [
    {
      id: uid('g'),
      title: 'Run a 10K',
      category: 'Fitness',
      difficulty: 'medium',
      status: 'active',
      description: 'Build up from casual jogging to finishing a 10K race without stopping.',
      created_at: now - 12 * GOALS_DAY,
      target_date: now + 40 * GOALS_DAY,
      objectives: [
        {id: uid('o'), text: 'Run three times a week for two weeks straight', done: true},
        {id: uid('o'), text: 'Complete a continuous 5K run', done: true},
        {id: uid('o'), text: 'Sign up for a local 10K race', done: false},
      ],
    },
    {
      id: uid('g'),
      title: 'Learn conversational Spanish',
      category: 'Learning',
      difficulty: 'hard',
      status: 'active',
      description: 'Get to the point of holding a basic unscripted conversation on a trip.',
      created_at: now - 30 * GOALS_DAY,
      target_date: now + 90 * GOALS_DAY,
      objectives: [],
    },
    {
      id: uid('g'),
      title: 'Repaint the living room',
      category: 'Home',
      difficulty: 'easy',
      status: 'completed',
      description: 'Freshen up the living room walls before the holidays.',
      created_at: now - 70 * GOALS_DAY,
      completed_at: now - 5 * GOALS_DAY,
      target_date: now - 8 * GOALS_DAY,
      objectives: [
        {id: uid('o'), text: 'Pick a paint colour and buy supplies', done: true},
        {id: uid('o'), text: 'Move furniture and mask the trim', done: true},
        {id: uid('o'), text: 'Paint two coats and let it cure', done: true},
      ],
    },
  ];
}

function loadGoals() {
  try {
    const raw = JSON.parse(localStorage.getItem(GOALS_KEY));
    if (Array.isArray(raw) && raw.length) return raw;
  } catch {}
  const seeded = seedGoals();
  localStorage.setItem(GOALS_KEY, JSON.stringify(seeded));
  return seeded;
}
function saveGoals(goals) { localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }

function parseDateInputToMs(dateStr) {
  if (!dateStr) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if (!m) return null;
  const year = Number(m[1]), month = Number(m[2]), day = Number(m[3]);
  return new Date(year, month - 1, day).getTime();
}
function fmtRelDay(ms) {
  const now = Date.now();
  const days = Math.round((ms - now) / GOALS_DAY);
  if (days === 0) return 'today';
  if (days > 0) return 'in ' + days + 'd';
  return Math.abs(days) + 'd ago';
}
function fmtAgeShort(ms) {
  const days = Math.round((Date.now() - ms) / GOALS_DAY);
  if (days < 1) return 'today';
  if (days < 30) return days + 'd ago';
  if (days < 365) return Math.round(days/30) + 'mo ago';
  return Math.round(days/365) + 'y ago';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Fixture "AI" objectives (the audited fix lives here) -----------------
// buildFixtureObjectives(goal) is a pure, local, deterministic function. It
// takes the goal's own fields and fills a small set of realistic-looking
// mini-objective templates — no fetch, no XHR, no WebSocket, nothing that
// leaves this page. This is the ENTIRE code path generateObjectives() calls.
function buildFixtureObjectives(goal) {
  const t = goal.title.trim().replace(/\.$/, '');
  const templatesByDifficulty = {
    easy: [
      `Write down exactly what "done" looks like for ${t}`,
      `Do the first small task toward ${t}`,
      `Finish the remaining steps for ${t}`,
      `Double-check the result and close it out`,
    ],
    medium: [
      `Research what "success" looks like for ${t} and write a one-line definition`,
      `Break ${t} into 3 weekly milestones`,
      `Complete the first milestone toward ${t}`,
      `Check in on progress halfway through and adjust the plan`,
      `Finish the final push and mark ${t} complete`,
    ],
    hard: [
      `Map out the full plan for ${t}, including the hardest unknowns first`,
      `Line up any resources, tools, or people needed for ${t}`,
      `Complete the first big milestone toward ${t}`,
      `Reassess the plan at the halfway point and cut scope if needed`,
      `Push through the hardest remaining piece of ${t}`,
      `Wrap up loose ends and confirm ${t} is actually done`,
    ],
    epic: [
      `Write a short plan for ${t} and identify the 2-3 riskiest parts`,
      `Tackle the riskiest part of ${t} first, while there's runway to recover`,
      `Hit the first major checkpoint on ${t}`,
      `Reassess scope and timeline at the midpoint of ${t}`,
      `Hit the second major checkpoint on ${t}`,
      `Do a final review pass before calling ${t} complete`,
    ],
  };
  const base = templatesByDifficulty[goal.difficulty] || templatesByDifficulty.medium;
  // Skip anything that duplicates an existing objective's wording (case-insensitive).
  const existing = new Set(goal.objectives.map(o => o.text.trim().toLowerCase()));
  return base.filter(txt => !existing.has(txt.trim().toLowerCase()));
}

// Hardcoded fixture RESPONSE OBJECT, shaped exactly like the real
// generate-objectives Edge Function's JSON response ({objectives: [...]})
// would be. Built once per call from buildFixtureObjectives() above — no
// network, no randomness sourced from anywhere but Math.random() for ids.
function fixtureObjectivesResponse(goal) {
  return { objectives: buildFixtureObjectives(goal) };
}

// generateObjectives(): the fixed code path.
// BEFORE (audit finding): this function issued a live fetch()/network call.
// NOW: it is 100% local. The only asynchrony is a cosmetic setTimeout so the
// button's loading spinner is visible, matching the real feature's UX while
// guaranteeing zero I/O. Confirmed: no fetch, no XMLHttpRequest, no
// WebSocket, no supabase client, no import of any kind, anywhere in this file.
function generateObjectives(goal) {
  return new Promise(resolve => {
    setTimeout(() => resolve(fixtureObjectivesResponse(goal)), 550 + Math.random() * 300);
  });
}

// ---- State ------------------------------------------------------------
const state = {
  goals: loadGoals(),
  showForm: false,
  openId: null,
  generatingId: null,
  genErrors: {},
};

function setGoals(next) {
  state.goals = next;
  saveGoals(state.goals);
  render();
}

function toggleObjective(goalId, objId) {
  setGoals(state.goals.map(g => g.id !== goalId ? g : {
    ...g, objectives: g.objectives.map(o => o.id !== objId ? o : {...o, done: !o.done}),
  }));
}

function addGoal(g) {
  state.goals = [g, ...state.goals];
  saveGoals(state.goals);
  state.showForm = false;
  render();
}

async function onGenerateClick(goalId) {
  if (state.generatingId) return;
  const goal = state.goals.find(g => g.id === goalId);
  if (!goal) return;
  state.generatingId = goalId;
  state.genErrors[goalId] = '';
  render();
  try {
    const out = await generateObjectives(goal); // <-- fixture-only, no network (see above)
    const fresh = (out.objectives || []).map((text, i) => ({id: uid('o') + i, text, done: false}));
    state.goals = state.goals.map(g => g.id !== goalId ? g : {...g, objectives: [...g.objectives, ...fresh]});
    saveGoals(state.goals);
  } catch (e) {
    state.genErrors[goalId] = 'Couldn\'t generate objectives: ' + e;
  }
  state.generatingId = null;
  render();
}

// ---- Rendering ----------------------------------------------------------
const root = document.getElementById('root');

function goalBoxHtml(g, i, total) {
  const diff = DIFFICULTY[g.difficulty];
  const color = GOAL_STATUS_COLOR[g.status];
  const overdue = g.status === 'active' && g.target_date != null && g.target_date < Date.now();
  const objTotal = g.objectives.length;
  const done = g.objectives.filter(o => o.done).length;
  const ratio = objTotal ? done / objTotal : 0;
  const meterColor = overdue ? '#ff7b72' : color;
  let dateLine;
  if (g.status === 'completed') dateLine = 'completed ' + fmtAgeShort(g.completed_at);
  else if (g.status === 'active') dateLine = (overdue ? 'was due ' : 'due ') + fmtRelDay(g.target_date);
  else dateLine = 'target ' + fmtRelDay(g.target_date);
  const open = state.openId === g.id;
  const generating = state.generatingId === g.id;
  const genErr = state.genErrors[g.id];

  return `
  <div class="goal-row">
    <div class="goal-connector">
      <span class="goal-node-dot" style="color:${color}"></span>
      ${i < total - 1 ? '<span class="goal-node-line"></span>' : ''}
    </div>
    <div class="goal-box" data-goal="${g.id}" data-action="toggle-open">
      <div class="goal-box-head">
        <p style="font-size:15px;font-weight:700;margin:0 0 2px">${esc(g.title)}</p>
        <span class="pill" style="background:${diff.color}22;color:${diff.color};border:1px solid ${diff.color}55">${diff.label}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="badge"><span class="dot${g.status==='active'?' pulse':''}" style="background:${color}"></span><span style="color:${color}">${g.status}</span></span>
        <span class="small">${esc(g.category)}</span>
        ${g.target_date != null ? `<span class="small">·</span><span class="small" style="color:${overdue ? '#ff7b72' : '#9aa3ad'}">${dateLine}</span>` : ''}
      </div>
      <div class="meter"><div style="width:${ratio*100}%;background:${meterColor}"></div></div>
      <div class="goal-obj-count">${done} / ${objTotal} mini-objectives</div>
      ${open ? `
        <div class="goal-desc">${esc(g.description)}</div>
        <div class="goal-checklist">
          ${g.objectives.map(o => `
            <label class="goal-obj${o.done ? ' done' : ''}" data-action="stop">
              <input type="checkbox" ${o.done ? 'checked' : ''} data-goal="${g.id}" data-obj="${o.id}" data-action="toggle-obj">
              <span>${esc(o.text)}</span>
            </label>`).join('')}
        </div>
        <button type="button" class="genbtn" data-goal="${g.id}" data-action="generate" ${generating ? 'disabled' : ''}>
          ${generating
            ? `<span class="genrow"><span class="genspinner"></span>Generating…</span>`
            : (objTotal ? '✨ Auto-generate more mini-objectives' : '✨ Auto-generate mini-objectives')}
        </button>
        ${genErr ? `<p class="err" style="padding:4px 0 0">${esc(genErr)}</p>` : ''}
      ` : ''}
    </div>
  </div>`;
}

function render() {
  const g = state.goals;
  const doneTotal = g.reduce((n, x) => n + x.objectives.filter(o => o.done).length, 0);
  root.innerHTML = `
    <header>
      <h1>Alleah</h1>
      <span class="badge"><span class="dot" style="background:#3ecf8e"></span><span>Goals</span></span>
    </header>
    <p class="subtitle">Preview build · Goals tab · auto-generate mini-objectives fix</p>
    <div id="goals">
      ${g.length ? `
        <div class="summary">
          <span><b>${g.length}</b> goals</span>
          <span><b>${doneTotal}</b> objectives done</span>
        </div>` : ''}
      ${state.showForm ? newGoalFormHtml() : `<button type="button" class="newgoalbtn" data-action="show-form">+ New goal</button>`}
      ${g.length === 0 && !state.showForm ? `<p class="muted" style="padding:16px 2px">No goals yet - add your first.</p>` : ''}
      ${g.length ? `<div class="goal-path" style="margin-top:10px">${g.map((goal, i) => goalBoxHtml(goal, i, g.length)).join('')}</div>` : ''}
    </div>
  `;
  wire();
}

function newGoalFormHtml() {
  return `
  <form class="card addform" data-action="add-form">
    <input name="title" placeholder="Goal title" autofocus>
    <div class="row2">
      <input name="category" placeholder="Category (optional)">
      <select name="difficulty">
        ${Object.keys(DIFFICULTY).map(k => `<option value="${k}" ${k==='medium'?'selected':''}>${DIFFICULTY[k].label}</option>`).join('')}
      </select>
    </div>
    <input name="targetDate" type="date">
    <textarea name="description" placeholder="Description (optional)" rows="3" style="min-height:70px"></textarea>
    <div class="row">
      <button type="submit">Add goal</button>
      <button type="button" class="secondary" data-action="cancel-form">Cancel</button>
    </div>
  </form>`;
}

function wire() {
  root.querySelectorAll('[data-action="show-form"]').forEach(el => el.addEventListener('click', () => {
    state.showForm = true; render();
  }));
  root.querySelectorAll('[data-action="cancel-form"]').forEach(el => el.addEventListener('click', () => {
    state.showForm = false; render();
  }));
  const form = root.querySelector('[data-action="add-form"]');
  if (form) form.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(form);
    const title = String(fd.get('title') || '').trim();
    if (!title) return;
    addGoal({
      id: uid('g'),
      title,
      category: String(fd.get('category') || '').trim() || 'General',
      difficulty: String(fd.get('difficulty') || 'medium'),
      status: 'active',
      description: String(fd.get('description') || '').trim(),
      created_at: Date.now(),
      target_date: parseDateInputToMs(String(fd.get('targetDate') || '')),
      objectives: [],
    });
  });
  root.querySelectorAll('[data-action="toggle-open"]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('[data-action="stop"]') || e.target.closest('[data-action="generate"]')) return;
    const id = el.getAttribute('data-goal');
    state.openId = state.openId === id ? null : id;
    render();
  }));
  root.querySelectorAll('[data-action="toggle-obj"]').forEach(el => el.addEventListener('change', () => {
    toggleObjective(el.getAttribute('data-goal'), el.getAttribute('data-obj'));
  }));
  root.querySelectorAll('[data-action="generate"]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    onGenerateClick(el.getAttribute('data-goal'));
  }));
}

render();
</script>

}

.apo-log {
  position: fixed;
  left: 14px;
  bottom: 54px;
  width: 260px;
  max-height: 45vh;
  overflow-y: auto;
  pointer-events: auto;
  z-index: 2147483001;
  background: #fffdf8;
  border: 1px solid #c9c2b6;
  border-radius: 8px;
  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3);
  padding: 10px;
  font: 12px/1.45 system-ui, sans-serif;
  color: #333;
}

.apo-log h3 {
  margin: 0 0 6px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #8a8478;
}

.apo-log-item { border-top: 1px solid #eee7da; padding: 6px 0; }
.apo-log-item:first-of-type { border-top: 0; }
.apo-log-rev { color: #8a8478; font-size: 11px; }
.apo-hidden { display: none; }
</style>
<script type="application/json" id="alleah-pin-config">{"task_id": "2f543e65-1870-46e7-a86c-98774feafdfc", "revision": 0, "deploy_marker": "2f543e65-r0-1785488474", "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "review_endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/request-review", "changelog": []}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
