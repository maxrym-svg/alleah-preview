<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah — Goals (preview)</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
.hdr-badge{font-size:11px;font-weight:700;letter-spacing:.03em;color:#9aa3ad;background:#1a1d23;border:1px solid #2c313a;border-radius:999px;padding:5px 11px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;height:44px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;height:auto;border-radius:8px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:10px;padding:12px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#9aa3ad;font-size:14px}
#goals{flex:1;overflow-y:auto;padding:8px 14px 24px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.meter>div{height:100%;border-radius:4px}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:2px 2px 10px;color:#9aa3ad;font-size:12px}
.summary b{color:#e6e6e6}
.goal-desc{white-space:pre-wrap;background:#0f1115;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;font-size:13.5px;color:#c7ccd3}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.addform .row2{display:flex;gap:8px}
.addform .row2>*{flex:1}
.newgoalbtn{width:100%;text-align:left;background:#1a1d23;color:#9aa3ad;border:1px dashed #2c313a}
.goal-path{display:flex;flex-direction:column}
.goal-row{display:flex;gap:10px}
.goal-connector{display:flex;flex-direction:column;align-items:center;width:18px;flex:none}
.goal-node-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:14px;box-shadow:0 0 0 3px #0f1115,0 0 0 4.5px currentColor}
.goal-node-line{width:2px;flex:1;min-height:22px;background:#2c313a;margin:4px 0}
.goal-box{flex:1;min-width:0;background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.goal-box-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-obj-count{font-size:12px;color:#9aa3ad}
.goal-checklist{margin-top:10px;padding-top:10px;border-top:1px solid #2c313a;display:flex;flex-direction:column;gap:2px}
.goal-obj{display:flex;align-items:center;gap:10px;min-height:44px}
.goal-obj input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#3ecf8e;cursor:pointer}
.goal-obj span{font-size:14px;flex:1;cursor:pointer}
.goal-obj.done span{text-decoration:line-through;color:#9aa3ad}
.goal-obj-del{flex:none;width:26px;height:26px;background:transparent;color:#9aa3ad;border:1px solid #2c313a;border-radius:8px;font-size:15px;line-height:1;padding:0;cursor:pointer}
.goal-obj-del:active{background:#2c313a;color:#ff7b72}
.goal-addstep{display:flex;gap:8px;margin-top:8px}
.goal-addstep input{flex:1;padding:10px 12px}
.goal-addstep button{flex:none;padding:0 14px;height:40px}
.goal-step-status{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:8px}
.goal-step-status.generating{color:#9aa3ad}
.goal-step-status.err{color:#e0a458}
.goal-step-status button{padding:2px 10px;font-size:11px;height:auto;border-radius:8px}
.demo-banner{margin:8px 14px 0;padding:8px 12px;background:#1a1d23;border:1px solid #3ecf8e55;border-radius:10px;color:#9aa3ad;font-size:12px}
.demo-banner b{color:#3ecf8e}
</style></head><body>
<div id="root"></div>
<script>
"use strict";
// ============================================================================
// SEALED PREVIEW — Goals tab with mini-objective generation.
// This bundle is fully self-contained: no imports, no CDNs, no fetch/XHR/
// WebSocket calls anywhere in this file. Mini-objective "generation" below is
// a HARDCODED DEMO FIXTURE (see DEMO_STEP_TEMPLATES / demoGenerateSteps) that
// simulates the real /functions/v1/goal-steps Edge Function response shape
// ({steps: [string, ...]}) with a plain setTimeout delay. Nothing here talks
// to a network. Everything else (checklist state, add/delete step, localStorage
// persistence) mirrors the real app's behaviour.
// ============================================================================

var GOALS_KEY = "alleah_goals_demo_v1"; // demo-only storage key, isolated from the real app

var DIFFICULTY = {
  easy:   {label: 'Easy',   color: '#3ecf8e'},
  medium: {label: 'Medium', color: '#58a6ff'},
  hard:   {label: 'Hard',   color: '#e0a458'},
  epic:   {label: 'Epic',   color: '#d68fff'},
};
var GOAL_STATUS_COLOR = {active:'#3ecf8e', completed:'#3ecf8e', paused:'#e0a458', abandoned:'#5c636e'};
var GOALS_DAY = 86400000;

function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function parseDateInputToMs(dateStr) {
  if (!dateStr) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if (!m) return null;
  var year = Number(m[1]), month = Number(m[2]), day = Number(m[3]);
  return new Date(year, month - 1, day).getTime();
}
function fmtRelDay(ms) {
  var days = Math.round((ms - Date.now()) / GOALS_DAY);
  if (days === 0) return 'today';
  if (days > 0) return 'in ' + days + 'd';
  return Math.abs(days) + 'd ago';
}
function fmtAgeShort(ms) {
  var days = Math.round((Date.now() - ms) / GOALS_DAY);
  if (days < 1) return 'today';
  if (days < 30) return days + 'd ago';
  if (days < 365) return Math.round(days/30) + 'mo ago';
  return Math.round(days/365) + 'y ago';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ===== DEMO FIXTURE: goal-steps generation (no network, hardcoded) =====
// Mirrors the real Edge Function's step counts (4 easy / 5 medium-hard / 6 epic)
// and returns short, goal-title-flavoured strings from a fixed local template
// pool - never a live model call. Typing "fail demo" as the goal title is a
// demo-only escape hatch to preview the fallback ("steps unavailable") state.
var DEMO_STEP_TEMPLATES = {
  easy: [
    function(t){ return 'Write down why "' + t + '" matters to you'; },
    function(t){ return 'Pick one concrete first action'; },
    function(t){ return 'Block 20 minutes on the calendar this week'; },
    function(t){ return 'Tell one person about this goal'; },
  ],
  medium: [
    function(t){ return 'Define what "done" looks like for "' + t + '"'; },
    function(t){ return 'Break it into 3 weekly milestones'; },
    function(t){ return 'List the resources or tools you need'; },
    function(t){ return 'Do the first milestone'; },
    function(t){ return 'Check in on progress with someone'; },
  ],
  hard: [
    function(t){ return 'Research how others have done "' + t + '"'; },
    function(t){ return 'Draft a rough plan with 4-5 phases'; },
    function(t){ return 'Identify the riskiest part and tackle it first'; },
    function(t){ return 'Set a monthly checkpoint'; },
    function(t){ return 'Recruit an accountability partner'; },
  ],
  epic: [
    function(t){ return 'Write a one-page vision for "' + t + '"'; },
    function(t){ return 'Break it into quarterly phases'; },
    function(t){ return 'Budget the time and money it will take'; },
    function(t){ return 'Identify the first small milestone'; },
    function(t){ return 'Find a mentor or community for this'; },
    function(t){ return 'Schedule a quarterly progress review'; },
  ],
};

function demoGenerateSteps(goal) {
  return new Promise(function(resolve, reject) {
    setTimeout(function() {
      // Demo-only escape hatch so the fallback UI is easy to preview.
      if (goal.title.trim().toLowerCase() === 'fail demo') {
        reject(new Error('demo: generation failed'));
        return;
      }
      var templates = DEMO_STEP_TEMPLATES[goal.difficulty] || DEMO_STEP_TEMPLATES.medium;
      resolve(templates.map(function(fn){ return fn(goal.title); }));
    }, 900);
  });
}

function stepsToObjectives(steps) {
  return steps.map(function(text){ return {id: uid('o'), text: text, done: false}; });
}

// ===== Demo fixtures (generic synthetic data, not user data) =====
function seedGoals() {
  var now = Date.now();
  return [
    {
      id: uid('g'), title: 'Run a 10k', category: 'Fitness', difficulty: 'medium', status: 'active',
      description: 'Build up from zero to a comfortable 10k, mostly running before work.',
      created_at: now - 12 * GOALS_DAY, target_date: now + 40 * GOALS_DAY,
      generating: false, stepsError: false,
      objectives: [
        {id: uid('o'), text: 'Define what "done" looks like for "Run a 10k"', done: true},
        {id: uid('o'), text: 'Break it into 3 weekly milestones', done: true},
        {id: uid('o'), text: 'List the resources or tools you need', done: false},
        {id: uid('o'), text: 'Do the first milestone', done: false},
        {id: uid('o'), text: 'Check in on progress with someone', done: false},
      ],
    },
    {
      id: uid('g'), title: 'Learn conversational Spanish', category: 'Learning', difficulty: 'hard', status: 'active',
      description: 'Get to the point of holding a 10-minute unscripted conversation.',
      created_at: now - 30 * GOALS_DAY, target_date: now + 5 * GOALS_DAY,
      generating: false, stepsError: false,
      objectives: [
        {id: uid('o'), text: 'Research how others have done "Learn conversational Spanish"', done: true},
        {id: uid('o'), text: 'Draft a rough plan with 4-5 phases', done: false},
        {id: uid('o'), text: 'Identify the riskiest part and tackle it first', done: false},
      ],
    },
    {
      id: uid('g'), title: 'Save an emergency fund', category: 'Finance', difficulty: 'easy', status: 'completed',
      description: 'Three months of basic expenses set aside in a separate account.',
      created_at: now - 200 * GOALS_DAY, target_date: null, completed_at: now - 14 * GOALS_DAY,
      generating: false, stepsError: false,
      objectives: [
        {id: uid('o'), text: 'Write down why "Save an emergency fund" matters to you', done: true},
        {id: uid('o'), text: 'Pick one concrete first action', done: true},
        {id: uid('o'), text: 'Block 20 minutes on the calendar this week', done: true},
        {id: uid('o'), text: 'Tell one person about this goal', done: true},
      ],
    },
  ];
}

function loadGoals() {
  try {
    var raw = JSON.parse(localStorage.getItem(GOALS_KEY));
    return Array.isArray(raw) ? raw : null;
  } catch (e) { return null; }
}
function saveGoals(goals) {
  try { localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); } catch (e) {}
}

// ===== App state + render =====
var state = { goals: loadGoals(), showForm: false, openIds: {} };
if (!state.goals) state.goals = seedGoals();

function setGoals(updater) {
  state.goals = updater(state.goals);
  saveGoals(state.goals);
  render();
}

function toggleObjective(goalId, objId) {
  setGoals(function(gs){ return gs.map(function(g){
    if (g.id !== goalId) return g;
    return Object.assign({}, g, {objectives: g.objectives.map(function(o){
      return o.id !== objId ? o : Object.assign({}, o, {done: !o.done});
    })});
  }); });
}

function addStep(goalId, text) {
  setGoals(function(gs){ return gs.map(function(g){
    if (g.id !== goalId) return g;
    return Object.assign({}, g, {objectives: g.objectives.concat([{id: uid('o'), text: text, done: false}])});
  }); });
}

function deleteStep(goalId, objId) {
  setGoals(function(gs){ return gs.map(function(g){
    if (g.id !== goalId) return g;
    return Object.assign({}, g, {objectives: g.objectives.filter(function(o){ return o.id !== objId; })});
  }); });
}

function requestSteps(goal) {
  setGoals(function(gs){ return gs.map(function(g){
    return g.id !== goal.id ? g : Object.assign({}, g, {generating: true, stepsError: false});
  }); });
  demoGenerateSteps(goal).then(function(steps){
    setGoals(function(gs){ return gs.map(function(g){
      if (g.id !== goal.id) return g;
      return Object.assign({}, g, {
        generating: false, stepsError: false,
        objectives: g.objectives.concat(stepsToObjectives(steps)),
      });
    }); });
  }).catch(function(){
    setGoals(function(gs){ return gs.map(function(g){
      return g.id !== goal.id ? g : Object.assign({}, g, {generating: false, stepsError: true});
    }); });
  });
}

function retrySteps(goalId) {
  var g = state.goals.find(function(x){ return x.id === goalId; });
  if (g) requestSteps(g);
}

function addGoal(g) {
  state.goals = [g].concat(state.goals);
  saveGoals(state.goals);
  render();
  requestSteps(g);
}

function toggleOpen(goalId) {
  state.openIds[goalId] = !state.openIds[goalId];
  render();
}

// ===== Rendering (vanilla DOM, no framework) =====
var root = document.getElementById('root');

function renderGoalBox(g) {
  var diff = DIFFICULTY[g.difficulty];
  var color = GOAL_STATUS_COLOR[g.status];
  var overdue = g.status === 'active' && g.target_date != null && g.target_date < Date.now();
  var total = g.objectives.length;
  var done = g.objectives.filter(function(o){ return o.done; }).length;
  var ratio = total ? done / total : 0;
  var meterColor = overdue ? '#ff7b72' : color;
  var open = !!state.openIds[g.id];
  var dateLine;
  if (g.status === 'completed') dateLine = 'completed ' + fmtAgeShort(g.completed_at);
  else if (g.status === 'active') dateLine = (overdue ? 'was due ' : 'due ') + (g.target_date != null ? fmtRelDay(g.target_date) : 'no date');
  else dateLine = g.target_date != null ? ('target ' + fmtRelDay(g.target_date)) : '';

  var box = document.createElement('div');
  box.className = 'goal-box';
  box.innerHTML =
    '<div class="goal-box-head">' +
      '<p style="font-size:15px;font-weight:700;margin:0 0 2px">' + esc(g.title) + '</p>' +
      '<span class="pill" style="background:' + diff.color + '22;color:' + diff.color + ';border:1px solid ' + diff.color + '55">' + diff.label + '</span>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<span class="badge"><span class="dot' + (g.status==='active'?' pulse':'') + '" style="background:' + color + '"></span><span style="color:' + color + '">' + g.status + '</span></span>' +
      '<span class="small">' + esc(g.category) + '</span>' +
      (dateLine ? '<span class="small">·</span><span class="small" style="color:' + (overdue ? '#ff7b72' : '#9aa3ad') + '">' + dateLine + '</span>' : '') +
    '</div>' +
    '<div class="meter"><div style="width:' + (ratio*100) + '%;background:' + meterColor + '"></div></div>' +
    '<div class="goal-obj-count">' + done + ' / ' + total + ' mini-objectives</div>' +
    (g.generating ? '<div class="goal-step-status generating pulse">generating steps...</div>' : '') +
    (!g.generating && g.stepsError ? '<div class="goal-step-status err"><span>steps unavailable - add manually</span><button type="button" class="secondary" data-action="retry">Retry</button></div>' : '');

  box.addEventListener('click', function(e){
    if (e.target.closest('[data-stop]') || e.target.closest('.goal-checklist') || e.target.closest('[data-action]')) return;
    toggleOpen(g.id);
  });
  var retryBtn = box.querySelector('[data-action="retry"]');
  if (retryBtn) retryBtn.addEventListener('click', function(e){ e.stopPropagation(); retrySteps(g.id); });

  if (open) {
    var openWrap = document.createElement('div');
    var desc = document.createElement('div');
    desc.className = 'goal-desc';
    desc.textContent = g.description || '(no description)';
    openWrap.appendChild(desc);

    var checklist = document.createElement('div');
    checklist.className = 'goal-checklist';
    checklist.setAttribute('data-stop', '1');
    checklist.addEventListener('click', function(e){ e.stopPropagation(); });

    g.objectives.forEach(function(o){
      var row = document.createElement('div');
      row.className = 'goal-obj' + (o.done ? ' done' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = o.done;
      cb.addEventListener('change', function(){ toggleObjective(g.id, o.id); });
      var span = document.createElement('span');
      span.textContent = o.text;
      span.addEventListener('click', function(){ toggleObjective(g.id, o.id); });
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'goal-obj-del'; del.setAttribute('aria-label', 'Delete step');
      del.textContent = '×';
      del.addEventListener('click', function(){ deleteStep(g.id, o.id); });
      row.appendChild(cb); row.appendChild(span); row.appendChild(del);
      checklist.appendChild(row);
    });

    var addForm = document.createElement('form');
    addForm.className = 'goal-addstep';
    var addInput = document.createElement('input');
    addInput.placeholder = '+ add step';
    var addBtn = document.createElement('button');
    addBtn.type = 'submit'; addBtn.className = 'secondary'; addBtn.textContent = 'Add';
    addForm.appendChild(addInput); addForm.appendChild(addBtn);
    addForm.addEventListener('submit', function(e){
      e.preventDefault();
      var t = addInput.value.trim();
      if (!t) return;
      addStep(g.id, t);
    });
    checklist.appendChild(addForm);

    openWrap.appendChild(checklist);
    box.appendChild(openWrap);
  }
  return box;
}

function renderNewGoalForm() {
  var form = document.createElement('form');
  form.className = 'card addform';
  form.innerHTML =
    '<input data-f="title" placeholder="Goal title" autofocus>' +
    '<div class="row2">' +
      '<input data-f="category" placeholder="Category (optional)">' +
      '<select data-f="difficulty">' +
        Object.keys(DIFFICULTY).map(function(k){ return '<option value="' + k + '">' + DIFFICULTY[k].label + '</option>'; }).join('') +
      '</select>' +
    '</div>' +
    '<input data-f="target" type="date">' +
    '<textarea data-f="description" rows="3" style="min-height:70px" placeholder="Description (optional)"></textarea>' +
    '<div class="row"><button type="submit">Add goal</button><button type="button" class="secondary" data-action="cancel">Cancel</button></div>';
  form.querySelector('[data-f="difficulty"]').value = 'medium';
  form.querySelector('[data-action="cancel"]').addEventListener('click', function(){
    state.showForm = false; render();
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var title = form.querySelector('[data-f="title"]').value.trim();
    if (!title) return;
    addGoal({
      id: uid('g'),
      title: title,
      category: form.querySelector('[data-f="category"]').value.trim() || 'General',
      difficulty: form.querySelector('[data-f="difficulty"]').value,
      status: 'active',
      description: form.querySelector('[data-f="description"]').value.trim(),
      created_at: Date.now(),
      target_date: parseDateInputToMs(form.querySelector('[data-f="target"]').value),
      objectives: [],
      generating: false,
      stepsError: false,
    });
    state.showForm = false;
  });
  return form;
}

function render() {
  root.innerHTML = '';

  var header = document.createElement('header');
  header.innerHTML = '<h1>Alleah</h1><span class="hdr-badge">Goals · preview</span>';
  root.appendChild(header);

  var banner = document.createElement('div');
  banner.className = 'demo-banner';
  banner.innerHTML = '<b>Demo preview</b> — mini-objective generation below is a hardcoded fixture (no network calls). Try adding a goal titled "fail demo" to see the fallback state.';
  root.appendChild(banner);

  var wrap = document.createElement('div');
  wrap.id = 'goals';

  if (state.goals.length) {
    var doneCount = state.goals.reduce(function(n,g){ return n + g.objectives.filter(function(o){return o.done;}).length; }, 0);
    var summary = document.createElement('div');
    summary.className = 'summary';
    summary.innerHTML = '<span><b>' + state.goals.length + '</b> goals</span><span><b>' + doneCount + '</b> objectives done</span>';
    wrap.appendChild(summary);
  }

  if (state.showForm) {
    wrap.appendChild(renderNewGoalForm());
  } else {
    var newBtn = document.createElement('button');
    newBtn.type = 'button'; newBtn.className = 'newgoalbtn';
    newBtn.textContent = '+ New goal';
    newBtn.addEventListener('click', function(){ state.showForm = true; render(); });
    wrap.appendChild(newBtn);
  }

  if (!state.goals.length && !state.showForm) {
    var empty = document.createElement('p');
    empty.className = 'muted'; empty.style.padding = '16px 2px';
    empty.textContent = 'No goals yet - add your first.';
    wrap.appendChild(empty);
  }

  if (state.goals.length) {
    var path = document.createElement('div');
    path.className = 'goal-path'; path.style.marginTop = '10px';
    state.goals.forEach(function(g, i){
      var row = document.createElement('div');
      row.className = 'goal-row';
      var connector = document.createElement('div');
      connector.className = 'goal-connector';
      connector.innerHTML = '<span class="goal-node-dot" style="color:' + GOAL_STATUS_COLOR[g.status] + '"></span>' +
        (i < state.goals.length - 1 ? '<span class="goal-node-line"></span>' : '');
      row.appendChild(connector);
      row.appendChild(renderGoalBox(g));
      path.appendChild(row);
    });
    wrap.appendChild(path);
  }

  root.appendChild(wrap);
}

render();
</script>

<style>/* Alleah preview pin overlay. Injected inline by the worker at bundle time.
   All classes prefixed apo- to avoid colliding with app styles. */

.apo-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2147483000;
}

.apo-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #e05a33;
  color: #fff;
  font: 700 12px/22px system-ui, sans-serif;

<script type="application/json" id="alleah-pin-config">{"task_id": "4ede0e36-5681-49fc-be17-70bbed722b69", "revision": 0, "deploy_marker": "4ede0e36-r0-1785618173", "endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/submit-pins", "review_endpoint": "https://sphnmcjlxxzgovisgepo.supabase.co/functions/v1/request-review", "changelog": []}</script>
<script>/* Alleah preview pin overlay.
   Injected INLINE into bundle HTML by the worker at bundle time, together with
   a JSON config block in a script tag with id "alleah-pin-config" and type
   application/json, carrying: task_id, revision, endpoint, changelog[].
   NB: because this file is inlined into HTML, it must never contain the
   literal closing script tag sequence — not even in comments — and the worker
   must serialize the config JSON with "<" escaped as backslash-u003c for the same
   reason (a note containing that sequence would truncate the script element).
   Long-press (pointerdown held >500ms, <10px movement) drops a pin with an
   inline note. Pins batch in localStorage; "Send Feedback" posts the batch to
   the endpoint. All listeners are passive: taps, scrolls and swipes are never
   intercepted. Anchoring is stable-selector + normalized offset, never raw
   screen pixels. */
(function () {
  "use strict";

  var cfgEl = document.getElementById("alleah-pin-config");
  if (!cfgEl) return;
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { return; }

  var LP_MS = 500;
  var LP_SLOP_PX = 10;
  var storeKey = "apo-pins-" + cfg.task_id + "-r" + cfg.revision;

  function loadPins() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "[]"); }
    catch (e) { return []; }
  }
  function savePins(pins) {
    try { localStorage.setItem(storeKey, JSON.stringify(pins)); } catch (e) {}
  }

  /* ---------- stable selector: id > data-* > unique tag path ---------- */

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function isUnique(sel) {
    try { return document.querySelectorAll(sel).length === 1; } catch (e) { return false; }
  }

  function selectorFor(el) {
    if (el === document.body || el === document.documentElement) return "body";
    if (el.id && isUnique("#" + cssEscape(el.id))) return "#" + cssEscape(el.id);
    var i, a, sel;
    for (i = 0; i < el.attributes.length; i++) {
      a = el.attributes[i];
      if (a.name.indexOf("data-") === 0 && a.value) {
        sel = el.tagName.toLowerCase() + "[" + a.name + '="' + cssEscape(a.value) + '"]';
        if (isUnique(sel)) return sel;
      }
    }
    // Compose parent path with :nth-of-type until unique.
    var path = [];
    var node = el;
    while (node && node !== document.body) {
      var tag = node.tagName.toLowerCase();
      var nth = 1;
      var sib = node;
      while ((sib = sib.previousElementSibling)) {
        if (sib.tagName === node.tagName) nth++;
      }
      path.unshift(tag + ":nth-of-type(" + nth + ")");
      sel = "body > " + path.join(" > ");
      if (isUnique(sel)) return sel;
      node = node.parentElement;
    }
    return "body > " + path.join(" > ");
  }

  /* ---------- overlay chrome ---------- */

  var layer = document.createElement("div");
  layer.className = "apo-layer";

  var sendBtn = document.createElement("button");
  sendBtn.className = "apo-send";
  sendBtn.type = "button";

  var logToggle = document.createElement("button");
  logToggle.className = "apo-log-toggle";
  logToggle.type = "button";
  logToggle.textContent = "Changelog";

  var reviewBtn = document.createElement("button");
  reviewBtn.className = "apo-review";
  reviewBtn.type = "button";
  reviewBtn.textContent = "Request pre-ship review";

  var logPanel = document.createElement("div");
  logPanel.className = "apo-log apo-hidden";

  function buildChangelog() {
    var h = document.createElement("h3");
    h.textContent = "Previous feedback";
    logPanel.appendChild(h);
    var items = cfg.changelog || [];
    if (!items.length) {
      var p = document.createElement("div");
      p.className = "apo-log-item";
      p.textContent = "No prior feedback.";
      logPanel.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "apo-log-item";
      var rev = document.createElement("div");
      rev.className = "apo-log-rev";
      rev.textContent = "rev " + it.revision + (it.resolution ? " — " + it.resolution : "");
      var note = document.createElement("div");
      note.textContent = it.note;
      d.appendChild(note);
      d.appendChild(rev);
      logPanel.appendChild(d);
    });
  }

  /* ---------- pins ---------- */

  var pins = loadPins();          // [{selector, ox, oy, note, created_at, sent}]
  var markers = [];               // DOM nodes parallel to pins

  function updateSendBtn() {
    var unsent = pins.filter(function (p) { return !p.sent; }).length;
    sendBtn.textContent = unsent ? "Send Feedback (" + unsent + ")" : "Send Feedback";
    sendBtn.disabled = !unsent;
  }

  function positionMarker(m, pin) {
    var el = null;
    try { el = document.querySelector(pin.selector); } catch (e) {}
    if (!el) { m.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    m.style.display = "";
    m.style.left = (r.left + r.width * pin.ox) + "px";
    m.style.top = (r.top + r.height * pin.oy) + "px";
  }

  function repositionAll() {
    for (var i = 0; i < pins.length; i++) positionMarker(markers[i], pins[i]);
  }

  // setTimeout, not requestAnimationFrame: rAF stalls in backgrounded or
  // non-rendering tabs and would wedge the pending flag, leaving markers
  // frozen. 70ms is imperceptible for marker tracking.
  var repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () { repositionPending = false; repositionAll(); }, 70);
  }

  function addMarker(pin) {
    var m = document.createElement("div");
    m.className = "apo-pin" + (pin.sent ? " apo-sent" : "");
    m.textContent = String(pins.indexOf(pin) + 1);
    layer.appendChild(m);
    markers.push(m);
    positionMarker(m, pin);
  }

  function openNote(pin, marker) {
    var box = document.createElement("div");
    box.className = "apo-note";
    box.style.left = marker.style.left;
    box.style.top = marker.style.top;
    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.value = pin.note || "";
    var row = document.createElement("div");
    row.className = "apo-note-row";
    var del = document.createElement("button");
    del.className = "apo-btn";
    del.type = "button";
    del.textContent = "Remove";
    var ok = document.createElement("button");
    ok.className = "apo-btn apo-btn-primary";
    ok.type = "button";
    ok.textContent = "Save";
    row.appendChild(del);
    row.appendChild(ok);
    box.appendChild(ta);
    box.appendChild(row);
    layer.appendChild(box);
    ta.focus();

    ok.addEventListener("click", function () {
      pin.note = ta.value.trim();
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
    del.addEventListener("click", function () {
      var idx = pins.indexOf(pin);
      if (idx >= 0) {
        pins.splice(idx, 1);
        markers[idx].remove();
        markers.splice(idx, 1);
        markers.forEach(function (mm, i2) { mm.textContent = String(i2 + 1); });
      }
      savePins(pins);
      updateSendBtn();
      box.remove();
    });
  }

  function dropPin(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el || layer.contains(el) || el === sendBtn || el === logToggle || logPanel.contains(el)) return;
    var r = el.getBoundingClientRect();
    var pin = {
      selector: selectorFor(el),
      ox: r.width ? (clientX - r.left) / r.width : 0.5,
      oy: r.height ? (clientY - r.top) / r.height : 0.5,
      note: "",
      route: location.pathname,
      vp: window.innerWidth + "x" + window.innerHeight,
      created_at: new Date().toISOString(),
      sent: false
    };
    pins.push(pin);
    savePins(pins);
    addMarker(pin);
    updateSendBtn();
    openNote(pin, markers[markers.length - 1]);
  }

  /* ---------- long-press detection (all passive) ---------- */

  var lp = null; // {x, y, timer}

  function cancelLP() {
    if (lp) { clearTimeout(lp.timer); lp = null; }
  }

  document.addEventListener("pointerdown", function (ev) {
    if (!ev.isPrimary) return;
    if (layer.contains(ev.target) || ev.target === sendBtn || ev.target === logToggle ||
        logPanel.contains(ev.target)) return;
    var x = ev.clientX, y = ev.clientY;
    cancelLP();
    lp = {
      x: x, y: y,
      timer: setTimeout(function () { lp = null; dropPin(x, y); }, LP_MS)
    };
  }, { passive: true });

  document.addEventListener("pointermove", function (ev) {
    if (!lp || !ev.isPrimary) return;
    if (Math.abs(ev.clientX - lp.x) > LP_SLOP_PX || Math.abs(ev.clientY - lp.y) > LP_SLOP_PX) cancelLP();
  }, { passive: true });

  document.addEventListener("pointerup", cancelLP, { passive: true });
  document.addEventListener("pointercancel", cancelLP, { passive: true });
  window.addEventListener("scroll", scheduleReposition, { passive: true, capture: true });
  window.addEventListener("resize", scheduleReposition, { passive: true });
  // Catch-all: app re-renders move anchor elements without any scroll event
  // (and backgrounded/non-rendering tabs deliver no scroll events at all).
  // A slow interval keeps markers glued to their elements regardless.
  setInterval(scheduleReposition, 500);

  /* ---------- send ---------- */

  sendBtn.addEventListener("click", function () {
    var unsent = pins.filter(function (p) { return !p.sent && p.note; });
    if (!unsent.length) {
      // Pins without notes count as unsent but are not worth submitting alone.
      unsent = pins.filter(function (p) { return !p.sent; });
      if (!unsent.length) return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Payload shape is the submit-pins edge function's contract — do not
        // add fields (revision is stamped server-side).
        task_id: cfg.task_id,
        pins: unsent.map(function (p) {
          return {
            element_selector: p.selector,
            offset_x: p.ox,
            offset_y: p.oy,
            page_route: p.route || location.pathname,
            note_text: p.note,
            viewport_size: p.vp || (window.innerWidth + "x" + window.innerHeight)
          };
        })
      })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      unsent.forEach(function (p) { p.sent = true; });
      savePins(pins);
      markers.forEach(function (m, i) {
        if (pins[i].sent) m.classList.add("apo-sent");
      });
      updateSendBtn();
    }).catch(function () {
      sendBtn.textContent = "Send failed — retry";
      sendBtn.disabled = false;
    });
  });

  logToggle.addEventListener("click", function () {
    logPanel.classList.toggle("apo-hidden");
  });

  /* ---------- request pre-ship review ---------- */

  reviewBtn.addEventListener("click", function () {
    if (!cfg.review_endpoint) return;
    reviewBtn.disabled = true;
    reviewBtn.textContent = "Requesting…";
    fetch(cfg.review_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: cfg.task_id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        return { ok: r.ok, data: data };
      });
    }).then(function (res) {
      var accepted = res.ok && res.data.error === undefined &&
                     res.data.accepted !== false && res.data.ok !== false;
      if (accepted) {
        reviewBtn.textContent = "Review queued";
        // stays disabled — one request per page visit
      } else {
        var reason = res.data.reason || res.data.error ||
                     "Not available right now";
        reviewBtn.textContent = String(reason).slice(0, 60);
        setTimeout(function () {
          reviewBtn.textContent = "Request pre-ship review";
          reviewBtn.disabled = false;
        }, 4000);
      }
    }).catch(function () {
      reviewBtn.textContent = "Network error — retry shortly";
      setTimeout(function () {
        reviewBtn.textContent = "Request pre-ship review";
        reviewBtn.disabled = false;
      }, 4000);
    });
  });

  /* ---------- mount ---------- */

  function mount() {
    document.body.appendChild(layer);
    document.body.appendChild(sendBtn);
    if (cfg.review_endpoint) document.body.appendChild(reviewBtn);
    document.body.appendChild(logToggle);
    document.body.appendChild(logPanel);
    buildChangelog();
    pins.forEach(addMarker);
    updateSendBtn();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
<!-- alleah-overlay-end -->
